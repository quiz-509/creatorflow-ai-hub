<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard Client — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--sidebar:240px;--nav:60px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 20px 0 0;}
.nav-brand{width:var(--sidebar);flex-shrink:0;display:flex;align-items:center;padding:0 20px;gap:10px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-right{display:flex;align-items:center;gap:12px;}
.notif-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surf);border:1px solid var(--border-2);color:var(--text-2);position:relative;transition:all 180ms;}
.notif-btn:hover{color:var(--text);border-color:var(--border-3);}
.notif-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--v);border:1.5px solid var(--bg);}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);cursor:pointer;transition:all 180ms;}
.user-chip:hover{border-color:var(--border-3);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;}

/* SIDEBAR */
.sidebar{position:fixed;top:var(--nav);left:0;bottom:0;width:var(--sidebar);background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.sidebar-section{padding:16px 12px 8px;}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 160ms;position:relative;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(124,58,237,0.12);color:var(--vs);}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--v);}
.nav-item svg{opacity:0.7;flex-shrink:0;}
.nav-item.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:var(--v);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;}
.sidebar-bottom{margin-top:auto;padding:16px 12px;border-top:1px solid var(--border);}

/* MAIN */
.main{margin-left:var(--sidebar);padding-top:var(--nav);min-height:100vh;}
.main-inner{padding:32px 32px 80px;}

/* HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
.page-sub{font-size:14px;color:var(--text-2);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(124,58,237,0.6);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-green{background:linear-gradient(135deg,#059669,var(--green));color:#fff;box-shadow:0 4px 14px -4px rgba(16,185,129,0.45);}
.btn-green:hover{transform:translateY(-1px);box-shadow:0 8px 20px -4px rgba(16,185,129,0.6);}
.btn-sm{padding:6px 13px;font-size:12px;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden;transition:border-color 180ms;}
.stat-card:hover{border-color:var(--border-2);}
.stat-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;font-size:18px;}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-0.04em;line-height:1;margin-bottom:4px;}
.stat-label{font-size:12px;color:var(--text-3);font-weight:500;}
.stat-trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-top:8px;padding:3px 8px;border-radius:99px;}
.trend-up{background:rgba(16,185,129,0.1);color:var(--green);}
.trend-warn{background:rgba(245,158,11,0.1);color:var(--amber);}

/* GRID 2 COL */
.two-col{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;}

/* SECTION CARD */
.section-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.section-title{font-size:14px;font-weight:700;}
.section-link{font-size:12px;color:var(--vs);font-weight:500;}
.section-link:hover{text-decoration:underline;}

/* MISSIONS */
.mission-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);transition:background 150ms;}
.mission-item:last-child{border-bottom:none;}
.mission-item:hover{background:rgba(255,255,255,0.02);}
.mission-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:18px;}
.mission-info{flex:1;min-width:0;}
.mission-name{font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mission-meta{font-size:11px;color:var(--text-3);}
.mission-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-amber{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-purple{background:rgba(124,58,237,0.12);color:var(--vs);border:1px solid rgba(124,58,237,0.2);}
.badge-blue{background:rgba(6,182,212,0.10);color:var(--c);border:1px solid rgba(6,182,212,0.2);}
.mission-price{font-size:12px;font-weight:700;color:var(--text-2);}

/* PROPOSITIONS */
.prop-item{padding:16px 20px;border-bottom:1px solid var(--border);transition:background 150ms;}
.prop-item:last-child{border-bottom:none;}
.prop-item:hover{background:rgba(255,255,255,0.02);}
.prop-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.prop-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.prop-name{font-size:13px;font-weight:700;margin-bottom:1px;}
.prop-spec{font-size:11px;color:var(--text-3);}
.prop-price{margin-left:auto;font-size:14px;font-weight:800;color:var(--vs);}
.prop-msg{font-size:12px;color:var(--text-2);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prop-actions{display:flex;gap:8px;}

/* MESSAGES */
.msg-item{display:flex;align-items:flex-start;gap:11px;padding:14px 20px;border-bottom:1px solid var(--border);transition:background 150ms;cursor:pointer;}
.msg-item:last-child{border-bottom:none;}
.msg-item:hover{background:rgba(255,255,255,0.02);}
.msg-item.unread .msg-name{color:var(--text);}
.msg-item.unread .msg-preview{color:var(--text-2);}
.msg-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.msg-body{flex:1;min-width:0;}
.msg-name{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:2px;}
.msg-preview{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-time{font-size:10px;color:var(--text-3);flex-shrink:0;margin-top:2px;}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--v);flex-shrink:0;margin-top:6px;}

/* ACTIVITY */
.activity-item{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);}
.activity-item:last-child{border-bottom:none;}
.act-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.act-text{font-size:12px;color:var(--text-2);line-height:1.5;}
.act-text strong{color:var(--text);font-weight:600;}
.act-time{font-size:10px;color:var(--text-3);margin-top:3px;}

/* PROGRESS */
.prog-bar{height:4px;background:var(--surf-3);border-radius:99px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--v),var(--c));}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.04) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 80ms linear,top 80ms linear;}

.sidebar{transition:transform 280ms cubic-bezier(0.16,1,0.3,1);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99;}
.hamburger{display:none;width:36px;height:36px;border-radius:9px;background:var(--surf);border:1px solid var(--border-2);place-items:center;color:var(--text-2);flex-shrink:0;}
.hamburger:hover{color:var(--text);border-color:var(--border-3);}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr);}.two-col{grid-template-columns:1fr;}}
@media(max-width:768px){.sidebar{transform:translateX(-100%);}.sidebar.open{transform:translateX(0);}.sidebar-backdrop.open{display:block;}.main{margin-left:0;}.main-inner{padding:20px 16px 60px;}.stats-grid{grid-template-columns:repeat(2,1fr);}.hamburger{display:grid;}.nav-brand{width:auto;}}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = supabase;
const sb = createClient(
  'https://cjtglfutckaogsmwhfsv.supabase.co',
  'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei'
);

const Ic = {
  Grid:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>,
  Briefcase:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
  Users:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  Msg:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
  Invoice:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
  Settings:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
  Bell:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
  Plus:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  Arrow:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  Check:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Logout:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
  Star:(p)=><svg {...p} width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
};


const NAV_ITEMS = [
  {id:'overview', label:'Vue d\'ensemble', icon:<Ic.Grid/>},
  {id:'missions', label:'Mes missions', icon:<Ic.Briefcase/>, badge:2},
  {id:'props', label:'Propositions', icon:<Ic.Users/>, badge:3},
  {id:'messages', label:'Messages', icon:<Ic.Msg/>, badge:2, href:'messages.html'},
  {id:'invoices', label:'Factures', icon:<Ic.Invoice/>},
];

function App() {
  const [active, setActive] = useState('overview');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [user, setUser] = useState(null);
  const [initials, setInitials] = useState('??');
  const [prenom, setPrenom] = useState('');
  const [briefs, setBriefs] = useState([]);
  const [convs, setConvs] = useState([]);
  const [missions, setMissions] = useState([]);
  const [missionCount, setMissionCount] = useState(0);
  const [budgetTotal, setBudgetTotal] = useState(0);
  const [propositions, setPropositions] = useState([]);

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      if (!data.session) { window.location.href = 'connexion.html'; return; }
      const u = data.session.user;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', u.id).single();
      if (profile) {
        const p = profile.prenom || '';
        const n = profile.nom || '';
        setPrenom(p);
        setInitials(((p[0]||'?')+(n[0]||'?')).toUpperCase());
        setUser({ ...u, ...profile });
      } else {
        setUser(u);
      }
      const { data: b } = await sb.from('briefs').select('id,categorie,budget,delai,statut,created_at,description').eq('user_id', u.id).order('created_at', {ascending: false}).limit(4);
      setBriefs(b || []);
      const { data: c } = await sb.from('conversations').select('id,created_at,expert_id').eq('client_id', u.id).order('created_at', {ascending: false}).limit(3);
      const expertIds = (c || []).map(cv => cv.expert_id).filter(Boolean);
      let expertProfileMap = {};
      if (expertIds.length > 0) {
        const { data: ep } = await sb.from('profiles').select('id,prenom,nom').in('id', expertIds);
        (ep || []).forEach(p => { expertProfileMap[p.id] = p; });
      }
      setConvs((c || []).map(cv => {
        const p = expertProfileMap[cv.expert_id] || {};
        const name = `${p.prenom||''} ${p.nom||''}`.trim() || 'Expert';
        const ini = name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || 'EX';
        return { ...cv, expertName: name, expertInitials: ini };
      }));
      const { data: m } = await sb.from('missions').select('id,titre,categorie,statut,prix,deadline,progression,expert_id,created_at').eq('client_id', u.id).order('created_at', {ascending: false}).limit(4);
      setMissions(m || []);
      const { count: totalM } = await sb.from('missions').select('id', { count: 'exact', head: true }).eq('client_id', u.id);
      setMissionCount(totalM || 0);
      const { data: mPrix } = await sb.from('missions').select('prix').eq('client_id', u.id);
      setBudgetTotal((mPrix||[]).reduce((s, r) => s + (r.prix||0), 0));
      const { data: props } = await sb.from('propositions')
        .select('id,montant,message,delai,statut,created_at,expert_id,brief_id,nom_expert')
        .eq('client_id', u.id)
        .order('created_at', {ascending: false})
        .limit(10);
      setPropositions(props || []);
    });
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    return () => window.removeEventListener('mousemove', move);
  }, []);

  const handleLogout = async () => {
    await sb.auth.signOut();
    window.location.href = 'connexion.html';
  };

  const todayStr = (() => { const s = new Date().toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); })();

  return (
    <React.Fragment>
      <div className={`sidebar-backdrop${sidebarOpen?' open':''}`} onClick={()=>setSidebarOpen(false)}/>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-inner">
          <div className="nav-brand">
            <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)} aria-label="Menu">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <a href="/" className="brand"><div className="brand-logo"></div><span>CreatorFlow Market</span></a>
          </div>
          <div className="nav-right">
            <button className="notif-btn">
              <Ic.Bell/>
              <span className="notif-dot"/>
            </button>
            <div className="user-chip">
              <div className="avatar">{initials}</div>
              <span className="user-name">{user ? `${user.prenom||''} ${user.nom||''}`.trim() : 'Chargement…'}</span>
            </div>
          </div>
        </div>
      </nav>

      {/* SIDEBAR */}
      <aside className={`sidebar${sidebarOpen?' open':''}`}>
        <div className="sidebar-section">
          <div className="sidebar-label">Menu</div>
          {NAV_ITEMS.map(item => {
            const badge = item.badge ? <span className="nav-badge">{item.id==='missions' ? missionCount : item.id==='messages' ? convs.length : item.id==='props' ? propositions.filter(p=>p.statut==='en_attente').length : item.badge}</span> : null;
            const cls = `nav-item ${active === item.id ? 'active' : ''}`;
            return item.href ? (
              <a key={item.id} href={item.href} className={cls} style={{textDecoration:'none',color:'inherit'}}>
                {item.icon}{item.label}{badge}
              </a>
            ) : (
              <div key={item.id} className={cls} onClick={() => { setActive(item.id); setSidebarOpen(false); }}>
                {item.icon}{item.label}{badge}
              </div>
            );
          })}
        </div>
        <div className="sidebar-section">
          <div className="sidebar-label">Compte</div>
          <a href="parametres.html" className="nav-item"><Ic.Settings/>Paramètres</a>
        </div>
        <div className="sidebar-bottom">
          <div className="nav-item" style={{color:'var(--text-3)',cursor:'pointer'}} onClick={handleLogout}>
            <Ic.Logout/>Déconnexion
          </div>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main">
        <div className="main-inner">

          {/* HEADER */}
          <div className="page-header">
            <div>
              <h1 className="page-title">Bonjour, {prenom || 'Client'} 👋</h1>
              <p className="page-sub">{todayStr} · {missionCount} mission{missionCount !== 1 ? 's' : ''} active{missionCount !== 1 ? 's' : ''} · {briefs.length} brief{briefs.length !== 1 ? 's' : ''} déposé{briefs.length !== 1 ? 's' : ''}</p>
            </div>
            <a href="nouveau-brief.html" className="btn btn-primary"><Ic.Plus/>Nouveau brief</a>
          </div>

          {/* STATS */}
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(124,58,237,0.12)',color:'var(--vs)'}}>📋</div>
              <div className="stat-val">{briefs.length}</div>
              <div className="stat-label">Briefs déposés</div>
              <div className="stat-trend trend-up"><Ic.Check/>{briefs.filter(b=>b.statut==='ouvert').length} ouverts</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(6,182,212,0.10)',color:'var(--c)'}}>🚀</div>
              <div className="stat-val">{missionCount}</div>
              <div className="stat-label">Missions en cours</div>
              <div className="stat-trend trend-warn">{missionCount > 0 ? 'En cours' : 'Aucune'}</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(6,182,212,0.10)',color:'var(--c)'}}>💬</div>
              <div className="stat-val">{convs.length}</div>
              <div className="stat-label">Conversations actives</div>
              <div className="stat-trend trend-warn">{convs.length > 0 ? 'En cours' : 'Aucune'}</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(16,185,129,0.10)',color:'var(--green)'}}>💶</div>
              <div className="stat-val">{budgetTotal > 0 ? budgetTotal.toLocaleString('fr-CA')+'$' : '—'}</div>
              <div className="stat-label">Budget engagé (total)</div>
              <div className="stat-trend trend-up"><Ic.Check/>{missionCount} mission{missionCount !== 1 ? 's' : ''}</div>
            </div>
          </div>

          {/* 2 COL */}
          <div className="two-col">

            {/* COL GAUCHE */}
            <div style={{display:'flex',flexDirection:'column',gap:20}}>

              {/* MISSIONS */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Mes briefs récents</span>
                  <a href="nouveau-brief.html" className="section-link">+ Nouveau brief</a>
                </div>
                {briefs.length === 0 ? (
                  <div style={{padding:'32px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:32,marginBottom:8}}>📋</div>
                    <div style={{fontSize:13,marginBottom:16}}>Aucun brief déposé pour le moment</div>
                    <a href="nouveau-brief.html" className="btn btn-primary btn-sm" style={{margin:'0 auto'}}>Déposer mon premier brief</a>
                  </div>
                ) : briefs.map(b => (
                  <div key={b.id} className="mission-item">
                    <div className="mission-icon" style={{background:'rgba(124,58,237,0.12)',color:'var(--vs)'}}>📋</div>
                    <div className="mission-info">
                      <div className="mission-name">{b.categorie || 'Projet'}</div>
                      <div className="mission-meta">Budget : {b.budget} · Délai : {b.delai}</div>
                    </div>
                    <div className="mission-right">
                      <span className={`badge ${b.statut === 'ouvert' ? 'badge-green' : 'badge-amber'}`}>{b.statut === 'ouvert' ? 'Ouvert' : b.statut}</span>
                      <span style={{fontSize:10,color:'var(--text-3)'}}>{new Date(b.created_at).toLocaleDateString('fr-CA')}</span>
                    </div>
                  </div>
                ))}
              </div>

              {/* MISSIONS */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Mes missions en cours</span>
                  <span style={{fontSize:12,color:'var(--text-3)'}}>{missions.length} mission{missions.length !== 1 ? 's' : ''}</span>
                </div>
                {missions.length === 0 ? (
                  <div style={{padding:'32px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:32,marginBottom:8}}>🚀</div>
                    <div style={{fontSize:13,marginBottom:16}}>Aucune mission en cours</div>
                    <a href="experts.html" className="btn btn-primary btn-sm" style={{margin:'0 auto'}}>Trouver un expert</a>
                  </div>
                ) : missions.map(m => {
                  const statusMap = {nouveau:'badge-green',en_cours:'badge-green',en_revision:'badge-amber',termine:'badge-green',annule:'badge-red'};
                  const labelMap = {nouveau:'Nouveau',en_cours:'En cours',en_revision:'En révision',termine:'Terminé',annule:'Annulé'};
                  const payable = m.prix > 0 && m.statut !== 'termine' && m.statut !== 'annule';
                  return (
                    <div key={m.id} className="mission-item" onClick={() => window.location.href=`mission.html?id=${m.id}`} style={{cursor:'pointer'}}>
                      <div className="mission-icon" style={{background:'rgba(124,58,237,0.12)',color:'var(--vs)'}}>🚀</div>
                      <div className="mission-info">
                        <div className="mission-name">{m.titre}</div>
                        <div className="mission-meta">{m.categorie}</div>
                        {m.progression != null && <div className="prog-bar" style={{width:120}}><div className="prog-fill" style={{width:m.progression+'%'}}/></div>}
                      </div>
                      <div className="mission-right">
                        <span className={`badge ${statusMap[m.statut] || 'badge-green'}`}>{labelMap[m.statut] || m.statut}</span>
                        <span className="mission-price">{m.prix ? m.prix+'$' : ''}</span>
                        {payable && (
                          <a href={`paiement.html?mission_id=${m.id}`} onClick={e=>e.stopPropagation()} className="btn btn-green btn-sm" style={{fontSize:10,padding:'3px 10px'}}>
                            Payer
                          </a>
                        )}
                        <span style={{fontSize:10,color:'var(--text-3)'}}>{m.deadline ? new Date(m.deadline).toLocaleDateString('fr-CA') : ''}</span>
                      </div>
                    </div>
                  );
                })}
              </div>

            </div>

            {/* COL DROITE */}
            <div style={{display:'flex',flexDirection:'column',gap:20}}>

              {/* MESSAGES */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Messages récents</span>
                  <a href="#" className="section-link" onClick={e => {e.preventDefault(); setActive('messages');}}>Tout voir →</a>
                </div>
                {convs.length === 0 ? (
                  <div style={{padding:'24px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:28,marginBottom:8}}>💬</div>
                    <div style={{fontSize:13}}>Aucune conversation active</div>
                  </div>
                ) : convs.map(c => (
                  <a key={c.id} className="msg-item" href={`messages.html?conv=${c.id}`} style={{textDecoration:'none',color:'inherit'}}>
                    <div className="msg-avatar" style={{background:'linear-gradient(135deg,#7C3AED,#A78BFA)'}}>{c.expertInitials}</div>
                    <div className="msg-body">
                      <div className="msg-name">{c.expertName}</div>
                      <div className="msg-preview">Conversation en cours</div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
                      <span className="msg-time">{new Date(c.created_at).toLocaleDateString('fr-CA')}</span>
                    </div>
                  </a>
                ))}
                <div style={{padding:'12px 20px'}}>
                  <a href="messages.html" className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}}>Ouvrir la messagerie <Ic.Arrow/></a>
                </div>
              </div>

              {/* PROPOSITIONS */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Propositions reçues</span>
                  {propositions.filter(p=>p.statut==='en_attente').length > 0 && (
                    <span style={{background:'rgba(124,58,237,0.12)',color:'var(--vs)',fontSize:11,fontWeight:700,padding:'3px 9px',borderRadius:99}}>
                      {propositions.filter(p=>p.statut==='en_attente').length} en attente
                    </span>
                  )}
                </div>
                {propositions.length === 0 ? (
                  <div style={{padding:'24px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:28,marginBottom:8}}>📬</div>
                    <div style={{fontSize:13}}>Aucune proposition reçue</div>
                  </div>
                ) : propositions.slice(0,4).map(p => {
                  const expertName = p.nom_expert || 'Expert';
                  const statutColor = {en_attente:'var(--amber)',acceptee:'var(--green)',refusee:'var(--red)'}[p.statut] || 'var(--text-2)';
                  const statutLabel = {en_attente:'En attente',acceptee:'Acceptée',refusee:'Refusée'}[p.statut] || p.statut;
                  return (
                    <div key={p.id} className="msg-item" style={{alignItems:'flex-start'}}>
                      <div className="msg-avatar" style={{background:'linear-gradient(135deg,var(--v),var(--vs))',flexShrink:0,marginTop:2}}>
                        {(expertName[0]||'E').toUpperCase()}
                      </div>
                      <div className="msg-body" style={{flex:1,minWidth:0}}>
                        <div className="msg-name">{expertName}</div>
                        <div className="msg-preview">{p.montant ? p.montant.toLocaleString('fr-CA')+'$ CAD' : ''}{p.delai ? ` · ${p.delai}` : ''}</div>
                        <div style={{fontSize:11,color:'var(--text-3)',marginTop:2,lineHeight:1.4}}>{(p.message||'').slice(0,80)}{(p.message||'').length>80?'…':''}</div>
                      </div>
                      <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4,flexShrink:0}}>
                        <span style={{fontSize:10,fontWeight:700,color:statutColor}}>{statutLabel}</span>
                        <span style={{fontSize:10,color:'var(--text-3)'}}>{new Date(p.created_at).toLocaleDateString('fr-CA')}</span>
                        {p.statut==='en_attente' && (
                          <button className="btn btn-primary btn-sm" style={{fontSize:10,padding:'4px 10px',marginTop:4}} onClick={async()=>{
                            if (!user) return;
                            const { error: propErr } = await sb.from('propositions').update({statut:'acceptee'}).eq('id',p.id);
                            if (propErr) { alert('Erreur acceptation: ' + propErr.message); return; }
                            let titre = 'Mission';
                            if (p.brief_id) {
                              const { data: brief } = await sb.from('briefs').select('categorie').eq('id',p.brief_id).single();
                              if (brief?.categorie) titre = brief.categorie;
                            }
                            const { data: newMission, error: missionErr } = await sb.from('missions').insert({
                              client_id: user.id,
                              expert_id: p.expert_id,
                              titre,
                              categorie: titre,
                              prix: p.montant || 0,
                              statut: 'en_cours',
                            }).select('id').single();
                            if (missionErr) {
                              alert('Erreur mission: ' + missionErr.message + '\nCode: ' + missionErr.code + '\nDétail: ' + missionErr.details);
                              return;
                            }
                            if (newMission) {
                              const { error: convErr } = await sb.from('conversations').insert({ client_id: user.id, expert_id: p.expert_id });
                              if (convErr) console.warn('Conversation:', convErr.message);
                              const { data: expertProfile } = await sb.from('profiles').select('email').eq('id', p.expert_id).single();
                              const { data: { session: authSession } } = await sb.auth.getSession();
                              if (expertProfile?.email) {
                                fetch('https://cjtglfutckaogsmwhfsv.supabase.co/functions/v1/send-email', {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json', 'apikey': 'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei', 'Authorization': `Bearer ${authSession.access_token}` },
                                  body: JSON.stringify({ type: 'proposition_acceptee', to: expertProfile.email, data: { client_name: `${user.prenom||''} ${user.nom||''}`.trim()||'Client', mission_titre: titre, montant: p.montant||0 } }),
                                }).catch(() => {});
                              }
                            }
                            if (p.brief_id) {
                              await sb.from('propositions').update({statut:'refusee'}).eq('brief_id',p.brief_id).neq('id',p.id).eq('statut','en_attente');
                            }
                            setPropositions(prev=>prev.map(x=>
                              x.id===p.id ? {...x,statut:'acceptee'} :
                              (x.brief_id===p.brief_id && x.statut==='en_attente') ? {...x,statut:'refusee'} : x
                            ));
                            if (newMission) {
                              setMissions(prev=>[{id:newMission.id,titre,categorie:titre,statut:'en_cours',prix:p.montant||0,expert_id:p.expert_id,created_at:new Date().toISOString()},...prev]);
                              setMissionCount(prev=>prev+1);
                            }
                          }}>Accepter</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* ACTIVITÉ */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Activité récente</span>
                </div>
                {briefs.length === 0 && missions.length === 0 ? (
                  <div style={{padding:'24px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:28,marginBottom:8}}>📊</div>
                    <div style={{fontSize:13}}>Aucune activité récente</div>
                  </div>
                ) : [...briefs.map(b=>({color:'var(--vs)',label:`Brief "${b.categorie||'Projet'}" déposé — ${b.budget}`,time:b.created_at})), ...missions.map(m=>({color:'var(--c)',label:`Mission "${m.titre}" — ${{nouveau:'Nouveau',en_cours:'En cours',en_revision:'En révision',termine:'Terminé',annule:'Annulé'}[m.statut]||m.statut}`,time:m.created_at}))].sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,4).map((a,i)=>(
                  <div key={i} className="activity-item">
                    <div className="act-dot" style={{background:a.color}}/>
                    <div>
                      <div className="act-text">{a.label}</div>
                      <div className="act-time">{new Date(a.time).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</div>
                    </div>
                  </div>
                ))}
              </div>

              {/* CTA BRIEF */}
              <div style={{background:'linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08))',border:'1px solid rgba(124,58,237,0.25)',borderRadius:'var(--r-lg)',padding:'20px',textAlign:'center'}}>
                <div style={{fontSize:24,marginBottom:10}}>✨</div>
                <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Nouveau projet en tête ?</div>
                <div style={{fontSize:12,color:'var(--text-2)',marginBottom:16,lineHeight:1.5}}>Déposez un brief et recevez des propositions d'experts certifiés sous 24h.</div>
                <a href="nouveau-brief.html" className="btn btn-primary" style={{width:'100%',justifyContent:'center'}}>Déposer un brief <Ic.Arrow/></a>
              </div>

            </div>
          </div>
        </div>
      </main>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
