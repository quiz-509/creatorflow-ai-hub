<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog IA — CreatorFlow Market</title>
  <meta name="description" content="Articles IA pour créateurs et entrepreneurs.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--nav:64px;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--f);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
    img{max-width:100%;display:block;}
    .nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
    .nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;width:100%;display:flex;align-items:center;gap:32px;}
    .logo{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;flex-shrink:0;}
    .nav-links{display:flex;align-items:center;gap:4px;flex:1;}
    .nav-link{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);transition:all 150ms;}
    .nav-link:hover,.nav-link.active{background:rgba(255,255,255,0.06);color:var(--text);}
    .nav-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);cursor:pointer;white-space:nowrap;}
    .btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
    .btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
    .btn-primary{background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;border:none;}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--vg);}
    .page{padding-top:var(--nav);}
    .container{max-width:1280px;margin:0 auto;padding:0 24px;}

    /* Hero */
    .cat-hero{padding:56px 0 48px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
    .cat-hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.025) 1px,transparent 0);background-size:32px 32px;pointer-events:none;}
    .breadcrumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);margin-bottom:20px;position:relative;z-index:1;}
    .breadcrumb a{transition:color 150ms;}
    .breadcrumb a:hover{color:var(--text-2);}
    .breadcrumb-sep{opacity:0.4;}
    .cat-hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:center;}
    .cat-hero-left{}
    .cat-icon-wrap{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;border:1px solid;}
    .cat-hero h1{font-size:clamp(24px,3.5vw,40px);font-weight:900;line-height:1.12;letter-spacing:-0.03em;margin-bottom:10px;}
    .cat-hero-desc{font-size:15px;color:var(--text-2);line-height:1.65;margin-bottom:18px;}
    .cat-hero-stats{display:flex;gap:20px;flex-wrap:wrap;}
    .cat-stat{font-size:12px;color:var(--text-3);}
    .cat-stat strong{font-weight:600;color:var(--text-2);}
    /* Newsletter mini */
    .hero-nl-card{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:24px;}
    .hero-nl-title{font-size:14px;font-weight:700;margin-bottom:4px;}
    .hero-nl-sub{font-size:12px;color:var(--text-3);margin-bottom:14px;}
    .hero-nl-form{display:flex;gap:8px;}
    .hero-nl-input{flex:1;background:var(--surf-2);border:1px solid var(--border-2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);font-family:var(--f);min-width:0;}
    .hero-nl-input::placeholder{color:var(--text-3);}
    .hero-nl-input:focus{outline:none;border-color:rgba(124,58,237,0.5);}
    .hero-nl-btn{padding:9px 14px;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;border-radius:8px;font-size:14px;font-weight:700;border:none;cursor:pointer;flex-shrink:0;transition:opacity 150ms;}
    .hero-nl-btn:hover{opacity:0.9;}
    .hero-nl-proof{font-size:11px;color:var(--text-3);margin-top:10px;text-align:center;}
    .hero-nl-done{font-size:13px;color:var(--green);font-weight:600;padding:8px 0;}

    /* Articles */
    .articles-section{padding:40px 0 64px;}
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
    .section-title{font-size:20px;font-weight:700;letter-spacing:-0.02em;}
    .sort-select{background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:500;color:var(--text);font-family:var(--f);cursor:pointer;min-width:160px;}
    .sort-select:focus{outline:none;border-color:var(--border-3);}
    .sort-select option{background:var(--surf-2);color:var(--text);}
    .articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;}
    .article-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:all 200ms var(--ease);display:flex;flex-direction:column;cursor:pointer;}
    .article-card:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:0 20px 40px rgba(0,0,0,0.4);}
    /* Generative covers — tout en inline JSX */
    .article-cover{position:relative;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}

    /* Featured article */
    .featured-article{margin-bottom:8px;}
    .featured-label-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .featured-badge{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.45);}
    .fc{display:grid;grid-template-columns:55% 45%;gap:0;background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);overflow:hidden;transition:border-color 200ms,box-shadow 200ms;}
    .fc:hover{border-color:var(--border-3);box-shadow:0 20px 48px rgba(0,0,0,0.4);}
    .fc-cover{height:300px;overflow:hidden;flex-shrink:0;}
    .fc-body{padding:36px 40px;display:flex;flex-direction:column;justify-content:center;}
    .fc-body h2{font-size:clamp(18px,2.2vw,26px);font-weight:800;line-height:1.25;letter-spacing:-0.02em;margin:12px 0 14px;color:var(--text);}
    .fc-excerpt{font-size:15px;color:var(--text-2);line-height:1.7;margin-bottom:18px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
    .fc-meta{display:flex;gap:14px;font-size:12px;color:var(--text-3);margin-bottom:22px;}
    .fc-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);border-radius:999px;font-size:13px;font-weight:600;color:var(--vs);transition:all 200ms;width:fit-content;}
    .fc-btn:hover{background:rgba(124,58,237,0.25);transform:translateX(3px);}

    /* Conversion banner */
    .conv-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 28px;background:rgba(124,58,237,0.05);border:1px solid rgba(124,58,237,0.14);border-radius:var(--r-lg);margin-bottom:36px;flex-wrap:wrap;}
    .conv-banner-text{font-size:15px;font-weight:600;color:var(--text);}
    .conv-banner-sub{font-size:13px;color:var(--text-2);margin-top:3px;}
    .conv-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;transition:all 200ms;flex-shrink:0;}
    .conv-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--vg);}
    .article-body{padding:20px;display:flex;flex-direction:column;flex:1;gap:8px;}
    .cat-badge{display:inline-block;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
    .article-title{font-size:15px;font-weight:700;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .article-title:hover{color:var(--vs);}
    .article-excerpt{font-size:13px;color:var(--text-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
    .article-footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-3);padding-top:12px;border-top:1px solid var(--border);margin-top:auto;}
    .af-left{display:flex;gap:12px;}
    .load-more-wrap{display:flex;justify-content:center;padding:32px 0 0;}
    .load-more-btn{padding:12px 32px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:999px;font-size:14px;font-weight:600;color:var(--text-2);transition:all 200ms;cursor:pointer;}
    .load-more-btn:hover{color:var(--text);border-color:var(--border-3);}
    .skeleton{background:linear-gradient(90deg,var(--surf) 25%,var(--surf-2) 50%,var(--surf) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
    .sk-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
    .sk-thumb{height:180px;}
    .sk-body{padding:20px;display:flex;flex-direction:column;gap:10px;}
    .empty-state{text-align:center;padding:80px 20px;grid-column:1/-1;}
    .empty-state p{color:var(--text-2);}

    /* SEO Content */
    .seo-section{padding:64px 0;border-top:1px solid var(--border);}
    .seo-grid{display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:start;}
    .seo-main h2{font-size:clamp(20px,2.5vw,28px);font-weight:800;letter-spacing:-0.02em;margin-bottom:16px;}
    .seo-main p{font-size:16px;color:var(--text-2);line-height:1.8;margin-bottom:20px;}
    .benefits-list{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
    .benefit-item{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#C4C4DC;line-height:1.5;}
    .benefit-check{width:20px;height:20px;border-radius:50%;background:rgba(16,185,129,0.15);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px;}
    .seo-aside{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:28px;}
    .seo-aside h3{font-size:16px;font-weight:700;margin-bottom:16px;}
    .other-cats{display:flex;flex-direction:column;gap:8px;}
    .other-cat-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);font-size:13px;color:var(--text-2);transition:all 150ms;}
    .other-cat-link:hover{border-color:var(--border-2);color:var(--text);background:rgba(255,255,255,0.04);}

    /* FAQ */
    .faq-section{padding:64px 0;border-top:1px solid var(--border);}
    .faq-section h2{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;}
    .faq-subtitle{font-size:15px;color:var(--text-2);margin-bottom:36px;}
    .faq-list{display:flex;flex-direction:column;gap:12px;max-width:820px;}
    .faq-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color 200ms;}
    .faq-item.open{border-color:var(--border-2);}
    .faq-q{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;cursor:pointer;gap:16px;}
    .faq-q-text{font-size:15px;font-weight:600;line-height:1.4;}
    .faq-chevron{font-size:13px;color:var(--text-3);transition:transform 250ms;flex-shrink:0;}
    .faq-item.open .faq-chevron{transform:rotate(180deg);}
    .faq-a{padding:0 22px 18px;font-size:14px;color:var(--text-2);line-height:1.75;}

    /* CTA */
    .cta-section{padding:80px 0;border-top:1px solid var(--border);}
    .cta-card{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(6,182,212,0.05));border:1px solid rgba(124,58,237,0.22);border-radius:var(--r-xl);padding:60px;text-align:center;position:relative;overflow:hidden;}
    .cta-card::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(124,58,237,0.07),transparent 70%);pointer-events:none;}
    .cta-card h2{font-size:clamp(22px,3vw,36px);font-weight:900;letter-spacing:-0.02em;margin-bottom:12px;position:relative;}
    .cta-card p{font-size:16px;color:var(--text-2);margin-bottom:28px;position:relative;}
    .cta-proof-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;position:relative;}
    .cta-proof-item{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px;}
    .cta-proof-item::before{content:'✓';color:var(--green);font-weight:700;font-size:14px;}
    .cta-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;border-radius:999px;font-size:15px;font-weight:700;transition:all 220ms;position:relative;}
    .cta-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px var(--vg);}

    /* Footer */
    .footer{border-top:1px solid var(--border);padding:40px 0 32px;}
    .footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
    .footer-logo{font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .footer-links{display:flex;gap:20px;flex-wrap:wrap;}
    .footer-link{font-size:12px;color:var(--text-3);transition:color 150ms;}
    .footer-link:hover{color:var(--text-2);}

    @media(max-width:1024px){.seo-grid{grid-template-columns:1fr;}}
    @media(max-width:900px){.cat-hero-inner{grid-template-columns:1fr;}.hero-nl-card{display:none;}}
    @media(max-width:768px){.fc{grid-template-columns:1fr;}.fc-cover{height:220px;}.fc-body{padding:24px;}}
    @media(max-width:680px){
      .nav-links{display:none;}
      .btn-ghost{display:none;}
      .btn-primary{padding:8px 14px;font-size:12px;}
      .articles-grid{grid-template-columns:1fr;}
      .cta-card{padding:36px 20px;}
      .seo-section{padding:40px 0;}
      .faq-section{padding:40px 0;}
      .cat-hero{padding:40px 0 32px;}
      .section-header{flex-direction:column;align-items:flex-start;}
      .sort-select{width:100%;}
    }
  </style>
</head>

const ALL_CATS = Object.keys(CAT_DATA);
const CAT_ICONS = Object.fromEntries(ALL_CATS.map(k => [k, CAT_DATA[k].icon]));
const CAT_COLORS = Object.fromEntries(ALL_CATS.map(k => [k, CAT_DATA[k].color]));

const fmtDate = d => d ? new Date(d).toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'}) : '';

function CatBadge({cat}) {
  const color = CAT_COLORS[cat] || '#7C3AED';
  const icon = CAT_ICONS[cat] || '🤖';
  return <span className="cat-badge" style={{background:`${color}20`,color,border:`1px solid ${color}40`}}>{icon} {cat}</span>;
}

function slugHash(slug) {
  return (slug||'').split('').reduce((a,c) => ((a * 31 + c.charCodeAt(0)) | 0) >>> 0, 0x811c9dc5);
}

function ArticleCover({ article, height, featured }) {
  const color = CAT_COLORS[article.category] || '#7C3AED';
  const h     = height || 190;

  if (article.featured_image) {
    return (
      <div className="article-cover" style={{height: h, background: '#0C0C18'}}>
        <img
          src={article.featured_image}
          alt={article.title}
          style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',objectPosition:'center'}}
          loading="lazy"
        />
        {/* Bottom fade for text contrast */}
        <div style={{position:'absolute',inset:0,background:`linear-gradient(to top, rgba(4,4,10,0.72) 0%, transparent 55%)`}}/>
        {/* Subtle color tint overlay */}
        <div style={{position:'absolute',inset:0,background:`${color}12`}}/>
      </div>
    );
  }

  // Fallback: CSS generative cover
  const icon  = CAT_ICONS[article.category] || '🤖';
  const sh    = slugHash(article.slug);
  const angle = 125 + (sh % 8) * 7;
  const rx    = 15 + (sh % 35);
  const iconSize = featured ? '80px' : '56px';
  const ringSize = featured ? 220 : 160;
  return (
    <div className="article-cover" style={{
      height: h,
      background: `linear-gradient(${angle}deg, ${color}50 0%, ${color}22 45%, rgba(4,4,10,0.92) 100%)`
    }}>
      <div style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(circle at 1px 1px,rgba(255,255,255,0.1) 1px,transparent 0)',backgroundSize:'20px 20px'}}/>
      <div style={{position:'absolute',width:ringSize,height:ringSize,borderRadius:'50%',border:`1px solid ${color}35`,left:`${rx}%`,top:'50%',transform:'translateY(-50%)'}}/>
      <div style={{position:'absolute',width:ringSize*.65,height:ringSize*.65,borderRadius:'50%',border:`1px solid ${color}20`,left:`${rx}%`,top:'50%',transform:'translateY(-50%)'}}/>
      <div style={{position:'absolute',width:ringSize*.9,height:ringSize*.9,borderRadius:'50%',background:`${color}1E`,filter:'blur(32px)',left:`${rx}%`,top:'50%',transform:'translateY(-50%)'}}/>
      <span style={{position:'relative',zIndex:2,fontSize:iconSize,lineHeight:1,filter:`drop-shadow(0 0 32px ${color}) drop-shadow(0 0 12px ${color}90)`}}>{icon}</span>
    </div>
  );
}

  const submit = e => { e.preventDefault(); if (email.trim()) setDone(true); };
  return (
    <div className="hero-nl-card">
      <div className="hero-nl-title">Recevoir les guides {catName}</div>
      <div className="hero-nl-sub">+2 400 abonnés · 1 email/semaine · 0 spam</div>
      {done
        ? <p className="hero-nl-done">✓ Inscription confirmée !</p>
        : <form className="hero-nl-form" onSubmit={submit}>
            <input className="hero-nl-input" type="email" placeholder="votre@email.com"

      <div className="hero-nl-proof">Audit gratuit inclus à l'inscription</div>

  );
}

  return (
    <div className="conv-banner">
      <div>
        <div className="conv-banner-text">Besoin d'aide pour mettre en place ces stratégies ?</div>
        <div className="conv-banner-sub">Nos experts certifiés implémentent ces méthodes dans votre business en moins de 48h.</div>
      </div>
      <a href="/experts" className="conv-btn">Parler à un expert {icon} →</a>
    </div>
  );
}

function ArticleCard({article}) {
  return (
    <a href={`/blog/${article.slug}`}>
      <div className="article-card">
        <ArticleCover article={article} height={190}/>
        <div className="article-body">
          <CatBadge cat={article.category}/>
          <div className="article-title">{article.title}</div>
          <div className="article-excerpt">{article.excerpt}</div>
          <div className="article-footer">
            <div className="af-left">
              <span>📖 {article.reading_time||5} min</span>
              <span>👁 {(article.views||0).toLocaleString()}</span>
            </div>
            <span>{fmtDate(article.published_at)}</span>
          </div>
        </div>
      </div>
    </a>
  );
}

function SkeletonCard() {
  return (
    <div className="sk-card">
      <div className="sk-thumb skeleton"/>
      <div className="sk-body">
        <div className="skeleton" style={{height:20,width:'60%'}}/>
        <div className="skeleton" style={{height:14,width:'90%'}}/>
        <div className="skeleton" style={{height:14,width:'80%'}}/>
        <div className="skeleton" style={{height:14,width:'50%'}}/>
      </div>
    </div>
  );
}

function FAQItem({item}) {
  const [open, setOpen] = useState(false);
  return (
    <div className={`faq-item${open?' open':''}`}>
      <div className="faq-q" onClick={() => setOpen(o => !o)}>
        <span className="faq-q-text">{item.q}</span>
        <span className="faq-chevron">▼</span>
      </div>
      {open && <div className="faq-a">{item.a}</div>}
    </div>
  );
}

function CategoryPage({catName, data}) {
  const [articles, setArticles] = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [page,     setPage]     = useState(1);
  const [hasMore,  setHasMore]  = useState(false);
  const [total,    setTotal]    = useState(0);
  const [sort,     setSort]     = useState('recent');
  const PER = 9;

  const load = useCallback(async (p, s) => {
    if (p === 1) setLoading(true);
    try {
      const orderCol = s === 'popular' ? 'views' : 'published_at';
      const { data: rows, count, error } = await sb
        .from('blog_articles')
        .select('id,slug,title,excerpt,category,author,reading_time,views,published_at,featured_image', {count:'exact'})
        .eq('status','published')
        .eq('category', catName)
        .order(orderCol, {ascending:false})
        .range((p-1)*PER, p*PER-1);
      if (error) throw error;
      if (p === 1) setArticles(rows||[]);
      else setArticles(prev => [...prev, ...(rows||[])]);
      setTotal(count||0);
      setHasMore((count||0) > p*PER);
    } catch {
      setArticles([]);
      setTotal(0);
    } finally {
      setLoading(false);
    }
  }, [catName]);

  useEffect(() => { setPage(1); load(1, sort); }, [sort, load]);

  const loadMore = () => { const np = page+1; setPage(np); load(np, sort); };

  const color = data.color;

  return (
    <div className="page">
      <nav className="nav">
        <div className="nav-inner">
          <a href="/" className="logo">CreatorFlow Market</a>
          <div className="nav-links">
            <a href="/experts" className="nav-link">Experts</a>
            <a href="/brief" className="nav-link">Publier un brief</a>
            <a href="/academie" className="nav-link">Academy</a>
            <a href="/pricing" className="nav-link">Tarifs</a>
            <a href="/blog" className="nav-link active">Blog IA</a>
          </div>
          <div className="nav-actions">
            <a href="/connexion" className="btn btn-ghost">Connexion</a>
            <a href="/inscription" className="btn btn-primary">Rejoindre →</a>
          </div>
        </div>
      </nav>

      <section className="cat-hero" style={data.heroImage ? {
        backgroundImage:`url(${data.heroImage})`,backgroundSize:'cover',backgroundPosition:'center',
      } : {background:`linear-gradient(150deg,${color}18 0%,${color}07 55%,transparent 100%)`}}>
        {data.heroImage && <>
          <div style={{position:'absolute',inset:0,background:'linear-gradient(90deg,rgba(4,4,10,0.94) 0%,rgba(4,4,10,0.82) 50%,rgba(4,4,10,0.60) 100%)',zIndex:0}}/>
          <div style={{position:'absolute',inset:0,background:`${color}14`,zIndex:0}}/>
        </>}
        <div className="container">
          <div className="breadcrumb">
            <a href="/">Accueil</a>
            <span className="breadcrumb-sep">/</span>
            <a href="/blog">Blog IA</a>
            <span className="breadcrumb-sep">/</span>
            <span style={{color}}>{catName}</span>
          </div>
          <div className="cat-hero-inner">
            <div className="cat-hero-left">
              <div className="cat-icon-wrap" style={{background:`${color}18`,borderColor:`${color}30`,color}}>
                {data.icon}
              </div>
              <h1>{catName}</h1>
              <p className="cat-hero-desc">{data.subtitle}</p>
              <div className="cat-hero-stats">
                <span className="cat-stat">Mis à jour <strong>juin 2026</strong></span>
                <span className="cat-stat">Par <strong>CreatorFlow AI</strong></span>
              </div>
            </div>
            <HeroNewsletter catName={catName}/>
          </div>
        </div>
      </section>

      <section className="articles-section">
        <div className="container">
          {/* Article vedette */}
          {!loading && articles.length > 0 && (
            <FeaturedCard article={articles[0]}/>
          )}
          {loading && (
            <div className="sk-card" style={{marginBottom:8}}>
              <div className="sk-thumb skeleton" style={{height:300}}/>
            </div>
          )}

          {/* Grille des autres articles */}
          {(loading || articles.length > 1) && (
            <>
              <div className="section-header" style={{marginTop:8}}>
                <h2 className="section-title">À lire aussi</h2>
                <select className="sort-select" value={sort} onChange={e => setSort(e.target.value)}>
                  <option value="recent">Plus récents</option>
                  <option value="popular">Plus populaires</option>
                </select>
              </div>
              <div className="articles-grid">
                {loading
                  ? Array.from({length:6}).map((_,i) => <SkeletonCard key={i}/>)
                  : articles.slice(1).map((a,i) => (
                      <React.Fragment key={a.id}>
                        <ArticleCard article={a}/>
                        {i === 2 && (
                          <div style={{gridColumn:'1/-1'}}>
                            <ConversionBanner catName={catName} icon={data.icon}/>
                          </div>
                        )}
                      </React.Fragment>
                    ))
                }
              </div>
            </>
          )}

          {!loading && articles.length === 0 && (
            <div className="empty-state"><p>Aucun article publié pour le moment. Revenez bientôt !</p></div>
          )}

          {hasMore && !loading && (
            <div className="load-more-wrap">
              <button className="load-more-btn" onClick={loadMore}>Charger plus d'articles</button>
            </div>
          )}
        </div>
      </section>

      <section className="seo-section">
        <div className="container">
          <div className="seo-grid">
            <div className="seo-main">
              <h2>Pourquoi suivre les guides <span style={{color}}>{catName}</span> ?</h2>
              <p>{data.desc}</p>
              <div className="benefits-list">
                {data.benefits.map((b,i) => (
                  <div key={i} className="benefit-item">
                    <span className="benefit-check">✓</span>
                    <span>{b}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="seo-aside">
              <h3>Explorer d'autres catégories</h3>
              <div className="other-cats">
                {ALL_CATS.filter(c => c !== catName).map(c => (
                  <a key={c} href={`/blog/categorie/${CAT_DATA[c].slug}`} className="other-cat-link">
                    <span style={{fontSize:18}}>{CAT_DATA[c].icon}</span>
                    <span>{c}</span>
                  </a>
                ))}
              </div>
            </div>
          </div>
        </div>
      </section>

      <section className="faq-section">
        <div className="container">
          <h2>Questions fréquentes sur <span style={{color}}>{catName}</span></h2>
          <p className="faq-subtitle">Tout ce que vous voulez savoir pour bien démarrer.</p>
          <div className="faq-list">
            {data.faq.map((item,i) => <FAQItem key={i} item={item}/>)}
          </div>
        </div>
      </section>

      <section className="cta-section">
        <div className="container">
          <div className="cta-card">
            <h2>Besoin d'un expert en {catName} ?</h2>
            <p>Nos experts certifiés peuvent implémenter ces stratégies dans votre business dès cette semaine.</p>
            <div className="cta-proof-row">
              <span className="cta-proof-item">Audit gratuit</span>
              <span className="cta-proof-item">Experts certifiés</span>
              <span className="cta-proof-item">Résultats en 48h</span>
            </div>
            <a href="/experts" className="cta-btn">Trouver un expert {data.icon} →</a>
          </div>
        </div>
      </section>

      <footer className="footer">
        <div className="container">
          <div className="footer-inner">
            <span className="footer-logo">CreatorFlow Market</span>
            <div className="footer-links">
              <a href="/blog" className="footer-link">Blog IA</a>
              <a href="/experts" className="footer-link">Experts</a>
              <a href="/academie" className="footer-link">Academy</a>
              <a href="/cgu" className="footer-link">CGU</a>
              <a href="/politique-confidentialite" className="footer-link">Confidentialité</a>
            </div>
          </div>
        </div>
      </footer>
    </div>
  );
}

function App() {
  const cat = new URLSearchParams(window.location.search).get('cat') || '';
  const data = CAT_DATA[cat];

  useEffect(() => {
    if (data) {
      document.title = `${cat} : Guides, Outils et Stratégies 2026 | CreatorFlow Market`;
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute('content', data.subtitle + ' — CreatorFlow Market.');
      const canon = document.querySelector('link[rel="canonical"]') || document.createElement('link');
      canon.rel = 'canonical';
      canon.href = `https://creatorflowmarket.com/blog/categorie/${data.slug}`;
      document.head.appendChild(canon);

      // Schema FAQPage
      const faqSchema = {
        '@context':'https://schema.org',
        '@type':'FAQPage',
        mainEntity: data.faq.map(f => ({
          '@type':'Question',
          name: f.q,
          acceptedAnswer: {'@type':'Answer', text: f.a}
        }))
      };
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.text = JSON.stringify(faqSchema);
      document.head.appendChild(s);

      // Schema CollectionPage
      const colSchema = {
        '@context':'https://schema.org',
        '@type':'CollectionPage',
        name: `${cat} — Blog IA CreatorFlow Market`,
        url: `https://creatorflowmarket.com/blog/categorie/${data.slug}`,
        description: data.subtitle,
        inLanguage: 'fr',
        breadcrumb: {
          '@type':'BreadcrumbList',
          itemListElement:[
            {position:1,name:'Accueil',item:'https://creatorflowmarket.com'},
            {position:2,name:'Blog IA',item:'https://creatorflowmarket.com/blog'},
            {position:3,name:cat,item:`https://creatorflowmarket.com/blog/categorie/${data.slug}`},
          ]
        }
      };
      const s2 = document.createElement('script');
      s2.type = 'application/ld+json';
      s2.text = JSON.stringify(colSchema);
      document.head.appendChild(s2);
    }
  }, [cat]);

  if (!data) {
    return (
      <div className="page" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',gap:16}}>
        <div style={{fontSize:48}}>🔍</div>
        <h1 style={{fontSize:24,fontWeight:700}}>Catégorie introuvable</h1>
        <a href="/blog" style={{color:'var(--vs)'}}>← Retour au blog</a>
      </div>
    );
  }

  return <CategoryPage catName={cat} data={data}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
