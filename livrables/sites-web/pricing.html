  <style>
:root {
  --bg:#04040A; --bg-2:#07070F; --surf:#0C0C18; --surf-2:#101020; --surf-3:#14142A;
  --border:rgba(255,255,255,0.055); --border-2:rgba(255,255,255,0.10); --border-3:rgba(255,255,255,0.18);
  --text:#F4F4FF; --text-2:#9898B8; --text-3:#55557A;
  --v:#7C3AED; --v2:#6D28D9; --vs:#A78BFA; --vg:rgba(124,58,237,0.35);
  --c:#06B6D4; --cs:#67E8F9; --green:#10B981; --amber:#F59E0B; --red:#EF4444;
  --r:14px; --r-lg:20px; --r-xl:28px;
  --f:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;font-size:16px;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 28px;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid transparent;transition:all 300ms ease;}
.nav.stuck{background:rgba(4,4,10,0.88);backdrop-filter:blur(20px);border-color:var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);transition:all 180ms ease;}
.nav-link:hover,.nav-link.active{color:var(--text);background:rgba(255,255,255,0.05);}
.nav-link.active{color:var(--vs);}
.nav-ctas{display:flex;gap:8px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset,0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:8px 16px;font-size:13px;}
.btn-lg{padding:13px 28px;font-size:15px;}

/* PAGE HEADER */
.page-header{padding:120px 0 72px;text-align:center;position:relative;}
.page-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 900px 500px at 50% 0%,rgba(124,58,237,0.14),transparent 70%);pointer-events:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
.page-title{font-size:clamp(36px,5vw,58px);font-weight:800;letter-spacing:-0.03em;margin:16px 0 16px;line-height:1.1;}
.page-title em{background:linear-gradient(135deg,#C084FC,var(--v),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;}
.page-sub{font-size:17px;color:var(--text-2);max-width:540px;margin:0 auto;}

/* PRICING GRID */
.pricing-section{padding:0 0 80px;}
.pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:80px;}
.price-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px;position:relative;overflow:hidden;transition:border-color 300ms ease,transform 300ms ease;}
.price-card:hover{border-color:var(--border-2);transform:translateY(-2px);}
.price-card.featured{border-color:rgba(124,58,237,0.4);background:linear-gradient(145deg,rgba(124,58,237,0.07),var(--surf));}
.price-card.featured::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.price-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--vs);background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);border-radius:999px;padding:3px 10px;margin-bottom:20px;}
.price-badge.green{color:var(--green);background:rgba(16,185,129,0.10);border-color:rgba(16,185,129,0.25);}
.price-target{font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
.price-title{font-size:24px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;}
.price-tagline{font-size:14px;color:var(--text-2);margin-bottom:28px;line-height:1.5;}
.price-amount{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;}
.price-num{font-size:52px;font-weight:800;letter-spacing:-0.04em;line-height:1;}
.price-num.free{background:linear-gradient(135deg,#10B981,#06B6D4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.price-num.commission{background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.price-unit{font-size:14px;color:var(--text-2);}
.price-note{font-size:12px;color:var(--text-3);margin-bottom:32px;line-height:1.5;}
.price-divider{height:1px;background:var(--border);margin-bottom:28px;}
.price-features{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;}
.price-feature{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--text-2);}
.price-feature-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.price-feature-icon.check{background:rgba(16,185,129,0.15);color:var(--green);}
.price-feature-icon.info{background:rgba(124,58,237,0.15);color:var(--vs);}
.price-feature strong{color:var(--text);}
.price-cta{width:100%;}
.price-cta-note{font-size:12px;color:var(--text-3);text-align:center;margin-top:12px;}

/* EXAMPLE CALC */
.calc-box{background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.18);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:32px;}
.calc-title{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--vs);margin-bottom:14px;}
.calc-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;}
.calc-row.total{border-top:1px solid rgba(124,58,237,0.2);margin-top:8px;padding-top:12px;font-weight:700;font-size:14px;color:var(--text);}
.calc-row span:first-child{color:var(--text-2);}
.calc-row span:last-child{color:var(--text);}
.calc-row.total span:last-child{color:var(--green);}

/* ACADEMY SECTION */
.academy-section{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:48px;margin-bottom:80px;position:relative;overflow:hidden;}
.academy-section::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(124,58,237,0.12),transparent 70%);pointer-events:none;}
.academy-header{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;flex-wrap:wrap;}
.academy-content{flex:1;min-width:280px;}
.academy-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#F59E0B;background:rgba(245,158,11,0.10);border:1px solid rgba(245,158,11,0.25);border-radius:999px;padding:3px 10px;margin-bottom:14px;}
.academy-title{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px;}
.academy-desc{font-size:14px;color:var(--text-2);line-height:1.6;max-width:440px;}
.academy-price-range{flex-shrink:0;text-align:right;}
.academy-from{font-size:12px;color:var(--text-3);margin-bottom:4px;}
.academy-range{font-size:30px;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(135deg,#F59E0B,#FCD34D);-webkit-background-clip:text;background-clip:text;color:transparent;}
.academy-range-note{font-size:12px;color:var(--text-3);margin-top:2px;}
.academy-features{display:flex;gap:20px;flex-wrap:wrap;margin-top:28px;}
.academy-feat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);}

/* FAQ */
.faq-section{margin-bottom:80px;}
.sh{text-align:center;margin-bottom:48px;}
.sh-label{font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;}
.sh-label::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);}
.sh-title{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-0.03em;margin-bottom:14px;}
.sh-title em{background:linear-gradient(135deg,#C084FC,var(--v));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;}
.faq-list{display:flex;flex-direction:column;gap:2px;max-width:760px;margin:0 auto;}
.faq-item{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color 200ms ease;}
.faq-item.open{border-color:rgba(124,58,237,0.3);}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;font-size:15px;font-weight:600;cursor:pointer;gap:16px;}
.faq-q:hover{color:var(--vs);}
.faq-icon{width:20px;height:20px;flex-shrink:0;border:1px solid var(--border-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-3);transition:all 200ms ease;}
.faq-item.open .faq-icon{border-color:var(--v);color:var(--vs);transform:rotate(45deg);}
.faq-a{padding:0 24px;max-height:0;overflow:hidden;transition:max-height 350ms var(--ease),padding 250ms ease;}
.faq-item.open .faq-a{max-height:200px;padding-bottom:20px;}
.faq-a p{font-size:14px;color:var(--text-2);line-height:1.7;}
.faq-a a{color:var(--vs);text-decoration:underline;text-underline-offset:3px;}

/* CTA SECTION */
.cta-section{background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(6,182,212,0.08));border:1px solid rgba(124,58,237,0.2);border-radius:var(--r-xl);padding:56px;text-align:center;margin-bottom:80px;position:relative;overflow:hidden;}
.cta-section::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 50% 50%,rgba(124,58,237,0.10),transparent 70%);pointer-events:none;}
.cta-title{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-0.03em;margin-bottom:12px;}
.cta-sub{font-size:16px;color:var(--text-2);margin-bottom:32px;max-width:480px;margin-left:auto;margin-right:auto;}
.cta-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* FOOTER */
.footer-mini{border-top:1px solid var(--border);padding:28px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.footer-mini a{font-size:13px;color:var(--text-3);transition:color 160ms;}
.footer-mini a:hover{color:var(--text);}
.footer-links{display:flex;gap:20px;flex-wrap:wrap;}

/* RESPONSIVE */
@media(max-width:768px){
  .pricing-grid{grid-template-columns:1fr;}
  .academy-header{flex-direction:column;}
  .academy-price-range{text-align:left;}
  .cta-section{padding:36px 24px;}
  .nav-links{display:none;}
}
@media(max-width:640px){
  .wrap{padding:0 18px;}
  .page-header{padding:88px 0 48px;}
  .price-card{padding:24px 20px;}
  .academy-section{padding:28px 20px;}
  .cta-btns .btn{width:100%;justify-content:center;}
}
@media(max-width:480px){
  .nav-inner{padding:0 12px;}
  .nav-ctas .btn-primary{display:none;}
  .nav-ctas .btn-ghost{font-size:12px;padding:7px 12px;}
}
