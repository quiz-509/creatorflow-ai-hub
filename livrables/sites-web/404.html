<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Page introuvable — CreatorFlow Market</title>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#04040A;--surf:#0C0C18;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--c:#06B6D4;--f:'Inter',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;
      background-image:radial-gradient(ellipse 800px 500px at 50% 0%, rgba(124,58,237,0.12) 0%, transparent 70%);}
    .logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;margin-bottom:48px;}
    .logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
    .code{font-size:120px;font-weight:800;letter-spacing:-0.06em;line-height:1;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px;}
    h1{font-size:clamp(22px,3vw,32px);font-weight:700;letter-spacing:-0.03em;margin-bottom:12px;}
    p{font-size:15px;color:var(--text-2);max-width:420px;line-height:1.7;margin-bottom:32px;}
    .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;transition:all 200ms;text-decoration:none;}
    .btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 6px 20px -6px rgba(124,58,237,0.5);}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px -6px rgba(124,58,237,0.7);}
    .btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
    .btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
  </style>
</head>
<body>
  <a href="/" class="logo">CreatorFlow <em>Market</em></a>
  <div class="code">404</div>
  <h1>Page introuvable</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée. Voici quelques liens utiles pour reprendre votre navigation.</p>
  <div class="links">
    <a href="/" class="btn btn-primary">← Retour à l'accueil</a>
    <a href="/experts.html" class="btn btn-ghost">Voir les experts</a>
    <a href="/academie.html" class="btn btn-ghost">Academy</a>
    <a href="/blog.html" class="btn btn-ghost">Blog IA</a>
  </div>
</body>
</html>
