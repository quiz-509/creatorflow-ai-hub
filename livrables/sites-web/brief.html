<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Déposer un brief — CreatorFlow Market</title>
  <meta name="description" content="Décrivez votre projet IA en 3 minutes. Recevez des propositions d'experts certifiés sous 24h. Matching garanti, zéro engagement initial."/>
  <link rel="canonical" href="https://creatorflowmarket.com/brief.html"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://creatorflowmarket.com/brief.html"/>
  <meta property="og:title" content="Déposer un brief IA — CreatorFlow Market"/>
  <meta property="og:description" content="Décrivez votre projet IA, recevez 3 propositions d'experts certifiés sous 24h. Gratuit et sans engagement."/>
  <meta property="og:site_name" content="CreatorFlow Market"/>
  <meta property="og:locale" content="fr_CA"/>
  <meta property="og:image" content="https://creatorflowmarket.com/og-image.jpg"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:image" content="https://creatorflowmarket.com/og-image.jpg"/>
  <meta name="twitter:title" content="Déposer un brief IA — CreatorFlow Market"/>
  <meta name="twitter:description" content="Votre projet IA mérite les meilleurs experts. Déposez votre brief gratuitement."/>
  <meta name="robots" content="index, follow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;background:rgba(4,4,10,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);transition:all 180ms ease;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:8px 16px;font-size:13px;}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}

/* PAGE */
.page-wrap{min-height:100vh;display:flex;flex-direction:column;padding-top:88px;}
.brief-layout{display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:start;padding:40px 0 100px;}

/* STEPS */
.steps-nav{display:flex;align-items:center;gap:8px;margin-bottom:36px;}
.step-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--border-2);color:var(--text-3);transition:all 260ms var(--ease);flex-shrink:0;}
.step-dot.active{background:var(--v);border-color:var(--v);color:#fff;box-shadow:0 0 18px var(--vg);}
.step-dot.done{background:var(--green);border-color:var(--green);color:#fff;}
.step-line{flex:1;height:1px;background:var(--border-2);}
.step-line.done{background:var(--green);}

/* FORM */
.form-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px;position:relative;overflow:hidden;}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.form-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.form-sub{font-size:14px;color:var(--text-2);margin-bottom:32px;}
.form-group{margin-bottom:22px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:12px 16px;outline:none;transition:border-color 180ms ease,box-shadow 180ms ease;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.form-textarea{resize:vertical;min-height:120px;}
.form-select{appearance:none;cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cat-opt{padding:12px 10px;border:1px solid var(--border-2);border-radius:10px;text-align:center;font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all 180ms var(--ease);}
.cat-opt:hover{border-color:rgba(124,58,237,0.4);color:var(--vs);}
.cat-opt.sel{border-color:var(--v);background:rgba(124,58,237,0.12);color:var(--vs);}
.form-actions{display:flex;gap:12px;margin-top:32px;}
.form-actions .btn{flex:1;justify-content:center;padding:14px 20px;font-size:15px;}
.step-panel{display:none;}
.step-panel.active{display:block;}

/* SUCCESS */
.success-card{text-align:center;padding:60px 40px;}
.success-icon{width:72px;height:72px;border-radius:50%;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);display:grid;place-items:center;color:var(--green);margin:0 auto 24px;font-size:32px;}
.success-title{font-size:26px;font-weight:800;margin-bottom:10px;}
.success-sub{font-size:15px;color:var(--text-2);max-width:380px;margin:0 auto 28px;}

/* SIDEBAR */
.brief-sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;}
.sidebar-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;}
.why-item{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;}
.why-item:last-child{margin-bottom:0;}
.why-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.2);color:var(--vs);}
.why-text b{display:block;font-size:13px;font-weight:700;margin-bottom:2px;}
.why-text span{font-size:12px;color:var(--text-3);}
.trust-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);}
.trust-row:last-child{border-bottom:none;}
.trust-row svg{color:var(--green);flex-shrink:0;}
.trust-row span{font-size:13px;color:var(--text-2);}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
.footer-mini{border-top:1px solid var(--border);padding:28px 0;display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.footer-mini a{font-size:13px;color:var(--text-3);transition:color 160ms;}
.footer-mini a:hover{color:var(--text);}
.footer-links{display:flex;gap:20px;}

@media(max-width:980px){.brief-layout{grid-template-columns:1fr;}.brief-sidebar{position:static;}.nav-links{display:none;}.cat-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.wrap{padding:0 18px;}.form-row{grid-template-columns:1fr;}.form-card{padding:24px;}}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = supabase;
const sb = createClient(
  'https://cjtglfutckaogsmwhfsv.supabase.co',
  'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei'
);

const Ic = {
  Arrow:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  Back:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>,
  Check:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Clock:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  Shield:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  Star:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
};

const CATS = ['Agents IA','Automatisation','Chatbots','Développement IA','Prompt Engineering','Montage vidéo IA','Branding IA','Formation IA'];

function App() {
  const [step, setStep] = useState(1);
  const [done, setDone] = useState(false);
  const [saving, setSaving] = useState(false);
  const [userId, setUserId] = useState(null);
  const [form, setForm] = useState({ cat:'', budget:'', delai:'', desc:'', nom:'', email:'', entreprise:'', tel:'' });

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      if (data.session) {
        const u = data.session.user;
        setUserId(u.id);
        const { data: profile } = await sb.from('profiles').select('prenom, nom').eq('id', u.id).single();
        if (profile) {
          const nom = `${profile.prenom || ''} ${profile.nom || ''}`.trim();
          setForm(f => ({ ...f, nom, email: u.email }));
        }
      }
    });
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  async function handleSubmit(e) {
    e.preventDefault();
    setSaving(true);
    await sb.from('briefs').insert({
      user_id: userId || null,
      categorie: form.cat,
      budget: form.budget,
      delai: form.delai,
      description: form.desc,
      nom_contact: form.nom,
      email_contact: form.email,
      entreprise: form.entreprise,
      telephone: form.tel,
      statut: 'ouvert',
    });
    setSaving(false);
    setDone(true);
  }

  return (
    <React.Fragment>
      <nav className="nav"><div className="wrap nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
        <div className="nav-links">
          <a href="experts.html" className="nav-link">Experts</a>
          <a href="brief.html" className="nav-link">Déposer un brief</a>
          <a href="inscription.html" className="nav-link">Devenir expert</a>
        </div>
        <div style={{display:'flex',gap:8}}>
          <a href="connexion.html" className="btn btn-ghost btn-sm">Connexion</a>
        </div>
      </div></nav>

      <div className="page-wrap">
        <div className="wrap">
          <div style={{paddingTop:20,marginBottom:8}}>
            <span className="eyebrow">Déposer un brief</span>
            <h1 style={{fontSize:'clamp(28px,4vw,44px)',fontWeight:800,letterSpacing:'-0.03em',margin:'12px 0 6px'}}>
              Décrivez votre besoin,<br/>on trouve l'expert.
            </h1>
            <p style={{fontSize:16,color:'var(--text-2)',maxWidth:480}}>Réponse sous 24h · Matching garanti · Zéro engagement</p>
          </div>
          <div className="brief-layout">
            <div>
              {!done ? (
                <React.Fragment>
                  <div className="steps-nav">
                    {[1,2,3].map(s => (
                      <React.Fragment key={s}>
                        <div className={`step-dot ${step === s ? 'active' : step > s ? 'done' : ''}`}>
                          {step > s ? <Ic.Check/> : s}
                        </div>
                        {s < 3 && <div className={`step-line ${step > s ? 'done' : ''}`}/>}
                      </React.Fragment>
                    ))}
                    <span style={{marginLeft:12,fontSize:13,color:'var(--text-3)'}}>Étape {step}/3</span>
                  </div>

                  <form name="brief-client" method="POST" data-netlify="true" onSubmit={handleSubmit}>
                    <input type="hidden" name="form-name" value="brief-client"/>

                    {step === 1 && (
                      <div className="form-card">
                        <h2 className="form-title">Quel est votre besoin ?</h2>
                        <p className="form-sub">Sélectionnez la catégorie qui correspond le mieux à votre projet.</p>
                        <div className="form-group">
                          <label className="form-label">Catégorie *</label>
                          <div className="cat-grid">
                            {CATS.map(c => (
                              <div key={c} className={`cat-opt ${form.cat === c ? 'sel' : ''}`} onClick={() => set('cat', c)}>{c}</div>
                            ))}
                          </div>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Budget estimé *</label>
                          <select className="form-select" value={form.budget} onChange={e => set('budget', e.target.value)} required>
                            <option value="">Sélectionner un budget</option>
                            <option value="moins500">Moins de 500$</option>
                            <option value="500-2000">500$ — 2 000$</option>
                            <option value="2000-5000">2 000$ — 5 000$</option>
                            <option value="plus5000">Plus de 5 000$</option>
                            <option value="nsp">Je ne sais pas encore</option>
                          </select>
                        </div>
                        <div className="form-group">
                          <label className="form-label">Délai souhaité *</label>
                          <select className="form-select" value={form.delai} onChange={e => set('delai', e.target.value)} required>
                            <option value="">Sélectionner un délai</option>
                            <option value="urgent">Urgent (cette semaine)</option>
                            <option value="2semaines">Dans 2 semaines</option>
                            <option value="1mois">Dans 1 mois</option>
                            <option value="flexible">Flexible</option>
                          </select>
                        </div>
                        <div className="form-actions">
                          <button type="button" className="btn btn-primary" onClick={() => { if(form.cat && form.budget && form.delai) setStep(2); }}>
                            Continuer <Ic.Arrow/>
                          </button>
                        </div>
                      </div>
                    )}

                    {step === 2 && (
                      <div className="form-card">
                        <h2 className="form-title">Décrivez votre projet</h2>
                        <p className="form-sub">Plus vous êtes précis, plus le matching sera pertinent.</p>
                        <div className="form-group">
                          <label className="form-label">Description du projet *</label>
                          <textarea className="form-textarea" placeholder="Décrivez votre projet, vos objectifs, les contraintes techniques, les livrables attendus..." value={form.desc} onChange={e => set('desc', e.target.value)} required style={{minHeight:160}}/>
                        </div>
                        <div className="form-actions">
                          <button type="button" className="btn btn-ghost" onClick={() => setStep(1)}><Ic.Back/>Retour</button>
                          <button type="button" className="btn btn-primary" onClick={() => { if(form.desc) setStep(3); }}>
                            Continuer <Ic.Arrow/>
                          </button>
                        </div>
                      </div>
                    )}

                    {step === 3 && (
                      <div className="form-card">
                        <h2 className="form-title">Vos coordonnées</h2>
                        <p className="form-sub">Pour recevoir les profils d'experts correspondants sous 24h.</p>
                        <div className="form-row">
                          <div className="form-group">
                            <label className="form-label">Prénom & Nom *</label>
                            <input className="form-input" type="text" placeholder="Jean Dupont" value={form.nom} onChange={e => set('nom', e.target.value)} required/>
                          </div>
                          <div className="form-group">
                            <label className="form-label">Email professionnel *</label>
                            <input className="form-input" type="email" placeholder="jean@entreprise.com" value={form.email} onChange={e => set('email', e.target.value)} required/>
                          </div>
                        </div>
                        <div className="form-row">
                          <div className="form-group">
                            <label className="form-label">Entreprise</label>
                            <input className="form-input" type="text" placeholder="Nom de votre entreprise" value={form.entreprise} onChange={e => set('entreprise', e.target.value)}/>
                          </div>
                          <div className="form-group">
                            <label className="form-label">Téléphone</label>
                            <input className="form-input" type="tel" placeholder="+33 6 00 00 00 00" value={form.tel} onChange={e => set('tel', e.target.value)}/>
                          </div>
                        </div>
                        <input type="hidden" name="categorie" value={form.cat}/>
                        <input type="hidden" name="budget" value={form.budget}/>
                        <input type="hidden" name="delai" value={form.delai}/>
                        <input type="hidden" name="description" value={form.desc}/>
                        <div className="form-actions">
                          <button type="button" className="btn btn-ghost" onClick={() => setStep(2)}><Ic.Back/>Retour</button>
                          <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? 'Envoi en cours…' : <><span>Envoyer mon brief</span><Ic.Arrow/></>}</button>
                        </div>
                      </div>
                    )}
                  </form>
                </React.Fragment>
              ) : (
                <div className="form-card success-card">
                  <div className="success-icon">✓</div>
                  <h2 className="success-title">Brief envoyé !</h2>
                  <p className="success-sub">Notre équipe analyse votre brief et vous propose des profils d'experts sous 24h.</p>
                  <a href="experts.html" className="btn btn-primary">Voir les experts <Ic.Arrow/></a>
                </div>
              )}
            </div>

            <div className="brief-sidebar">
              <div className="sidebar-card">
                <div style={{fontSize:13,fontWeight:700,marginBottom:16,color:'var(--text)'}}>Pourquoi passer par CreatorFlow Market ?</div>
                {[
                  {icon:<Ic.Clock/>,title:'Réponse en 24h',sub:'Matching personnalisé garanti'},
                  {icon:<Ic.Shield/>,title:'Experts certifiés',sub:'Profils vérifiés par notre équipe'},
                  {icon:<Ic.Star/>,title:'Note moyenne 4.9/5',sub:'Sur 200+ missions livrées'},
                ].map((w,i) => (
                  <div key={i} className="why-item">
                    <div className="why-icon">{w.icon}</div>
                    <div className="why-text"><b>{w.title}</b><span>{w.sub}</span></div>
                  </div>
                ))}
              </div>
              <div className="sidebar-card">
                <div style={{fontSize:13,fontWeight:700,marginBottom:12,color:'var(--text)'}}>Ce que vous recevrez</div>
                {['3 profils d\'experts sélectionnés','Estimation de tarif personnalisée','Disponibilités à jour','Introduction directe avec l\'expert'].map((t,i) => (
                  <div key={i} className="trust-row">
                    <Ic.Check/>
                    <span>{t}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
        <footer><div className="wrap footer-mini">
