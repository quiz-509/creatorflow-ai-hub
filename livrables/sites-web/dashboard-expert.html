<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard Expert — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--sidebar:240px;--nav:60px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 20px 0 0;}
.nav-brand{width:var(--sidebar);flex-shrink:0;display:flex;align-items:center;padding:0 20px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-right{display:flex;align-items:center;gap:12px;}
.notif-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surf);border:1px solid var(--border-2);color:var(--text-2);position:relative;transition:all 180ms;}
.notif-btn:hover{color:var(--text);border-color:var(--border-3);}
.notif-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg);}
.expert-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);cursor:pointer;transition:all 180ms;}
.expert-chip:hover{border-color:var(--border-3);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--v));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.badge-expert{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.25);font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:0.06em;}

.sidebar{position:fixed;top:var(--nav);left:0;bottom:0;width:var(--sidebar);background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.sidebar-section{padding:16px 12px 8px;}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 160ms;position:relative;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(6,182,212,0.10);color:var(--c);}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--c);}
.nav-badge{margin-left:auto;background:var(--c);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;}
.nav-badge-amber{background:var(--amber);color:#000;}
.sidebar-bottom{margin-top:auto;padding:16px 12px;border-top:1px solid var(--border);}

/* DISPONIBILITE TOGGLE */
.dispo-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin:8px 12px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:10px;}
.dispo-label{font-size:12px;font-weight:600;color:var(--green);}
.dispo-sub{font-size:10px;color:var(--text-3);margin-top:1px;}
.toggle{width:36px;height:20px;border-radius:99px;background:var(--green);position:relative;cursor:pointer;transition:background 180ms;flex-shrink:0;}
.toggle-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 180ms;transform:translateX(16px);}

.main{margin-left:var(--sidebar);padding-top:var(--nav);min-height:100vh;}
.main-inner{padding:32px 32px 80px;}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
.page-sub{font-size:14px;color:var(--text-2);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#0891B2,var(--c));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px rgba(6,182,212,0.5);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(6,182,212,0.6);}
.btn-purple{background:linear-gradient(135deg,#9333EA,var(--v));color:#fff;box-shadow:0 6px 20px -6px var(--vg);}
.btn-purple:hover{transform:translateY(-1px);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:6px 13px;font-size:12px;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;transition:border-color 180ms;}
.stat-card:hover{border-color:var(--border-2);}
.stat-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;font-size:18px;}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-0.04em;line-height:1;margin-bottom:4px;}
.stat-label{font-size:12px;color:var(--text-3);font-weight:500;}
.stat-trend{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;margin-top:8px;padding:3px 8px;border-radius:99px;}
.trend-up{background:rgba(16,185,129,0.1);color:var(--green);}
.trend-cyan{background:rgba(6,182,212,0.1);color:var(--c);}

.two-col{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
.section-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.section-title{font-size:14px;font-weight:700;}
.section-link{font-size:12px;color:var(--c);font-weight:500;}
.section-link:hover{text-decoration:underline;}

/* MISSIONS */
.mission-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);transition:background 150ms;}
.mission-item:last-child{border-bottom:none;}
.mission-item:hover{background:rgba(255,255,255,0.02);}
.mission-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-size:18px;}
.mission-info{flex:1;min-width:0;}
.mission-name{font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mission-meta{font-size:11px;color:var(--text-3);}
.mission-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-amber{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-cyan{background:rgba(6,182,212,0.10);color:var(--c);border:1px solid rgba(6,182,212,0.2);}
.badge-purple{background:rgba(124,58,237,0.12);color:var(--vs);border:1px solid rgba(124,58,237,0.2);}
.mission-price{font-size:12px;font-weight:700;color:var(--text-2);}
.prog-bar{height:4px;background:var(--surf-3);border-radius:99px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--v));}

/* OPPORTUNITÉS */
.opp-item{padding:16px 20px;border-bottom:1px solid var(--border);transition:background 150ms;}
.opp-item:last-child{border-bottom:none;}
.opp-item:hover{background:rgba(255,255,255,0.02);}
.opp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;}
.opp-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.opp-meta{font-size:11px;color:var(--text-3);}
.opp-desc{font-size:12px;color:var(--text-2);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.opp-footer{display:flex;align-items:center;gap:8px;}
.opp-budget{font-size:13px;font-weight:800;color:var(--vs);}
.opp-tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;background:var(--surf-2);color:var(--text-3);border:1px solid var(--border);}

/* REVENUS */
.rev-bars{display:flex;align-items:flex-end;gap:8px;height:80px;padding:0 20px 16px;}
.rev-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.rev-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--c),var(--v));opacity:0.7;transition:opacity 180ms;}
.rev-bar:hover{opacity:1;}
.rev-bar-label{font-size:9px;color:var(--text-3);}
.rev-total{display:flex;align-items:baseline;gap:6px;padding:16px 20px 0;border-top:1px solid var(--border);}
.rev-amount{font-size:26px;font-weight:800;letter-spacing:-0.04em;}
.rev-period{font-size:12px;color:var(--text-3);}
.rev-trend{font-size:11px;color:var(--green);font-weight:600;margin-left:auto;}

/* MESSAGES */
.msg-item{display:flex;align-items:flex-start;gap:11px;padding:14px 20px;border-bottom:1px solid var(--border);transition:background 150ms;cursor:pointer;}
.msg-item:last-child{border-bottom:none;}
.msg-item:hover{background:rgba(255,255,255,0.02);}
.msg-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.msg-body{flex:1;min-width:0;}
.msg-name{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:2px;}
.msg-preview{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-time{font-size:10px;color:var(--text-3);flex-shrink:0;margin-top:2px;}
.msg-item.unread .msg-name{color:var(--text);}
.msg-item.unread .msg-preview{color:var(--text-2);}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0;margin-top:6px;}

/* AGENDA */
.agenda-item{display:flex;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);align-items:center;}
.agenda-item:last-child{border-bottom:none;}
.agenda-date{width:38px;height:38px;border-radius:10px;background:var(--surf-2);border:1px solid var(--border-2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.agenda-day{font-size:14px;font-weight:800;line-height:1;color:var(--text);}
.agenda-month{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;}
.agenda-info{flex:1;}
.agenda-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.agenda-client{font-size:11px;color:var(--text-3);}
.agenda-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* PROFIL CARD */
.profil-card{background:linear-gradient(135deg,rgba(6,182,212,0.08),rgba(124,58,237,0.08));border:1px solid rgba(6,182,212,0.2);border-radius:var(--r-lg);padding:20px;text-align:center;}
.profil-avatar-lg{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--v));display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 12px;border:2px solid rgba(6,182,212,0.3);}
.profil-name{font-size:16px;font-weight:800;margin-bottom:3px;}
.profil-spec{font-size:12px;color:var(--text-3);margin-bottom:14px;}
.stars{display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:14px;}
.profil-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.p-stat{background:var(--surf-2);padding:10px 6px;text-align:center;}
.p-stat-val{font-size:15px;font-weight:800;}
.p-stat-label{font-size:10px;color:var(--text-3);}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.04) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 80ms linear,top 80ms linear;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);padding:32px;width:100%;max-width:480px;position:relative;}
.modal-title{font-size:18px;font-weight:800;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}
.modal-field{margin-bottom:16px;}
.modal-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}
.modal-input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:var(--f);transition:border-color 150ms;}
.modal-input:focus{outline:none;border-color:var(--v);}
.modal-textarea{resize:vertical;min-height:90px;}
.modal-actions{display:flex;gap:10px;margin-top:24px;}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;background:var(--surf-2);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;color:var(--text-2);}
.modal-close:hover{color:var(--text);}

.sidebar{transition:transform 280ms cubic-bezier(0.16,1,0.3,1);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:99;}
.hamburger{display:none;width:36px;height:36px;border-radius:9px;background:var(--surf);border:1px solid var(--border-2);place-items:center;color:var(--text-2);flex-shrink:0;}
.hamburger:hover{color:var(--text);border-color:var(--border-3);}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr);}.two-col{grid-template-columns:1fr;}}
@media(max-width:768px){.sidebar{transform:translateX(-100%);}.sidebar.open{transform:translateX(0);}.sidebar-backdrop.open{display:block;}.main{margin-left:0;}.main-inner{padding:20px 16px 60px;}.hamburger{display:grid;}.nav-brand{width:auto;}}
  </style>
</head>

  Check:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Star:(p)=><svg {...p} width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
  Logout:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
  TrendUp:(p)=><svg {...p} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
};


const NAV_ITEMS = [
  {id:'overview', label:'Vue d\'ensemble', icon:<Ic.Grid/>},
  {id:'missions', label:'Mes missions', icon:<Ic.Briefcase/>, badge:3},
  {id:'opps', label:'Opportunités', icon:<Ic.Search/>, badge:5, badgeClass:'nav-badge-amber'},
  {id:'messages', label:'Messages', icon:<Ic.Msg/>, badge:2, href:'messages.html'},
  {id:'revenus', label:'Mes revenus', icon:<Ic.DollarSign/>},
  {id:'agenda', label:'Agenda', icon:<Ic.Calendar/>},
  {id:'profil', label:'Mon profil', icon:<Ic.User/>, hrefFn:(u)=>`profil-expert.html?id=${u?.id||''}`},
];

function App() {
  const [active, setActive] = useState('overview');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [dispo, setDispo] = useState(true);
  const [user, setUser] = useState(null);
  const [expert, setExpert] = useState(null);
  const [opps, setOpps] = useState([]);
  const [convs, setConvs] = useState([]);
  const [missions, setMissions] = useState([]);
  const [missionCount, setMissionCount] = useState(0);
  const [showModal, setShowModal] = useState(false);
  const [selectedBrief, setSelectedBrief] = useState(null);
  const [montantForm, setMontantForm] = useState('');
  const [messageForm, setMessageForm] = useState('');
  const [delaiForm, setDelaiForm] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [postuleDone, setPostuleDone] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      if (!data.session) { window.location.href = 'connexion.html'; return; }
      const u = data.session.user;
      setUser(u);
      const { data: profile } = await sb.from('profiles').select('*').eq('id', u.id).single();
      const { data: exp } = await sb.from('experts').select('*').eq('id', u.id).single();
      if (profile) setUser({ ...u, ...profile });
      if (exp) { setExpert(exp); setDispo(exp.disponible !== false); }
      const { data: o } = await sb.from('briefs').select('id,categorie,budget,delai,description,created_at,user_id').eq('statut', 'ouvert').neq('user_id', u.id).order('created_at', {ascending: false}).limit(5);
      setOpps(o || []);
      const { data: c } = await sb.from('conversations').select('id,created_at,client_id').eq('expert_id', u.id).order('created_at', {ascending: false}).limit(3);
      const clientIds = (c || []).map(cv => cv.client_id).filter(Boolean);
      let clientProfileMap = {};
      if (clientIds.length > 0) {
        const { data: cp } = await sb.from('profiles').select('id,prenom,nom').in('id', clientIds);
        (cp || []).forEach(p => { clientProfileMap[p.id] = p; });
      }
      setConvs((c || []).map(cv => {
        const p = clientProfileMap[cv.client_id] || {};
        const name = `${p.prenom||''} ${p.nom||''}`.trim() || 'Client';
        const ini = name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || 'CL';
        return { ...cv, clientName: name, clientInitials: ini };
      }));
      const { data: m } = await sb.from('missions').select('id,titre,categorie,statut,prix,deadline,progression,client_id').eq('expert_id', u.id).order('created_at', {ascending: false}).limit(4);
      setMissions(m || []);
      const { count: totalM } = await sb.from('missions').select('id', { count: 'exact', head: true }).eq('expert_id', u.id);
      setMissionCount(totalM || 0);
    });
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    return () => window.removeEventListener('mousemove', move);
  }, []);

  const handleLogout = async () => {
    await sb.auth.signOut();
    window.location.href = 'connexion.html';
  };

  const handleDispo = async () => {
    const newVal = !dispo;
    setDispo(newVal);
    if (user?.id) await sb.from('experts').update({ disponible: newVal }).eq('id', user.id);
  };

  const openModal = (brief) => {
    setSelectedBrief(brief);
    setMontantForm('');
    setMessageForm('');
    setDelaiForm('');
    setPostuleDone(false);
    setShowModal(true);
  };

  const handlePostuler = async (e) => {
    e.preventDefault();
    if (!montantForm || !messageForm) return;
    setSubmitting(true);
    const { data: { session } } = await sb.auth.getSession();
    const { error } = await sb.from('propositions').insert({
      brief_id: selectedBrief.id,
      expert_id: session.user.id,
      client_id: selectedBrief.user_id,
      montant: parseInt(montantForm, 10),
      message: messageForm,
      delai: delaiForm || null,
      nom_expert: `${user?.prenom || ''} ${user?.nom || ''}`.trim() || 'Expert',
    });
    if (!error) {
      setPostuleDone(true);
      const { data: clientProfile } = await sb.from('profiles').select('email').eq('id', selectedBrief.user_id).single();
      if (clientProfile?.email) {
        fetch('https://cjtglfutckaogsmwhfsv.supabase.co/functions/v1/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': 'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({ type: 'nouvelle_proposition', to: clientProfile.email, data: { expert_name: `${user?.prenom||''} ${user?.nom||''}`.trim()||'Expert', montant: montantForm, categorie: selectedBrief.categorie||'Projet', message: messageForm, delai: delaiForm } }),
        }).catch(() => {});
      }
    }
    setSubmitting(false);
  };

  const initials = user ? ((user.prenom||'?')[0] + (user.nom||'?')[0]).toUpperCase() : '??';
  const fullName = user ? `${user.prenom || ''} ${user.nom || ''}`.trim() : 'Chargement…';
  const prenom = user?.prenom || 'Expert';
  const todayStr = (() => { const s = new Date().toLocaleDateString('fr-FR', {weekday:'long',day:'numeric',month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); })();

  return (
    <React.Fragment>
      <div className={`sidebar-backdrop${sidebarOpen?' open':''}`} onClick={()=>setSidebarOpen(false)}/>
      {/* NAV */}
      <nav className="nav">
        <div className="nav-inner">
          <div className="nav-brand">
            <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)} aria-label="Menu">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <a href="/" className="brand"><div className="brand-logo"></div><span>CreatorFlow Market</span></a>
          </div>
          <div className="nav-right">
            <button className="notif-btn"><Ic.Bell/><span className="notif-dot"/></button>
            <div className="expert-chip">
              <div className="avatar">{initials}</div>
              <span style={{fontSize:13,fontWeight:600}}>{fullName}</span>
              <span className="badge-expert">Expert</span>
            </div>
          </div>
        </div>
      </nav>

      {/* SIDEBAR */}
      <aside className={`sidebar${sidebarOpen?' open':''}`}>
        <div className="sidebar-section">
          <div className="sidebar-label">Menu</div>
          {NAV_ITEMS.map(item => {
            const href = item.href || (item.hrefFn ? item.hrefFn(user) : null);
            const badge = item.badge ? <span className={`nav-badge ${item.badgeClass || ''}`}>{item.id==='missions' ? missionCount : item.id==='opps' ? opps.length : item.badge}</span> : null;
            const cls = `nav-item ${active === item.id ? 'active' : ''}`;
            return href ? (
              <a key={item.id} href={href} className={cls} style={{textDecoration:'none',color:'inherit'}}>
                {item.icon}{item.label}{badge}
              </a>
            ) : (
              <div key={item.id} className={cls} onClick={() => { setActive(item.id); setSidebarOpen(false); }}>
                {item.icon}{item.label}{badge}
              </div>
            );
          })}
        </div>

        {/* DISPONIBILITÉ */}
        <div className="dispo-row" onClick={handleDispo} style={!dispo ? {background:'rgba(239,68,68,0.06)',borderColor:'rgba(239,68,68,0.2)'} : {}}>
          <div>
            <div className="dispo-label" style={!dispo ? {color:'var(--red)'} : {}}>{dispo ? 'Disponible' : 'Indisponible'}</div>
            <div className="dispo-sub">{dispo ? 'Visible dans les recherches' : 'Masqué des résultats'}</div>
          </div>
          <div className="toggle" style={!dispo ? {background:'var(--red)'} : {}}>
            <div className="toggle-knob" style={!dispo ? {transform:'translateX(0)'} : {}}/>
          </div>
        </div>

        <div className="sidebar-section">
          <div className="sidebar-label">Compte</div>
          <div className="nav-item"><Ic.Settings/>Paramètres</div>
        </div>
        <div className="sidebar-bottom">
          <button onClick={handleLogout} className="nav-item" style={{color:'var(--text-3)',width:'100%',textAlign:'left'}}><Ic.Logout/>Déconnexion</button>
        </div>
      </aside>

      {/* MAIN */}
      <main className="main">
        <div className="main-inner">

          {/* HEADER */}
          <div className="page-header">
            <div>
              <h1 className="page-title">Bonjour, {prenom} ✨</h1>
              <p className="page-sub">{todayStr} · {missionCount} mission{missionCount !== 1 ? 's' : ''} active{missionCount !== 1 ? 's' : ''} · {opps.length} opportunité{opps.length !== 1 ? 's' : ''}</p>
            </div>
            <a href="profil-expert.html" className="btn btn-primary">Voir mon profil <Ic.Arrow/></a>
          </div>

          {/* STATS */}
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(6,182,212,0.10)',color:'var(--c)'}}>🚀</div>
              <div className="stat-val">{missions.length}</div>
              <div className="stat-label">Missions actives</div>
              <div className="stat-trend trend-cyan"><Ic.TrendUp/>{missions.length > 0 ? 'En cours' : 'Aucune'}</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(16,185,129,0.10)',color:'var(--green)'}}>💶</div>
              <div className="stat-val">—</div>
              <div className="stat-label">Revenus ce mois</div>
              <div className="stat-trend" style={{background:'transparent',color:'var(--text-3)',padding:0}}>Bientôt disponible</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(245,158,11,0.10)',color:'var(--amber)'}}>📨</div>
              <div className="stat-val">{opps.length}</div>
              <div className="stat-label">Nouvelles opportunités</div>
              <div className="stat-trend" style={{background:'rgba(245,158,11,0.1)',color:'var(--amber)'}}>{opps.length > 0 ? 'À postuler' : 'Aucune'}</div>
            </div>
            <div className="stat-card">
              <div className="stat-icon" style={{background:'rgba(124,58,237,0.12)',color:'var(--vs)'}}>⭐</div>
              <div className="stat-val">{expert?.note != null ? expert.note : '—'}</div>
              <div className="stat-label">Note moyenne</div>
              <div className="stat-trend trend-up"><Ic.Check/>{expert?.nb_avis || 0} avis</div>
            </div>
          </div>

          {/* 2 COL */}
          <div className="two-col">

            {/* COL GAUCHE */}
            <div style={{display:'flex',flexDirection:'column',gap:20}}>

              {/* MISSIONS */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Mes missions en cours</span>
                  <a href="#" className="section-link" onClick={e=>{e.preventDefault();setActive('missions');}}>Tout voir →</a>
                </div>
                {missions.length === 0 ? (
                  <div style={{padding:'32px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:32,marginBottom:8}}>🚀</div>
                    <div style={{fontSize:13}}>Aucune mission en cours</div>
                  </div>
                ) : missions.map(m => {
                  const statusMap = {nouveau:'badge-green',en_cours:'badge-green',en_revision:'badge-amber',termine:'badge-green',annule:'badge-red'};
                  const labelMap = {nouveau:'Nouveau',en_cours:'En cours',en_revision:'En révision',termine:'Terminé',annule:'Annulé'};
                  return (
                    <a key={m.id} className="mission-item" href={`mission.html?id=${m.id}`} style={{cursor:'pointer',textDecoration:'none',color:'inherit'}}>
                      <div className="mission-icon" style={{background:'rgba(6,182,212,0.10)',color:'var(--c)'}}>🚀</div>
                      <div className="mission-info">
                        <div className="mission-name">{m.titre}</div>
                        <div className="mission-meta">{m.categorie}</div>
                        {m.progression != null && <div className="prog-bar" style={{width:130}}><div className="prog-fill" style={{width:m.progression+'%'}}/></div>}
                      </div>
                      <div className="mission-right">
                        <span className={`badge ${statusMap[m.statut] || 'badge-green'}`}>{labelMap[m.statut] || m.statut}</span>
                        <span className="mission-price">{m.prix ? m.prix+'$' : ''}</span>
                        <span style={{fontSize:10,color:'var(--text-3)'}}>{m.deadline ? 'Livraison ' + new Date(m.deadline).toLocaleDateString('fr-CA') : ''}</span>
                      </div>
                    </a>
                  );
                })}
              </div>

              {/* OPPORTUNITÉS */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Nouvelles opportunités</span>
                  {opps.length > 0 && <span style={{background:'rgba(245,158,11,0.1)',color:'var(--amber)',fontSize:11,fontWeight:700,padding:'3px 9px',borderRadius:99}}>{opps.length} briefs</span>}
                </div>
                {opps.length === 0 ? (
                  <div style={{padding:'32px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:32,marginBottom:8}}>📭</div>
                    <div style={{fontSize:13}}>Aucune opportunité disponible pour le moment</div>
                  </div>
                ) : opps.map(o => (
                  <div key={o.id} className="opp-item">
                    <div className="opp-top">
                      <div>
                        <div className="opp-title">{o.categorie || 'Projet IA'}</div>
                        <div className="opp-meta">Anonyme · {o.delai}</div>
                      </div>
                      <div className="opp-budget">{o.budget}</div>
                    </div>
                    <p className="opp-desc">{(o.description||'').slice(0,120)}{(o.description||'').length > 120 ? '…' : ''}</p>
                    <div className="opp-footer">
                      <button className="btn btn-purple btn-sm" onClick={() => openModal(o)}>Postuler <Ic.Arrow/></button>
                    </div>
                  </div>
                ))}
              </div>

            </div>

            {/* COL DROITE */}
            <div style={{display:'flex',flexDirection:'column',gap:20}}>

              {/* PROFIL CARD */}
              <div className="profil-card">
                <div className="profil-avatar-lg">{initials}</div>
                <div className="profil-name">{fullName}</div>
                <div className="profil-spec">{expert?.specialite || 'Expert IA'} · {expert?.niveau || ''}</div>
                <div className="stars">
                  {[1,2,3,4,5].map(i => <Ic.Star key={i} style={{color:'var(--amber)'}}/>)}
                  <span style={{fontSize:12,color:'var(--text-2)',marginLeft:4}}>{expert?.note != null ? expert.note : '—'} ({expert?.nb_avis || 0} avis)</span>
                </div>
                <div className="profil-stats">
                  <div className="p-stat"><div className="p-stat-val">{missionCount}</div><div className="p-stat-label">Missions</div></div>
                  <div className="p-stat"><div className="p-stat-val">{expert?.note != null ? expert.note : '—'}</div><div className="p-stat-label">Note moy.</div></div>
                  <div className="p-stat"><div className="p-stat-val">24h</div><div className="p-stat-label">Réponse</div></div>
                </div>
                <a href="parametres.html" className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}}>Modifier le profil</a>
              </div>

              {/* REVENUS MINI CHART */}
              <div className="section-card">
                <div style={{padding:'18px 20px 16px'}}>
                  <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>Revenus 2026</div>
                  <div className="rev-total">
                    <span className="rev-amount">—</span>
                    <span className="rev-period">données non disponibles</span>
                  </div>
                  <div style={{fontSize:11,color:'var(--text-3)',marginTop:10}}>Le suivi des revenus sera disponible prochainement.</div>
                </div>
              </div>

              {/* MESSAGES */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Messages récents</span>
                  <a href="#" className="section-link" onClick={e=>{e.preventDefault();setActive('messages');}}>Tout voir →</a>
                </div>
                {convs.length === 0 ? (
                  <div style={{padding:'24px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:28,marginBottom:8}}>💬</div>
                    <div style={{fontSize:13}}>Aucune conversation active</div>
                  </div>
                ) : convs.map(c => (
                  <a key={c.id} className="msg-item" href={`messages.html?conv=${c.id}`} style={{textDecoration:'none',color:'inherit'}}>
                    <div className="msg-avatar" style={{background:'linear-gradient(135deg,#0891B2,#06B6D4)'}}>{c.clientInitials}</div>
                    <div className="msg-body">
                      <div className="msg-name">{c.clientName}</div>
                      <div className="msg-preview">Conversation en cours</div>
                    </div>
                    <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
                      <span className="msg-time">{new Date(c.created_at).toLocaleDateString('fr-CA')}</span>
                    </div>
                  </a>
                ))}
              </div>

              {/* AGENDA */}
              <div className="section-card">
                <div className="section-head">
                  <span className="section-title">Agenda</span>
                  <a href="#" className="section-link" onClick={e=>{e.preventDefault();setActive('agenda');}}>Tout voir →</a>
                </div>
                {missions.filter(m => m.deadline).length === 0 ? (
                  <div style={{padding:'24px 20px',textAlign:'center',color:'var(--text-3)'}}>
                    <div style={{fontSize:28,marginBottom:8}}>📅</div>
                    <div style={{fontSize:13}}>Aucun événement prévu</div>
                  </div>
                ) : missions.filter(m => m.deadline).map(m => {
                  const d = new Date(m.deadline);
                  return (
                    <a key={m.id} href={`mission.html?id=${m.id}`} className="agenda-item" style={{textDecoration:'none',color:'inherit'}}>
                      <div className="agenda-date">
                        <div className="agenda-day" style={{color:'var(--c)'}}>{d.getDate().toString().padStart(2,'0')}</div>
                        <div className="agenda-month">{d.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</div>
                      </div>
                      <div className="agenda-info">
                        <div className="agenda-title">Livraison : {m.titre}</div>
                        <div className="agenda-client">{m.categorie || ''}</div>
                      </div>
                      <div className="agenda-dot" style={{background:'var(--c)'}}/>
                    </a>
                  );
                })}
              </div>

            </div>
          </div>
        </div>
      </main>
      {/* MODAL POSTULER */}
      {showModal && (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) setShowModal(false); }}>
          <div className="modal-box">
            <button className="modal-close" onClick={() => setShowModal(false)}>✕</button>
            {postuleDone ? (
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:40,marginBottom:12}}>🎉</div>
                <div className="modal-title" style={{marginBottom:8}}>Proposition envoyée !</div>
                <div style={{fontSize:13,color:'var(--text-2)',marginBottom:24}}>Le client recevra ta candidature et pourra l'accepter ou la refuser.</div>
                <button className="btn btn-ghost btn-sm" onClick={() => setShowModal(false)}>Fermer</button>
              </div>
            ) : (
              <form onSubmit={handlePostuler}>
                <div className="modal-title">Postuler sur ce brief</div>
                <div className="modal-sub">{selectedBrief?.categorie || 'Projet IA'} · {selectedBrief?.budget}</div>
                <div className="modal-field">
                  <label className="modal-label">Ton tarif (CAD $) *</label>
                  <input className="modal-input" type="number" min="1" placeholder="ex: 1200" value={montantForm} onChange={e => setMontantForm(e.target.value)} required/>
                </div>
                <div className="modal-field">
                  <label className="modal-label">Délai proposé</label>
                  <input className="modal-input" type="text" placeholder="ex: 2 semaines" value={delaiForm} onChange={e => setDelaiForm(e.target.value)}/>
                </div>
                <div className="modal-field">
                  <label className="modal-label">Message au client *</label>
                  <textarea className="modal-input modal-textarea" placeholder="Présente ton approche, ton expérience, pourquoi tu es le bon expert…" value={messageForm} onChange={e => setMessageForm(e.target.value)} required/>
                </div>
                <div className="modal-actions">
                  <button type="button" className="btn btn-ghost btn-sm" onClick={() => setShowModal(false)}>Annuler</button>
                  <button type="submit" className="btn btn-primary btn-sm" disabled={submitting} style={{flex:1,justifyContent:'center'}}>
                    {submitting ? 'Envoi…' : 'Envoyer ma proposition'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
