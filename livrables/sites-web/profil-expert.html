<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Profil Expert IA — CreatorFlow Market</title>
  <meta name="description" content="Consultez le profil de cet expert IA certifié sur CreatorFlow Market. Compétences, expériences, tarifs et avis clients."/>
  <meta name="robots" content="index, follow"/>
  <meta property="og:type" content="profile"/>
  <meta property="og:site_name" content="CreatorFlow Market"/>
  <meta property="og:locale" content="fr_CA"/>
  <meta name="twitter:card" content="summary"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"></noscript>
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#13132A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--cg:rgba(6,182,212,0.25);--green:#10B981;--orange:#F59E0B;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,4,10,0.85);backdrop-filter:blur(18px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-right{display:flex;align-items:center;gap:12px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-outline{background:transparent;border:1px solid var(--border-2);color:var(--text-2);}
.btn-outline:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
.btn-cyan{background:linear-gradient(135deg,var(--c),#0891B2);color:#fff;box-shadow:0 6px 20px -6px var(--cg);}
.btn-cyan:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px var(--cg);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}

/* LAYOUT */
.page{padding-top:64px;min-height:100vh;}
.container{max-width:1100px;margin:0 auto;padding:0 24px;}

/* HERO */
.hero{background:linear-gradient(180deg,rgba(124,58,237,0.08) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:48px 0 0;}
.hero-inner{display:flex;gap:32px;align-items:flex-start;}
.hero-avatar-wrap{position:relative;flex-shrink:0;}
.hero-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff;border:3px solid var(--border-2);}
.hero-badge{position:absolute;bottom:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--green);border:2px solid var(--bg);}
.hero-info{flex:1;}
.hero-name{font-size:26px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
.hero-title{font-size:15px;color:var(--text-2);margin-bottom:12px;}
.hero-rating{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.stars{display:flex;gap:2px;}
.star{color:var(--orange);font-size:14px;}
.star.empty{color:var(--text-3);}
.rating-val{font-size:14px;font-weight:700;}
.rating-count{font-size:13px;color:var(--text-3);}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.tag{padding:5px 12px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);border-radius:999px;font-size:12px;font-weight:600;color:var(--vs);}
.tag-cyan{background:rgba(6,182,212,0.10);border-color:rgba(6,182,212,0.25);color:var(--c);}
.hero-meta{display:flex;gap:20px;}
.meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3);}
.meta-item svg{flex-shrink:0;}
.hero-actions{display:flex;flex-direction:column;gap:10px;min-width:180px;}
.dispo-chip{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(16,185,129,0.10);border:1px solid rgba(16,185,129,0.25);color:var(--green);font-size:12px;font-weight:600;justify-content:center;}
.dispo-dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.hero-tabs{display:flex;gap:0;margin-top:32px;border-bottom:1px solid var(--border);}
.htab{padding:14px 20px;font-size:14px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 180ms;cursor:pointer;}
.htab:hover{color:var(--text-2);}
.htab.active{color:var(--vs);border-bottom-color:var(--v);}

/* BODY */
.body-grid{display:grid;grid-template-columns:1fr 300px;gap:24px;padding:32px 0 60px;}

/* SECTION */
.section{margin-bottom:28px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-title span{font-size:12px;font-weight:500;color:var(--text-3);padding:2px 8px;background:var(--surf-2);border-radius:999px;border:1px solid var(--border);}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:28px;}
.stat-cell{background:var(--surf);padding:20px 16px;text-align:center;}
.stat-val{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px;}
.stat-val.purple{color:var(--vs);}
.stat-val.cyan{color:var(--c);}
.stat-val.green{color:var(--green);}
.stat-val.orange{color:var(--orange);}
.stat-lbl{font-size:12px;color:var(--text-3);}

/* ABOUT */
.about-text{font-size:14px;color:var(--text-2);line-height:1.75;}

/* SKILLS */
.skills-grid{display:flex;flex-wrap:wrap;gap:8px;}
.skill-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;font-size:13px;font-weight:500;}
.skill-bar-wrap{margin-top:4px;}
.skill-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.skill-name{font-size:13px;font-weight:600;width:140px;flex-shrink:0;}
.skill-bar{flex:1;height:6px;background:var(--surf-2);border-radius:999px;overflow:hidden;}
.skill-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--v),var(--c));}
.skill-pct{font-size:12px;color:var(--text-3);width:36px;text-align:right;flex-shrink:0;}

/* PORTFOLIO */
.portfolio-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.portfolio-card{background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color 200ms,transform 200ms;}
.portfolio-card:hover{border-color:rgba(124,58,237,0.35);transform:translateY(-3px);}
.portfolio-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.10));}
.portfolio-body{padding:14px;}
.portfolio-name{font-size:13px;font-weight:700;margin-bottom:4px;}
.portfolio-desc{font-size:12px;color:var(--text-3);line-height:1.6;margin-bottom:10px;}
.portfolio-tags{display:flex;gap:6px;flex-wrap:wrap;}
.ptag{font-size:11px;padding:3px 8px;background:rgba(124,58,237,0.12);border-radius:999px;color:var(--vs);}

/* REVIEWS */
.review-card{background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.review-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.review-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.review-meta{flex:1;}
.review-name{font-size:13px;font-weight:700;}
.review-date{font-size:12px;color:var(--text-3);}
.review-stars{display:flex;gap:2px;margin-left:auto;}
.review-body{font-size:13px;color:var(--text-2);line-height:1.65;}
.review-mission{font-size:11px;color:var(--text-3);margin-top:8px;}

/* SIDEBAR */
.sidebar-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:16px;}
.sidebar-title{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--text-2);}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.price-row:last-child{border:none;padding-bottom:0;}
.price-label{font-size:13px;color:var(--text-3);}
.price-val{font-size:14px;font-weight:700;}
.price-val.big{font-size:20px;color:var(--vs);}
.resp-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.resp-icon{width:32px;height:32px;border-radius:8px;background:var(--surf-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.resp-text{font-size:13px;}
.resp-text strong{display:block;font-weight:700;}
.resp-text span{font-size:12px;color:var(--text-3);}
.guarantee-list{display:flex;flex-direction:column;gap:8px;}
.guarantee-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);}
.guarantee-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.similar-expert{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.similar-expert:last-child{border:none;padding-bottom:0;}
.sim-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.sim-info{flex:1;}
.sim-name{font-size:13px;font-weight:600;}
.sim-spec{font-size:12px;color:var(--text-3);}
.sim-rate{font-size:13px;font-weight:700;color:var(--vs);}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 500ms var(--ease) both;}

@media(max-width:768px){
  .wrap{padding:0 16px;}
  .body-grid{grid-template-columns:1fr!important;gap:20px;padding:20px 0 48px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .stat-cell{padding:16px 12px;}
  .stat-val{font-size:18px;}
  .portfolio-grid{grid-template-columns:1fr;}
  .hero-section{padding:24px 0 0;}
  .btn{padding:10px 18px;font-size:13px;}
  .btn-lg{padding:12px 20px;font-size:14px;}
  .hero-inner{flex-direction:column;align-items:center;gap:16px;}
  .hero-avatar-wrap{margin:0 auto;}
  .hero-info{width:100%;}
  .hero-actions{min-width:unset;width:100%;}
  .hero-actions .btn{width:100%;justify-content:center;}
  .prof-tags{flex-wrap:wrap;}
  .prof-location{flex-wrap:wrap;gap:8px;}
  .sidebar-card{margin-bottom:12px;}
}
@media(max-width:480px){
  .nav-inner{padding:0 12px;}
  .nav-right .btn-primary{display:none;}
  .nav-right .btn-ghost{font-size:12px;padding:7px 12px;}
  .stats-row{grid-template-columns:1fr 1fr;}
  .stat-val{font-size:16px;}
  .nav-links{display:none;}
}
  </style>
