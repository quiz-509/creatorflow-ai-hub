  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
:root {
  --bg:#04040A;--bg-2:#07070F;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;
  --border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);
  --text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;
  --v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);
  --c:#06B6D4;--cs:#67E8F9;--green:#10B981;--amber:#F59E0B;
  --r:14px;--r-lg:20px;--r-xl:28px;
  --f:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid transparent;transition:all 300ms ease;}
.nav.stuck{background:rgba(4,4,10,0.88);backdrop-filter:blur(20px);border-color:var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);transition:all 180ms ease;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.nav-ctas{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset,0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:8px 16px;font-size:13px;}
.btn-lg{padding:14px 28px;font-size:15px;}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);font-weight:500;transition:all 160ms var(--ease);}
.tag:hover{background:rgba(124,58,237,0.14);border-color:rgba(124,58,237,0.4);color:var(--vs);}
.tags{display:flex;gap:6px;flex-wrap:wrap;}

/* LAYOUT */
.profile-page{padding-top:88px;}
.profile-layout{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start;padding:48px 0 100px;}

/* MAIN CONTENT */
.profile-hero{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px;margin-bottom:24px;position:relative;overflow:hidden;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--v),var(--c));}
.profile-top{display:flex;gap:28px;align-items:flex-start;margin-bottom:28px;}
.profile-avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid rgba(124,58,237,0.4);box-shadow:0 0 32px rgba(124,58,237,0.3);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;}
.cert-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cert-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);padding:3px 9px;border-radius:999px;}
.avail-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);}
.avail-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.profile-name{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
.profile-role{font-size:16px;color:var(--text-2);margin-bottom:14px;}
.profile-stats{display:flex;gap:24px;}
.pstat{text-align:center;}
.pstat-v{font-size:20px;font-weight:700;color:var(--text);}
.pstat-l{font-size:11px;color:var(--text-3);letter-spacing:0.06em;}
.stars-row{display:flex;align-items:center;gap:4px;color:var(--amber);font-size:14px;font-weight:600;margin-top:2px;}

.section-title{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.profile-bio{font-size:15px;color:var(--text-2);line-height:1.75;margin-bottom:28px;}

/* PORTFOLIO */
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
.portfolio-card{background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:all 220ms var(--ease);}
.portfolio-card:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-2px);}
.portfolio-icon{width:38px;height:38px;border-radius:10px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.2);display:grid;place-items:center;color:var(--vs);margin-bottom:12px;}
.portfolio-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.portfolio-desc{font-size:12px;color:var(--text-3);line-height:1.5;}

/* REVIEWS */
.review-card{background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px;}
.review-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.reviewer{display:flex;align-items:center;gap:10px;}
.reviewer-avt{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.reviewer-avt img{width:100%;height:100%;object-fit:cover;}
.reviewer-name{font-size:13px;font-weight:600;}
.reviewer-co{font-size:11px;color:var(--text-3);}
.review-stars{display:flex;gap:2px;color:var(--amber);}
.review-text{font-size:13px;color:var(--text-2);line-height:1.65;}

/* SIDEBAR */
.profile-sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;}
.sidebar-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;}
.sidebar-rate{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px;}
.sidebar-rate small{font-size:14px;font-weight:400;color:var(--text-3);}
.sidebar-label{font-size:12px;color:var(--text-3);margin-bottom:20px;}
.sidebar-btn{width:100%;justify-content:center;margin-bottom:10px;}
.sidebar-info{display:flex;flex-direction:column;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
.sinfo-row{display:flex;justify-content:space-between;font-size:13px;}
.sinfo-k{color:var(--text-3);}
.sinfo-v{color:var(--text);font-weight:500;}
.sidebar-share{display:flex;gap:8px;margin-top:16px;}
.share-btn{flex:1;justify-content:center;}

/* REVEAL */
@keyframes fade-up{from{opacity:0;transform:translateY(20px);filter:blur(3px);}to{opacity:1;transform:none;filter:blur(0);}}
.rv{opacity:0;animation:fade-up 600ms var(--ease) both;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}

.footer-mini{border-top:1px solid var(--border);padding:28px 0;display:flex;align-items:center;justify-content:space-between;}
.footer-mini a{font-size:13px;color:var(--text-3);transition:color 160ms;}
.footer-mini a:hover{color:var(--text);}
.footer-links{display:flex;gap:20px;}

@media(max-width:980px){.profile-layout{grid-template-columns:1fr;}.profile-sidebar{position:static;}.portfolio-grid{grid-template-columns:1fr 1fr;}.nav-links{display:none;}}
@media(max-width:640px){.wrap{padding:0 18px;}.profile-top{flex-direction:column;}.portfolio-grid{grid-template-columns:1fr;}.profile-stats{gap:14px;}}
@media(max-width:480px){.nav-inner{padding:0 12px;}.nav-ctas .btn-primary{display:none;}.nav-ctas .btn-ghost{font-size:12px;padding:7px 12px;}}
