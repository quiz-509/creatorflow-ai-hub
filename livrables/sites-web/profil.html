<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amélie Dubois — Architecte agents IA · CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root {
  --bg:#04040A;--bg-2:#07070F;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;
  --border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);
  --text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;
  --v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);
  --c:#06B6D4;--cs:#67E8F9;--green:#10B981;--amber:#F59E0B;
  --r:14px;--r-lg:20px;--r-xl:28px;
  --f:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid transparent;transition:all 300ms ease;}
.nav.stuck{background:rgba(4,4,10,0.88);backdrop-filter:blur(20px);border-color:var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;align-items:center;gap:4px;}
.nav-link{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);transition:all 180ms ease;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.nav-ctas{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset,0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:8px 16px;font-size:13px;}
.btn-lg{padding:14px 28px;font-size:15px;}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text-2);font-weight:500;transition:all 160ms var(--ease);}
.tag:hover{background:rgba(124,58,237,0.14);border-color:rgba(124,58,237,0.4);color:var(--vs);}
.tags{display:flex;gap:6px;flex-wrap:wrap;}

/* LAYOUT */
.profile-page{padding-top:88px;}
.profile-layout{display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start;padding:48px 0 100px;}

/* MAIN CONTENT */
.profile-hero{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px;margin-bottom:24px;position:relative;overflow:hidden;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--v),var(--c));}
.profile-top{display:flex;gap:28px;align-items:flex-start;margin-bottom:28px;}
.profile-avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid rgba(124,58,237,0.4);box-shadow:0 0 32px rgba(124,58,237,0.3);}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-info{flex:1;}
.cert-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cert-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);padding:3px 9px;border-radius:999px;}
.avail-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);}
.avail-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.profile-name{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
.profile-role{font-size:16px;color:var(--text-2);margin-bottom:14px;}
.profile-stats{display:flex;gap:24px;}
.pstat{text-align:center;}
.pstat-v{font-size:20px;font-weight:700;color:var(--text);}
.pstat-l{font-size:11px;color:var(--text-3);letter-spacing:0.06em;}
.stars-row{display:flex;align-items:center;gap:4px;color:var(--amber);font-size:14px;font-weight:600;margin-top:2px;}

.section-title{font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.profile-bio{font-size:15px;color:var(--text-2);line-height:1.75;margin-bottom:28px;}

/* PORTFOLIO */
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
.portfolio-card{background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:all 220ms var(--ease);}
.portfolio-card:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-2px);}
.portfolio-icon{width:38px;height:38px;border-radius:10px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.2);display:grid;place-items:center;color:var(--vs);margin-bottom:12px;}
.portfolio-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.portfolio-desc{font-size:12px;color:var(--text-3);line-height:1.5;}

/* REVIEWS */
.review-card{background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px;}
.review-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.reviewer{display:flex;align-items:center;gap:10px;}
.reviewer-avt{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.reviewer-avt img{width:100%;height:100%;object-fit:cover;}
.reviewer-name{font-size:13px;font-weight:600;}
.reviewer-co{font-size:11px;color:var(--text-3);}
.review-stars{display:flex;gap:2px;color:var(--amber);}
.review-text{font-size:13px;color:var(--text-2);line-height:1.65;}

/* SIDEBAR */
.profile-sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px;}
.sidebar-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;}
.sidebar-rate{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px;}
.sidebar-rate small{font-size:14px;font-weight:400;color:var(--text-3);}
.sidebar-label{font-size:12px;color:var(--text-3);margin-bottom:20px;}
.sidebar-btn{width:100%;justify-content:center;margin-bottom:10px;}
.sidebar-info{display:flex;flex-direction:column;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
.sinfo-row{display:flex;justify-content:space-between;font-size:13px;}
.sinfo-k{color:var(--text-3);}
.sinfo-v{color:var(--text);font-weight:500;}
.sidebar-share{display:flex;gap:8px;margin-top:16px;}
.share-btn{flex:1;justify-content:center;}

/* REVEAL */
@keyframes fade-up{from{opacity:0;transform:translateY(20px);filter:blur(3px);}to{opacity:1;transform:none;filter:blur(0);}}
.rv{opacity:0;animation:fade-up 600ms var(--ease) both;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}

.footer-mini{border-top:1px solid var(--border);padding:28px 0;display:flex;align-items:center;justify-content:space-between;}
.footer-mini a{font-size:13px;color:var(--text-3);transition:color 160ms;}
.footer-mini a:hover{color:var(--text);}
.footer-links{display:flex;gap:20px;}

@media(max-width:980px){.profile-layout{grid-template-columns:1fr;}.profile-sidebar{position:static;}.portfolio-grid{grid-template-columns:1fr 1fr;}.nav-links{display:none;}}
@media(max-width:640px){.wrap{padding:0 18px;}.profile-top{flex-direction:column;}.portfolio-grid{grid-template-columns:1fr;}.profile-stats{gap:14px;}}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = supabase;
const sb = createClient(
  'https://cjtglfutckaogsmwhfsv.supabase.co',
  'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei'
);

const Ic = {
  Check:(p)=><svg {...p} width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Star:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
  Arrow:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  Back:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>,
  Bot:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/><path d="M12 3v5M8 3h8"/></svg>,
  Rocket:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>,
  Layers:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
};

const PORTFOLIO = [
  {icon:'Bot', title:'Chatbot IA personnalisé', desc:'Assistant conversationnel basé sur GPT-4 pour automatiser le support client et réduire les tickets.'},
  {icon:'Rocket', title:'Automatisation de workflow', desc:'Pipeline no-code/low-code pour éliminer les tâches répétitives et gagner du temps chaque semaine.'},
  {icon:'Layers', title:'Intégration LLM sur mesure', desc:'Connexion d\'un modèle de langage à vos outils existants (CRM, Notion, Slack, Make...).'},
];

function Nav() {
  const [stuck, setStuck] = useState(false);
  useEffect(() => {
    const h = () => setStuck(window.scrollY > 10);
    window.addEventListener('scroll', h, { passive: true });
    return () => window.removeEventListener('scroll', h);
  }, []);
  return (
    <nav className={`nav ${stuck ? 'stuck' : ''}`}>
      <div className="wrap nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
        <div className="nav-links">
          <a href="experts.html" className="nav-link">Experts</a>
          <a href="brief.html" className="nav-link">Déposer un brief</a>
        </div>
        <div className="nav-ctas">
          <a href="connexion.html" className="btn btn-ghost btn-sm">Connexion</a>
          <a href="brief.html" className="btn btn-primary btn-sm">Je cherche un expert <Ic.Arrow/></a>
        </div>
      </div>
    </nav>
  );
}

function App() {
  const [expert, setExpert] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  useEffect(() => {
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const expertId = params.get('id');
      if (!expertId) { setLoading(false); return; }
      const { data: profile } = await sb.from('profiles').select('prenom, nom').eq('id', expertId).single();
      const { data: exp } = await sb.from('experts').select('*').eq('id', expertId).single();
      if (profile || exp) {
        const prenom = profile?.prenom || '';
        const nom = profile?.nom || '';
        setExpert({
          id: expertId,
          name: `${prenom} ${nom}`.trim() || '—',
          prenom,
          initials: ((prenom[0]||'?') + (nom[0]||'?')).toUpperCase(),
          specialite: exp?.specialite || '',
          bio: exp?.bio || '',
          tarif: exp?.tarif_heure || null,
          disponible: exp?.disponible ?? false,
          competences: exp?.competences || [],
          note: exp?.note || null,
          nb_avis: exp?.nb_avis || 0,
        });
        document.title = `${prenom} ${nom}`.trim() + ' — CreatorFlow Market';
      }
      setLoading(false);
    })();
  }, []);

  if (loading) return null;
  if (!expert) return (
    <React.Fragment>
      <Nav/>
      <div style={{paddingTop:120,textAlign:'center',color:'var(--text-3)',fontSize:15}}>Expert introuvable.</div>
    </React.Fragment>
  );

  return (
    <React.Fragment>
      <Nav/>
      <div className="profile-page">
        <div className="wrap">
          <a href="experts.html" className="btn btn-ghost btn-sm" style={{marginBottom:24,marginTop:8,display:'inline-flex'}}><Ic.Back/>Retour aux experts</a>
          <div className="profile-layout">
            <div>
              <div className="profile-hero rv" style={{animationDelay:'80ms'}}>
                <div className="profile-top">
                  <div className="profile-avatar" style={{background:'linear-gradient(135deg,#7C3AED,#06B6D4)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <span style={{fontSize:32,fontWeight:800,color:'#fff',userSelect:'none'}}>{expert.initials}</span>
                  </div>
                  <div className="profile-info">
                    <div className="cert-row">
                      {expert.disponible
                        ? <span className="avail-badge"><div className="avail-dot"/>Disponible</span>
                        : <span style={{fontSize:11,color:'var(--text-3)'}}>Non disponible actuellement</span>
                      }
                    </div>
                    <h1 className="profile-name">{expert.name}</h1>
                    <p className="profile-role">{expert.specialite ? `Expert ${expert.specialite}` : 'Expert IA'}</p>
                    <div className="profile-stats">
                      {expert.note && (
                        <div className="pstat">
                          <div className="pstat-v" style={{color:'var(--amber)'}}>{expert.note}</div>
                          <div className="stars-row">{[1,2,3,4,5].map(i=><Ic.Star key={i}/>)}</div>
                          <div className="pstat-l">{expert.nb_avis} avis</div>
                        </div>
                      )}
                      <div className="pstat"><div className="pstat-v">{expert.nb_avis}</div><div className="pstat-l">Missions</div></div>
                    </div>
                  </div>
                </div>
                {expert.competences.length > 0 && (
                  <div className="tags" style={{marginBottom:20}}>
                    {expert.competences.map(s=><span className="tag" key={s}>{s}</span>)}
                  </div>
                )}
                <div className="section-title">À propos</div>
                <p className="profile-bio">{expert.bio || 'Aucune présentation disponible.'}</p>
              </div>

              <div className="rv" style={{animationDelay:'180ms',background:'var(--surf)',border:'1px solid var(--border)',borderRadius:'var(--r-xl)',padding:32,marginBottom:24}}>
                <div className="section-title">Portfolio — Projets types</div>
                <div className="portfolio-grid">
                  {PORTFOLIO.map((p,i) => (
                    <div key={i} className="portfolio-card">
                      <div className="portfolio-icon">{Ic[p.icon] ? React.createElement(Ic[p.icon]) : null}</div>
                      <div className="portfolio-title">{p.title}</div>
                      <div className="portfolio-desc">{p.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="rv" style={{animationDelay:'260ms',background:'var(--surf)',border:'1px solid var(--border)',borderRadius:'var(--r-xl)',padding:32}}>
                <div className="section-title">Avis clients ({expert.nb_avis})</div>
                {expert.nb_avis === 0
                  ? <p style={{color:'var(--text-3)',fontSize:14}}>Aucun avis pour le moment.</p>
                  : <p style={{color:'var(--text-2)',fontSize:14}}>Note moyenne : {expert.note}/5 — {expert.nb_avis} avis vérifiés</p>
                }
              </div>
            </div>

            <div className="profile-sidebar">
              <div className="sidebar-card rv" style={{animationDelay:'120ms'}}>
                <div className="sidebar-rate">{expert.tarif ? `${expert.tarif}$` : 'Sur devis'}<small>/heure</small></div>
                <div className="sidebar-label">Tarif indicatif · Devis sur demande</div>
                <a href="brief.html" className="btn btn-primary btn-lg sidebar-btn">Contacter {expert.prenom || expert.name.split(' ')[0]} <Ic.Arrow/></a>
                <a href="brief.html" className="btn btn-ghost btn-sm sidebar-btn">Déposer un brief détaillé</a>
                <div className="sidebar-info">
                  <div className="sinfo-row">
                    <span className="sinfo-k">Disponibilité</span>
                    <span className="sinfo-v" style={{color: expert.disponible ? 'var(--green)' : 'var(--text-3)'}}>
                      {expert.disponible ? 'Cette semaine' : 'Non disponible'}
                    </span>
                  </div>
                  {expert.nb_avis > 0 && (
                    <div className="sinfo-row"><span className="sinfo-k">Missions</span><span className="sinfo-v">{expert.nb_avis} livrées</span></div>
                  )}
                  <div className="sinfo-row"><span className="sinfo-k">Réponse</span><span className="sinfo-v">Sous 24h</span></div>
                </div>
              </div>
              <div className="sidebar-card rv" style={{animationDelay:'200ms',fontSize:13,color:'var(--text-2)',lineHeight:1.6}}>
                <div style={{fontWeight:700,color:'var(--text)',marginBottom:8,fontSize:14}}>Certification CreatorFlow Market</div>
                Profil vérifié par notre équipe. Compétences testées, références contrôlées, entretien validé.
                <div style={{marginTop:12,padding:'10px 14px',background:'rgba(16,185,129,0.06)',border:'1px solid rgba(16,185,129,0.15)',borderRadius:10,color:'var(--green)',fontSize:12,fontWeight:600}}>
                  ✓ Certifié · Profil actif
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer><div className="wrap footer-mini">
        <span style={{fontSize:13,color:'var(--text-3)'}}>© 2026 CreatorFlow Market</span>
        <div className="footer-links"><a href="index.html">Accueil</a><a href="experts.html">Experts</a><a href="brief.html">Brief</a></div>
      </div></footer>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
