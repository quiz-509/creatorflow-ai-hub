/* ─── TOKENS ─────────────────────────────────────────────────────── */
:root {
  --bg:        #04040A;
  --bg-2:      #07070F;
  --surf:      #0C0C18;
  --surf-2:    #101020;
  --surf-3:    #14142A;
  --glass:     rgba(12,12,24,0.72);
  --border:    rgba(255,255,255,0.08);
  --border-2:  rgba(255,255,255,0.13);
  --border-3:  rgba(255,255,255,0.22);
  --text:      #F4F4FF;
  --text-2:    #A0A0C2;
  --text-3:    #55557A;
  --v:         #7C3AED;
  --v2:        #6D28D9;
  --v3:        #5B21B6;
  --vs:        #A78BFA;
  --vg:        rgba(124,58,237,0.35);
  --c:         #06B6D4;
  --cs:        #67E8F9;
  --cg:        rgba(6,182,212,0.25);
  --green:     #10B981;
  --amber:     #F59E0B;

  --r-xs: 6px; --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 28px; --r-2xl: 40px;
  --f: 'Inter', system-ui, sans-serif;
  --f-display: 'Plus Jakarta Sans', system-ui, sans-serif;
  --ease: cubic-bezier(0.16,1,0.3,1);
  --ease-in: cubic-bezier(0.4,0,1,1);
  --ease-out: cubic-bezier(0,0,0.2,1);
  .hero-inner { grid-template-columns:1fr; gap:40px; padding:0 0 60px; }
  .hero-right { order:-1; }
  .hero-sub { max-width:100%; }
  .hero-trust { grid-template-columns:repeat(2,1fr); }
  .hero-stats-row { grid-template-columns:repeat(2,1fr); }
  .hero-stat+.hero-stat::before { display:none; }
  .hero-stat { border-top:1px solid var(--border); }
  .hero-stat:first-child,.hero-stat:nth-child(2) { border-top:none; }
  .hero-vid-card { display:none; }
  .hero-video { aspect-ratio:16/9; }
}

/* ─── RESET ──────────────────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; font-size:16px; }
body {
  font-family:var(--f);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  line-height:1.6;
  background-image:
    radial-gradient(ellipse 1000px 600px at 70% -5%, rgba(124,58,237,0.15) 0%, transparent 70%),
    radial-gradient(ellipse 700px 500px at -5% 15%, rgba(6,182,212,0.08) 0%, transparent 60%);
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
img,svg { display:block; max-width:100%; }

/* ─── LAYOUT ─────────────────────────────────────────────────────── */
.wrap { width:100%; max-width:1200px; margin:0 auto; padding:0 28px; }
section { position:relative; }
.pad { padding:120px 0; }
.pad-sm { padding:80px 0; }

/* ─── TYPOGRAPHY ─────────────────────────────────────────────────── */
h1,h2 { font-family:var(--f-display); font-weight:800; letter-spacing:-0.035em; text-wrap:balance; line-height:1.10; }
h3,h4,h5 { font-family:var(--f); font-weight:700; letter-spacing:-0.025em; text-wrap:balance; line-height:1.20; }
.eyebrow {
  display:inline-flex; align-items:center; gap:8px;
  font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--vs);
}
.eyebrow::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c); animation:eyebrow-glow 2.4s ease-in-out infinite; }

/* ─── BUTTONS ────────────────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 22px; border-radius:999px; font-size:14px; font-weight:600;
  transition:all 220ms var(--ease); white-space:nowrap; position:relative; overflow:hidden;
}
.btn::after {
  content:''; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.12) 50%, transparent 60%);
  transform:translateX(-100%); transition:transform 500ms var(--ease);
}
.btn:hover::after { transform:translateX(100%); }
.btn-primary {
  background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));
  color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset, 0 6px 20px -6px var(--vg), 0 0 40px -12px var(--vg);
}
.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset, 0 12px 32px -6px rgba(124,58,237,0.7), 0 0 60px -12px var(--vg);
}
.btn-ghost {
  background:rgba(255,255,255,0.04); border:1px solid var(--border-2);
  color:var(--text-2);
  backdrop-filter:blur(8px);
}
.btn-ghost:hover { background:rgba(255,255,255,0.08); border-color:var(--border-3); color:var(--text); }
.btn-outline { border:1px solid var(--border-2); color:var(--text-2); }
.btn-outline:hover { border-color:var(--border-3); color:var(--text); background:rgba(255,255,255,0.04); }
.btn-lg { padding:16px 30px; font-size:15px; }
.btn .ico { transition:transform 220ms var(--ease); }
.btn:hover .ico { transform:translateX(3px); }

/* ─── NAV ────────────────────────────────────────────────────────── */
.nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  transition:background 300ms ease, border-color 300ms ease, backdrop-filter 300ms ease;
  border-bottom:1px solid transparent;
}
.nav.stuck {
  background:var(--glass); backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-bottom-color:var(--border);
}
.nav-inner { display:flex; align-items:center; height:66px; gap:36px; }
.brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:700; letter-spacing:-0.025em; flex-shrink:0; }
.brand-logo { width:32px; height:32px; background-size:contain; background-repeat:no-repeat; background-position:center; mix-blend-mode:screen; filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6)); }
.brand span em { font-style:normal; color:var(--vs); }

.nav-menu { display:flex; align-items:center; gap:4px; flex:1; }
.nav-item { position:relative; }
.nav-link {
  display:flex; align-items:center; gap:5px;
  padding:8px 12px; border-radius:var(--r-sm); font-size:14px; font-weight:500; color:var(--text-2);
  transition:all 180ms ease; cursor:pointer; background:none; border:none; font-family:inherit;
}
.nav-link:hover, .nav-link.open { color:var(--text); background:rgba(255,255,255,0.05); }
.nav-link .chevron { transition:transform 220ms var(--ease); }
.nav-link.open .chevron { transform:rotate(180deg); }

/* Mega-menu */
.mega {
  position:absolute; top:calc(100% + 12px); left:50%; transform:translateX(-50%);
  width:580px; background:var(--surf); border:1px solid var(--border-2); border-radius:var(--r-lg);
  box-shadow:0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
  padding:8px; display:grid; grid-template-columns:1fr 1fr 1fr;
  gap:0;
  opacity:0; pointer-events:none; transform:translateX(-50%) translateY(-8px);
  transition:opacity 220ms var(--ease), transform 220ms var(--ease);
  backdrop-filter:blur(20px);
}
.mega.open { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
.mega-col { padding:16px; }
.mega-col + .mega-col { border-left:1px solid var(--border); }
.mega-col-title { font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:10px; }
.mega-item {
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-sm);
  font-size:13px; color:var(--text-2); transition:all 160ms ease; cursor:pointer; text-decoration:none;
}
.mega-item:hover { background:rgba(124,58,237,0.10); color:var(--text); }
.mega-item-icon { width:28px; height:28px; border-radius:7px; background:rgba(255,255,255,0.04); border:1px solid var(--border); display:grid; place-items:center; flex-shrink:0; color:var(--vs); }
.mega-item-text { font-size:13px; font-weight:500; }
.mega-item-sub { font-size:11px; color:var(--text-3); }
.mega-featured { background:linear-gradient(135deg,rgba(124,58,237,0.10),rgba(6,182,212,0.06)); border:1px solid rgba(124,58,237,0.2); border-radius:var(--r); padding:16px; }
.mega-featured-badge { font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--vs); background:rgba(124,58,237,0.15); padding:3px 8px; border-radius:999px; display:inline-block; margin-bottom:10px; }
.mega-featured-title { font-size:14px; font-weight:700; margin-bottom:6px; }
.mega-featured-text { font-size:12px; color:var(--text-2); line-height:1.5; margin-bottom:12px; }
.mega-featured-link { font-size:12px; font-weight:600; color:var(--vs); display:flex; align-items:center; gap:4px; }

.nav-actions { display:flex; align-items:center; gap:10px; margin-left:auto; }
.mobile-toggle { display:none; width:38px; height:38px; border-radius:var(--r-sm); border:1px solid var(--border-2); background:rgba(255,255,255,0.04); align-items:center; justify-content:center; }

/* ─── HERO V2 ───────────────────────────────────────────────────── */
.hero { padding:150px 0 0; min-height:680px; position:relative; overflow:hidden; }

/* Full-bleed background video zone */
.hero-bg {
  position:absolute; inset:0; z-index:0;
  background:linear-gradient(145deg,#070710 0%,#0A0820 40%,#0C0C1E 70%,#06060E 100%);
}
.hero-bg-grid {
  position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.022) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 80% at 70% 40%,black,transparent);
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 70% 40%,black,transparent);
}
.hero-bg-orb { position:absolute; border-radius:50%; filter:blur(120px); pointer-events:none; }
.hero-bg-orb.a { width:600px; height:600px; background:var(--v); top:-200px; right:5%; opacity:0.30; animation:drift-a 20s ease-in-out infinite; }
.hero-bg-orb.b { width:440px; height:440px; background:var(--c); bottom:-80px; right:30%; opacity:0.16; animation:drift-b 25s ease-in-out infinite; }
@keyframes drift-a { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-50px,40px) scale(1.07);} }
@keyframes drift-b { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(60px,-35px) scale(1.1);} }

/* Left-to-right gradient so text stays readable */
.hero-bg-fade { position:absolute; inset:0; z-index:1; background:linear-gradient(90deg, var(--bg) 0%, var(--bg) 28%, rgba(4,4,10,0.82) 48%, rgba(4,4,10,0.38) 68%, rgba(4,4,10,0.10) 100%); }

/* Play button centered on right side */
.hero-play { position:absolute; top:50%; right:26%; transform:translate(50%,-50%); width:80px; height:80px; border-radius:50%; background:rgba(255,255,255,0.10); border:1.5px solid rgba(255,255,255,0.28); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); display:grid; place-items:center; cursor:pointer; transition:all 280ms var(--ease); z-index:10; box-shadow:0 0 60px -10px rgba(124,58,237,0.5); }
.hero-play:hover { background:rgba(255,255,255,0.20); transform:translate(50%,-50%) scale(1.1); box-shadow:0 0 80px -8px rgba(124,58,237,0.7); }
.hero-play-label { position:absolute; top:calc(50% + 52px); right:26%; transform:translateX(50%); font-size:12px; font-weight:600; color:rgba(255,255,255,0.45); white-space:nowrap; letter-spacing:0.06em; z-index:10; }

/* Floating cards */
.hero-vid-card { position:absolute; z-index:10; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); background:rgba(10,10,26,0.92); border:1px solid var(--border-2); border-radius:14px; padding:12px 14px; box-shadow:0 16px 40px rgba(0,0,0,0.6); min-width:190px; }
.hero-vid-card.c1 { top:22%; right:8%; animation:float 5s ease-in-out infinite; }
.hero-vid-card.c2 { bottom:22%; right:4%; animation:float 5s ease-in-out 1.8s infinite; }
.hvc-label { font-size:9px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:7px; }
.hvc-row { display:flex; align-items:flex-start; gap:8px; }
.hvc-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); animation:pulse-green 1.6s ease-in-out infinite; flex-shrink:0; margin-top:3px; }
.hvc-text { font-size:13px; font-weight:700; }
.hvc-sub { font-size:11px; color:var(--text-2); margin-top:2px; }
.hvc-bar { height:3px; border-radius:999px; background:var(--surf-3); margin-top:10px; overflow:hidden; }
.hvc-bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--v),var(--c)); width:72%; }

/* Text overlaid on hero */
.hero-content {
  position:relative; z-index:5; max-width:580px; padding-bottom:80px;
}
.hero-pill {
  display:inline-flex; align-items:center; gap:8px; padding:5px 14px 5px 5px;
  border-radius:999px; border:1px solid var(--border-2); background:rgba(255,255,255,0.04);
  font-size:12px; color:var(--text-2); margin-bottom:28px; backdrop-filter:blur(8px);
}
.hero-pill-tag { padding:3px 9px; border-radius:999px; background:linear-gradient(135deg,var(--v),var(--v2)); color:#fff; font-size:10px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
h1.hero-title { font-family:var(--f-display); font-size:clamp(48px,5.8vw,80px); font-weight:800; letter-spacing:-0.045em; margin-bottom:22px; line-height:1.05; }
.hero-title .grad {
  background:linear-gradient(135deg,#C084FC,#7C3AED,#06B6D4,#A78BFA,#C084FC);
  background-size:300% 300%;
  -webkit-background-clip:text; background-clip:text; color:transparent; font-style:italic; font-weight:700;
  animation:grad-shift 5s ease-in-out infinite;
}
.hero-sub { font-size:clamp(15px,1.3vw,18px); color:var(--text-2); margin-bottom:38px; line-height:1.65; font-weight:400; max-width:480px; }
.hero-ctas { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:44px; }
.hero-trust { display:flex; gap:20px; flex-wrap:wrap; }
.hero-trust-item { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-2); font-weight:500; }
.hero-trust-item svg { color:var(--green); flex-shrink:0; }
.hero-trust-item strong { color:var(--text); }

/* Stats row below hero */
.hero-stats-row { display:grid; grid-template-columns:repeat(4,1fr); position:relative; z-index:5; border:1px solid var(--border-2); border-radius:var(--r-xl); background:rgba(12,12,24,0.6); backdrop-filter:blur(16px); overflow:hidden; }
.hero-stat { padding:28px 20px; text-align:center; position:relative; }
.hero-stat+.hero-stat::before { content:''; position:absolute; left:0; top:18%; bottom:18%; width:1px; background:var(--border); }
.hero-stat-n { font-size:36px; font-weight:800; letter-spacing:-0.04em; background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,0.6) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero-stat-l { font-size:12px; color:var(--text-2); font-weight:500; margin-top:4px; }
/* Legacy stat classes */
.stat { padding:28px 20px; text-align:center; position:relative; }
.stat+.stat::before { content:''; position:absolute; left:0; top:18%; bottom:18%; width:1px; background:var(--border); }
.stat-n { font-size:40px; font-weight:800; letter-spacing:-0.04em; background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,0.6) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.stat-l { font-size:12px; color:var(--text-2); font-weight:500; margin-top:4px; }

/* Marquee */
.marquee { margin-top:72px; padding:20px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); overflow:hidden; background:rgba(4,4,10,0.5); }
.marquee-track { display:flex; gap:44px; animation:marquee 36s linear infinite; width:max-content; }
.marquee-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-3); white-space:nowrap; font-weight:500; letter-spacing:0.02em; }
.marquee-item .dot { width:3px; height:3px; border-radius:50%; background:var(--v); box-shadow:0 0 6px var(--v); }
@keyframes marquee { from{transform:translateX(0);} to{transform:translateX(-50%);} }

/* ─── SECTION HEADERS ────────────────────────────────────────────── */
.sh { margin-bottom:60px; }
.sh.c { text-align:center; max-width:680px; margin-left:auto; margin-right:auto; }
.sh-title { font-family:var(--f-display); font-size:clamp(32px,3.8vw,52px); font-weight:800; letter-spacing:-0.035em; line-height:1.10; margin:14px 0 18px; }
.sh-title em { font-style:italic; font-weight:500; color:var(--text-2); }
.sh-sub { font-size:17px; color:var(--text-2); line-height:1.65; }

/* ─── PLATFORM PREVIEW ───────────────────────────────────────────── */
.preview { padding:40px 0 100px; }
.preview-shell {
  position:relative; max-width:1060px; margin:0 auto; padding:0 28px;
}
.preview-frame {
  border:1px solid var(--border-2); border-radius:20px; overflow:hidden;
  background:linear-gradient(180deg,var(--surf) 0%,var(--bg-2) 100%);
  box-shadow:0 40px 120px -30px rgba(0,0,0,0.8), 0 0 80px -20px var(--vg);
}
.preview-bar { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); background:rgba(12,12,24,0.5); }
.pbar-dots { display:flex; gap:6px; }
.pbar-dots span { width:11px; height:11px; border-radius:50%; background:var(--surf-3); }
.pbar-url { flex:1; text-align:center; font-size:12px; color:var(--text-3); padding:5px 14px; background:var(--surf-2); border:1px solid var(--border); border-radius:8px; max-width:340px; margin:0 auto; font-weight:500; }
.preview-body { display:grid; grid-template-columns:220px 1fr; min-height:460px; }
.preview-side { border-right:1px solid var(--border); padding:18px 14px; }
.side-section { font-size:9px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-3); margin:18px 10px 8px; }
.side-item { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; font-size:12px; color:var(--text-2); margin-bottom:2px; transition:all 180ms ease; }
.side-item .d { width:5px; height:5px; border-radius:50%; background:var(--text-3); }
.side-item.on { background:rgba(124,58,237,0.12); color:var(--text); border:1px solid rgba(124,58,237,0.22); }
.side-item.on .d { background:var(--v); box-shadow:0 0 8px var(--v); }
.preview-main { padding:26px 30px; position:relative; }
.preview-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
.preview-title { font-size:17px; font-weight:700; letter-spacing:-0.02em; display:flex; align-items:center; gap:10px; }
.live-badge { font-size:10px; font-weight:600; padding:3px 8px; border-radius:999px; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.28); color:var(--green); display:flex; align-items:center; gap:5px; }
.live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse-green 1.6s ease-in-out infinite; }
@keyframes pulse-green { 0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.5);} 50%{box-shadow:0 0 0 7px rgba(16,185,129,0);} }
.preview-search { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surf-2); border:1px solid var(--border-2); border-radius:10px; font-size:13px; color:var(--text-2); margin-bottom:18px; }
.caret { display:inline-block; width:1px; height:13px; background:var(--vs); animation:blink 1s steps(2) infinite; margin-left:1px; vertical-align:middle; }
@keyframes blink { 50%{opacity:0;} }
.p-results { display:flex; flex-direction:column; gap:8px; }
.p-result { display:grid; grid-template-columns:38px 1fr auto auto; align-items:center; gap:12px; padding:11px 12px; background:var(--surf-2); border:1px solid var(--border); border-radius:10px; opacity:0; transform:translateY(6px); animation:slide-in 600ms var(--ease) forwards; }
.p-result:nth-child(1){animation-delay:.3s;}
.p-result:nth-child(2){animation-delay:.55s;}
.p-result:nth-child(3){animation-delay:.8s;}
@keyframes slide-in { to{opacity:1;transform:translateY(0);} }
.p-avt { width:36px; height:36px; border-radius:50%; overflow:hidden; background:var(--surf-3); }
.p-avt img { width:100%; height:100%; object-fit:cover; }
.p-name { font-size:13px; font-weight:600; }
.p-role { font-size:11px; color:var(--text-2); }
.p-match { font-size:11px; padding:3px 8px; border-radius:999px; background:rgba(124,58,237,0.12); border:1px solid rgba(124,58,237,0.28); color:var(--vs); font-weight:600; }
.p-rate { font-size:14px; font-weight:700; }
.p-rate small { font-size:10px; color:var(--text-2); font-weight:400; }

.preview-notif {
  position:absolute; top:70px; right:-36px; width:250px;
  background:rgba(12,12,24,0.95); backdrop-filter:blur(16px);
  border:1px solid var(--border-2); border-radius:14px; padding:13px;
  box-shadow:0 24px 60px rgba(0,0,0,0.7); display:flex; gap:10px;
  animation:notif-in 700ms var(--ease) 1.4s both, float 4s ease-in-out 2.2s infinite;
}
@keyframes notif-in { from{opacity:0;transform:translateX(36px);} to{opacity:1;transform:translateX(0);} }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
.notif-icon { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--v),var(--v2)); display:grid; place-items:center; flex-shrink:0; box-shadow:0 0 18px var(--vg); }
.notif-title { font-size:12px; font-weight:700; margin-bottom:2px; }
.notif-text { font-size:11px; color:var(--text-2); line-height:1.4; }

.preview-orbits { position:absolute; inset:-40px; pointer-events:none; }
.o-avatar { position:absolute; width:48px; height:48px; border-radius:50%; overflow:hidden; border:2px solid var(--bg); box-shadow:0 8px 20px rgba(0,0,0,0.6); animation:float 5s ease-in-out infinite; }
.o-avatar img { width:100%; height:100%; object-fit:cover; }
.o-avatar.o1 { top:-8px; left:-10px; animation-delay:0s; }
.o-avatar.o2 { bottom:60px; left:-24px; width:40px; height:40px; animation-delay:1.4s; }
.o-avatar.o3 { top:180px; right:-12px; animation-delay:2.8s; }

/* ─── HOW IT WORKS ───────────────────────────────────────────────── */
.toggle-wrap { display:flex; justify-content:center; margin-bottom:52px; }
.toggle { display:inline-flex; background:var(--surf); border:1px solid var(--border); border-radius:999px; padding:4px; }
.toggle button { padding:9px 22px; border-radius:999px; font-size:14px; font-weight:500; color:var(--text-2); transition:all 200ms ease; }
.toggle button.on { background:linear-gradient(135deg,var(--v),var(--v2)); color:#fff; box-shadow:0 4px 20px -4px var(--vg); }
.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.step {
  padding:30px; background:var(--surf); border:1px solid var(--border); border-radius:var(--r-lg);
  transition:all 260ms var(--ease); position:relative; overflow:hidden;
}
.step::before { content:''; position:absolute; inset:0; background:radial-gradient(400px at var(--mx,50%) var(--my,50%),rgba(124,58,237,0.08),transparent 60%); opacity:0; transition:opacity 260ms ease; pointer-events:none; }
.step:hover::before { opacity:1; }
.step:hover { border-color:rgba(124,58,237,0.3); transform:translateY(-4px); }
.step-num { font-size:10px; font-weight:700; letter-spacing:0.18em; color:var(--text-3); margin-bottom:22px; }
.step-icon { width:48px; height:48px; border-radius:13px; display:grid; place-items:center; margin-bottom:22px; background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08)); border:1px solid rgba(124,58,237,0.28); color:var(--vs); }
.step h3 { font-size:20px; margin-bottom:10px; }
.step p { font-size:14px; color:var(--text-2); line-height:1.65; }

/* ─── EXPERTISE ──────────────────────────────────────────────────── */
.exp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.exp-card {
  padding:26px; background:var(--surf); border:1px solid var(--border); border-radius:var(--r);
  transition:all 260ms var(--ease); cursor:pointer; min-height:210px;
  display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;
}
.exp-card::before { content:''; position:absolute; inset:0; background:radial-gradient(350px at var(--mx,50%) var(--my,50%),rgba(124,58,237,0.10),transparent 55%); opacity:0; transition:opacity 260ms; pointer-events:none; }
.exp-card:hover::before { opacity:1; }
.exp-card:hover { border-color:rgba(124,58,237,0.32); transform:translateY(-3px); box-shadow:0 20px 60px -20px rgba(0,0,0,0.5); }
.exp-card.feat { grid-column:span 2; background:linear-gradient(135deg,rgba(124,58,237,0.10),rgba(6,182,212,0.05)); border-color:rgba(124,58,237,0.25); }
.exp-icon { width:42px; height:42px; border-radius:11px; display:grid; place-items:center; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--cs); margin-bottom:22px; }
.exp-card h3 { font-size:18px; margin-bottom:8px; }
.exp-card p { font-size:13px; color:var(--text-2); line-height:1.6; }
.tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
.tag { font-size:11px; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-2); font-weight:500; cursor:pointer; transition:all 160ms var(--ease); }
.tag:hover { background:rgba(124,58,237,0.14); border-color:rgba(124,58,237,0.4); color:var(--vs); transform:scale(1.07) translateY(-1px); }

/* ─── EXPERTS ────────────────────────────────────────────────────── */
.experts-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.expert-card {
  background:var(--surf); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:26px; transition:all 260ms var(--ease); position:relative; overflow:hidden;
}
.expert-card::after { content:''; position:absolute; inset:-1px; border-radius:inherit; background:linear-gradient(135deg,rgba(124,58,237,0.4),rgba(6,182,212,0.2)); opacity:0; transition:opacity 260ms; pointer-events:none; z-index:0; }
.expert-card > * { position:relative; z-index:1; }
.expert-card:hover { transform:translateY(-4px); box-shadow:0 28px 70px -20px rgba(0,0,0,0.6); }
.expert-card:hover::after { opacity:1; }
.expert-card:hover { background:var(--surf-2); border-color:rgba(124,58,237,0.3); }
.cert-badge { position:absolute; top:14px; right:14px; display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:999px; background:rgba(124,58,237,0.12); border:1px solid rgba(124,58,237,0.28); color:var(--vs); font-size:10px; font-weight:600; letter-spacing:0.06em; z-index:2; }
.exp-head { display:flex; align-items:center; gap:13px; margin-bottom:18px; }
.exp-avt { width:52px; height:52px; border-radius:50%; overflow:hidden; background:var(--surf-3); flex-shrink:0; border:2px solid var(--border-2); }
.exp-avt img { width:100%; height:100%; object-fit:cover; }
.exp-name { font-size:15px; font-weight:700; letter-spacing:-0.01em; margin-bottom:2px; }
.exp-role { font-size:12px; color:var(--text-2); font-weight:500; }
.exp-bio { font-size:13px; color:var(--text-2); line-height:1.6; margin-bottom:16px; }
.exp-foot { display:flex; align-items:center; justify-content:space-between; padding-top:16px; border-top:1px solid var(--border); }
.exp-rate { font-size:17px; font-weight:800; letter-spacing:-0.02em; }
.exp-rate small { font-size:11px; color:var(--text-2); font-weight:400; }
.exp-stars { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--text-2); }
.exp-stars .s { color:#FBBF24; }
.exp-stars .cnt { font-size:11px; color:var(--text-3); }
.experts-cta { display:flex; justify-content:center; margin-top:40px; }

/* ─── TESTIMONIALS ───────────────────────────────────────────────── */
/* Old testi classes kept for backward compat */
.testi-grid { display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:18px; }
.testi { padding:30px; background:var(--surf); border:1px solid var(--border); border-radius:var(--r-lg); display:flex; flex-direction:column; transition:all 240ms var(--ease); }
.testi:hover { border-color:var(--border-2); transform:translateY(-3px); }
.testi.feat { background:linear-gradient(150deg,rgba(124,58,237,0.12),rgba(6,182,212,0.04) 60%,transparent); border-color:rgba(124,58,237,0.25); }
.testi-quote { font-size:18px; line-height:1.5; font-weight:400; letter-spacing:-0.01em; margin-bottom:26px; flex:1; }
.testi.feat .testi-quote { font-size:22px; }
.testi-quote::before { content:'\201C'; font-size:72px; line-height:0.75; color:var(--v); display:block; margin-bottom:8px; opacity:0.5; font-weight:800; }
.testi-by { display:flex; align-items:center; gap:11px; }
.testi-avt { width:40px; height:40px; border-radius:50%; overflow:hidden; background:var(--surf-3); flex-shrink:0; }
.testi-avt img { width:100%; height:100%; object-fit:cover; }
.testi-name { font-size:14px; font-weight:700; }
.testi-role { font-size:12px; color:var(--text-2); }

/* Results section */
.results-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.result-card { padding:36px 32px; background:var(--surf); border:1px solid var(--border); border-radius:var(--r-lg); transition:all 260ms var(--ease); position:relative; overflow:hidden; }
.result-card::before { content:''; position:absolute; inset:0; background:radial-gradient(350px at var(--mx,50%) var(--my,50%),rgba(124,58,237,0.08),transparent 55%); opacity:0; transition:opacity 260ms; pointer-events:none; }
.result-card:hover::before { opacity:1; }
.result-card:hover { border-color:rgba(124,58,237,0.28); transform:translateY(-3px); box-shadow:0 24px 60px -20px rgba(0,0,0,0.5); }
.result-card.feat { background:linear-gradient(145deg,rgba(124,58,237,0.10),rgba(6,182,212,0.05)); border-color:rgba(124,58,237,0.22); }
.result-metric { font-family:var(--f-display); font-size:64px; font-weight:800; letter-spacing:-0.05em; line-height:1; margin-bottom:12px; background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.7) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.result-metric.accent { background:linear-gradient(135deg,#C084FC,#7C3AED,#06B6D4); -webkit-background-clip:text; background-clip:text; }
.result-title { font-size:16px; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px; }
.result-desc { font-size:14px; color:var(--text-2); line-height:1.65; margin-bottom:22px; }
.result-tag { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px; background:rgba(124,58,237,0.10); border:1px solid rgba(124,58,237,0.22); color:var(--vs); letter-spacing:0.04em; }
.result-quote { font-size:14px; color:var(--text-2); line-height:1.6; font-style:italic; border-left:2px solid rgba(124,58,237,0.4); padding-left:14px; margin-top:18px; }


/* ─── ACADEMY ────────────────────────────────────────────────────── */
.academy-wrap {
  position:relative; border:1px solid var(--border-2); border-radius:var(--r-2xl);
  padding:80px 56px; overflow:hidden; background:linear-gradient(135deg,var(--surf) 0%,var(--bg-2) 100%);
}
.academy-wrap::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:var(--v); filter:blur(150px); opacity:0.25; top:-200px; left:-80px; pointer-events:none; }
.academy-wrap::after { content:''; position:absolute; width:400px; height:400px; border-radius:50%; background:var(--c); filter:blur(150px); opacity:0.14; bottom:-200px; right:-80px; pointer-events:none; }
.academy-grid-bg { position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(ellipse at 30% 50%,black,transparent 70%); pointer-events:none; }
.academy-inner { position:relative; display:grid; grid-template-columns:1.3fr 1fr; gap:60px; align-items:center; }
.academy-inner h2 { font-size:clamp(30px,3.5vw,44px); margin:14px 0 16px; }
.academy-inner p { font-size:16px; color:var(--text-2); line-height:1.65; margin-bottom:30px; max-width:460px; }
.academy-btns { display:flex; gap:12px; flex-wrap:wrap; }
.academy-vis { position:relative; height:270px; display:grid; place-items:center; }
.cert-card {
  position:relative; width:230px; padding:20px; background:rgba(12,12,24,0.9);
  backdrop-filter:blur(20px); border:1px solid var(--border-2); border-radius:var(--r);
  transform:rotate(-5deg); box-shadow:0 24px 70px -20px rgba(0,0,0,0.8);
  animation:float 5s ease-in-out infinite;
}
.cert-seal { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--v),var(--c)); display:grid; place-items:center; margin-bottom:14px; box-shadow:0 0 22px var(--vg); }
.cert-seal-inner { width:30px; height:30px; border-radius:50%; background:var(--bg); display:grid; place-items:center; color:var(--vs); }
.cert-lbl { font-size:9px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-3); margin-bottom:3px; }
.cert-name { font-size:16px; font-weight:800; letter-spacing:-0.02em; margin-bottom:11px; }
.cert-meta { display:flex; justify-content:space-between; padding-top:11px; border-top:1px solid var(--border); font-size:9px; color:var(--text-2); font-weight:600; letter-spacing:0.04em; }
.cert-stamp { position:absolute; top:-16px; right:-18px; width:76px; height:76px; border-radius:50%; background:rgba(12,12,24,0.95); border:1px solid var(--border-2); display:grid; place-items:center; font-size:9px; text-align:center; color:var(--cs); letter-spacing:0.08em; text-transform:uppercase; padding:10px; line-height:1.3; animation:spin 22s linear infinite; box-shadow:0 8px 22px rgba(0,0,0,0.6); font-weight:600; }
@keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

/* ─── FOOTER ─────────────────────────────────────────────────────── */
.footer { border-top:1px solid var(--border); padding:72px 0 36px; margin-top:80px; }
.footer-grid { display:grid; grid-template-columns:1.5fr repeat(3,1fr); gap:44px; margin-bottom:56px; }
.footer-brand p { font-size:13px; color:var(--text-2); margin:16px 0 22px; max-width:300px; line-height:1.65; }
.socials { display:flex; gap:9px; }
.social-btn { width:36px; height:36px; border-radius:50%; background:var(--surf); border:1px solid var(--border); display:grid; place-items:center; color:var(--text-2); transition:all 180ms ease; }
.social-btn:hover { color:var(--text); border-color:var(--border-2); transform:translateY(-2px); }
.footer-col h4 { font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-3); margin-bottom:16px; }
.footer-col ul { list-style:none; display:flex; flex-direction:column; gap:10px; }
.footer-col a { font-size:13px; color:var(--text-2); transition:color 160ms ease; }
.footer-col a:hover { color:var(--text); }
.footer-bottom { display:flex; justify-content:space-between; align-items:center; padding-top:24px; border-top:1px solid var(--border); font-size:12px; color:var(--text-3); }
.footer-powered { display:flex; align-items:center; gap:7px; }

/* ─── REVEAL ─────────────────────────────────────────────────────── */
.rv { opacity:0; transform:translateY(28px) scale(0.97); filter:blur(4px); transition:opacity 750ms var(--ease), transform 800ms var(--ease), filter 700ms var(--ease); }
.rv.in { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }

/* ─── CATEGORIES ─────────────────────────────────────────────────── */
.cat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.cat-card {
  position:relative; padding:28px 24px 22px;
  background:var(--surf); border:1px solid var(--border); border-radius:var(--r-lg);
  cursor:pointer; overflow:hidden;
  transition:transform 260ms var(--ease), border-color 260ms var(--ease), box-shadow 260ms var(--ease);
}
.cat-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--cat-a,var(--v)), var(--cat-b,var(--c)));
}
.cat-card::after {
  content:''; position:absolute; inset:0;
  background:radial-gradient(360px at var(--mx,50%) var(--my,50%), rgba(124,58,237,0.08), transparent 60%);
  opacity:0; transition:opacity 280ms; pointer-events:none;
}
.cat-card:hover { border-color:var(--cat-a,var(--v)); transform:translateY(-4px); box-shadow:0 24px 64px -18px rgba(0,0,0,0.55); }
.cat-card:hover::after { opacity:1; }
.cat-ico {
  width:46px; height:46px; border-radius:12px; display:grid; place-items:center;
  background:rgba(255,255,255,0.04); border:1px solid var(--border);
  color:var(--cat-a,var(--vs)); margin-bottom:18px; position:relative; z-index:1;
  transition:background 260ms, border-color 260ms;
}
.cat-card:hover .cat-ico { background:rgba(255,255,255,0.07); border-color:var(--cat-a,var(--v)); }
.cat-name { font-size:15px; font-weight:700; margin-bottom:5px; color:var(--text); position:relative; z-index:1; }
.cat-count { font-size:12px; color:var(--text-3); font-weight:500; position:relative; z-index:1; }
.cat-arr {
  position:absolute; bottom:20px; right:20px; color:var(--cat-a,var(--vs));
  opacity:0; transform:translateX(-6px) translateY(6px);
  transition:all 240ms var(--ease); z-index:1;
}
.cat-card:hover .cat-arr { opacity:1; transform:none; }

/* ─── ENHANCED ANIMATIONS ────────────────────────────────────────── */
@keyframes hero-fade-up { from{opacity:0;transform:translateY(32px);filter:blur(6px);} to{opacity:1;transform:none;filter:blur(0);} }
@keyframes grad-shift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
@keyframes eyebrow-glow { 0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,0.7);} 60%{box-shadow:0 0 0 7px rgba(6,182,212,0);} }
@keyframes btn-ripple { to{transform:scale(4);opacity:0;} }
@keyframes subtle-breathe { 0%,100%{opacity:0.34;} 50%{opacity:0.48;} }

.hero-pill  { animation:hero-fade-up 700ms var(--ease)  80ms both; }
.hero-title { animation:hero-fade-up 900ms var(--ease) 230ms both; }
.hero-sub   { animation:hero-fade-up 700ms var(--ease) 420ms both; }
.hero-ctas  { animation:hero-fade-up 700ms var(--ease) 580ms both; }
.hero-stats { animation:hero-fade-up 700ms var(--ease) 740ms both; }

.hero-orb.a { animation:drift-a 20s ease-in-out infinite, subtle-breathe 8s ease-in-out infinite; }
.hero-orb.b { animation:drift-b 25s ease-in-out infinite, subtle-breathe 10s ease-in-out 2s infinite; }

#cursor-glow {
  position:fixed; pointer-events:none; z-index:9998;
  width:600px; height:600px; border-radius:50%;
  background:radial-gradient(circle, rgba(124,58,237,0.055) 0%, rgba(6,182,212,0.018) 45%, transparent 70%);
  transform:translate(-50%,-50%); left:-999px; top:-999px; will-change:left,top;
  transition:left 90ms linear, top 90ms linear;
}
.btn-ripple-el {
  position:absolute; border-radius:50%;
  background:rgba(255,255,255,0.22); transform:scale(0);
  animation:btn-ripple 650ms ease-out forwards; pointer-events:none;
}

/* ─── MOBILE DRAWER ──────────────────────────────────────────────── */
.mobile-drawer {
  position:fixed; top:66px; left:0; right:0; bottom:0; z-index:199;
  background:rgba(4,4,10,0.97); backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  border-top:1px solid var(--border-2);
  padding:28px 20px; display:flex; flex-direction:column; gap:4px;
  transform:translateY(-8px); opacity:0; pointer-events:none;

}

/* ── Cursor glow ── */
function CursorGlow() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive:true });
    return () => window.removeEventListener('mousemove', move);
  }, []);
  return <div ref={ref} id="cursor-glow" />;
}

/* ── 3D tilt helpers ── */
function onTilt(e) {
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const cx = r.width/2, cy = r.height/2;
  const rx = ((y-cy)/cy)*-6, ry = ((x-cx)/cx)*6;
  el.style.setProperty('--mx', x+'px');
  el.style.setProperty('--my', y+'px');
  el.style.transform = `translateY(-4px) perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function offTilt(e) { e.currentTarget.style.transform = ''; }

/* ── Reveal wrapper ── */
function Rv({ children, delay = 0, className = '', ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { setTimeout(() => setShown(true), delay); obs.unobserve(el); } });
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [delay]);
  return <div ref={ref} className={`rv ${shown ? 'in' : ''} ${className}`} {...rest}>{children}</div>;
}

/* ── Animated counter ── */
function StatCount({ to, suffix }) {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const start = performance.now(); const dur = 1800;
          const step = now => {
            const t = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - t, 3);
            setVal(Math.round(to * eased));
            if (t < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
          obs.unobserve(el);
        }
      });
    }, { threshold: 0.5 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [to]);
  return <span ref={ref}>{val}{suffix}</span>;
}

function App() {
  useEffect(() => {
    const loader = document.getElementById('cfm-loader');
    if (loader) loader.remove();
  }, []);
  useEffect(() => {
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const el = document.createElement('span');
      el.className = 'btn-ripple-el';
      el.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(el);
      setTimeout(() => el.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);
  return (
    <React.Fragment>
      <CursorGlow/>
      <Nav/><Hero/><TrustedBy/><GuaranteeStrip/><PlatformPreview/><HowItWorks/><Categories/><Expertise/><Experts/><Testimonials/><Academy/><CtaBanner/><Footer/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
