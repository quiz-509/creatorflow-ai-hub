<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Académie IA — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--pink:#EC4899;--orange:#F97316;--blue:#3B82F6;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--nav:64px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}

/* AMBIENT ORBS */
.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(120px);}
.orb-1{width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%);top:-250px;left:-200px;}
.orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(6,182,212,0.14) 0%,transparent 70%);top:25%;right:-150px;}
.orb-3{width:400px;height:400px;background:radial-gradient(circle,rgba(124,58,237,0.09) 0%,transparent 70%);bottom:15%;left:15%;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1280px;margin:0 auto;padding:0 24px;}
.nav-logo{font-size:16px;font-weight:800;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;align-items:center;gap:24px;}
.nav-link{font-size:14px;color:var(--text-2);font-weight:500;transition:color 150ms;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--vs);}
.nav-right{display:flex;align-items:center;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);cursor:pointer;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(124,58,237,0.6);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-lg{padding:14px 28px;font-size:15px;font-weight:700;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);cursor:pointer;}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}

/* HERO */
.hero-section{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--nav) + 60px) 24px 80px;text-align:center;z-index:1;overflow:hidden;}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 0%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 0%,transparent 100%);pointer-events:none;}
.hero-inner{max-width:840px;margin:0 auto;}

/* Hero elements start hidden — GSAP reveals them */
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,0.10);border:1px solid rgba(124,58,237,0.28);color:var(--vs);font-size:12px;font-weight:600;padding:6px 16px;border-radius:999px;margin-bottom:32px;letter-spacing:0.05em;text-transform:uppercase;opacity:0;will-change:transform,opacity;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 2s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.75);}}
.hero-title{font-size:clamp(38px,6.5vw,72px);font-weight:900;letter-spacing:-0.05em;line-height:1.0;margin-bottom:24px;}
.hero-line{display:block;}
.hero-word{display:inline-block;opacity:0;will-change:transform,opacity;}
.hero-accent{background:linear-gradient(135deg,var(--vs) 0%,var(--c) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:clamp(15px,1.8vw,18px);color:var(--text-2);margin-bottom:40px;line-height:1.75;max-width:540px;margin-left:auto;margin-right:auto;opacity:0;will-change:transform,opacity;}
.hero-cta-group{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:40px;flex-wrap:wrap;opacity:0;will-change:transform,opacity;}
.search-bar{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border-2);border-radius:14px;padding:6px 6px 6px 18px;gap:10px;max-width:560px;margin:0 auto 28px;transition:border-color 200ms,box-shadow 200ms;opacity:0;will-change:transform,opacity;}
.search-bar:focus-within{border-color:var(--v);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.search-bar input{flex:1;background:none;border:none;outline:none;font-size:14px;color:var(--text);font-family:var(--f);}
.search-bar input::placeholder{color:var(--text-3);}
.hero-pills{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;opacity:0;will-change:transform,opacity;}
.hero-pill{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);}
.hero-pill-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.2);}

/* TRUST BAR */
.trust-bar{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:88px;overflow-x:auto;scrollbar-width:none;z-index:1;position:relative;}
.trust-bar::-webkit-scrollbar{display:none;}
.trust-item{display:flex;align-items:center;gap:12px;padding:18px 32px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0;}
.trust-item:last-child{border-right:none;}
.trust-icon{font-size:20px;}
.trust-text strong{font-size:13px;font-weight:700;display:block;letter-spacing:-0.01em;}
.trust-text span{font-size:11px;color:var(--text-3);}

/* SECTION PRIMITIVES */
.section{position:relative;z-index:1;max-width:1280px;margin:0 auto 96px;padding:0 24px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--vs);margin-bottom:12px;}
.section-heading{font-size:clamp(26px,3.2vw,40px);font-weight:800;letter-spacing:-0.04em;line-height:1.15;margin-bottom:14px;}
.section-sub{font-size:15px;color:var(--text-2);line-height:1.75;max-width:520px;}

/* CATEGORIES */
.categories-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:36px;}
.cat-card{position:relative;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px 20px;cursor:pointer;transition:transform 280ms var(--ease),border-color 280ms,box-shadow 280ms;overflow:hidden;will-change:transform;}
.cat-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--cat-clr,var(--v)) 0%,transparent 55%);opacity:0;transition:opacity 300ms;pointer-events:none;}
.cat-card:hover{transform:translateY(-5px);border-color:var(--cat-clr,var(--v));box-shadow:0 0 0 1px var(--cat-clr,var(--v)),0 24px 48px -12px rgba(0,0,0,0.6);}
.cat-card:hover::after{opacity:0.06;}
.cat-icon-wrap{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);display:grid;place-items:center;font-size:22px;margin-bottom:14px;transition:transform 280ms var(--ease),background 280ms;flex-shrink:0;}
.cat-card:hover .cat-icon-wrap{transform:scale(1.08);background:rgba(255,255,255,0.08);}
.cat-name{font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:-0.01em;}
.cat-desc{font-size:12px;color:var(--text-3);line-height:1.4;margin-bottom:12px;}
.cat-count-pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--text-3);background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:3px 10px;border-radius:99px;}

/* WHY SECTION */
.why-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:40px;}
.why-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;transition:border-color 300ms,transform 300ms var(--ease);}
.why-card:hover{border-color:var(--border-2);transform:translateY(-2px);}
.why-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:20px;}
.why-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px;}
.why-desc{font-size:14px;color:var(--text-2);line-height:1.75;}

/* COURSE CARDS */
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:32px;}
.course-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform 280ms var(--ease),border-color 280ms,box-shadow 280ms;will-change:transform;}
.course-card:hover{border-color:var(--border-2);transform:translateY(-5px);box-shadow:0 24px 52px -12px rgba(0,0,0,0.65);}
.course-thumb{width:100%;aspect-ratio:16/9;background:var(--surf-3);position:relative;overflow:hidden;}
.course-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 500ms var(--ease);}
.course-card:hover .course-thumb img{transform:scale(1.05);}
.course-badge{position:absolute;top:10px;left:10px;background:rgba(124,58,237,0.9);backdrop-filter:blur(8px);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;letter-spacing:0.04em;text-transform:uppercase;}
.course-badge.free{background:rgba(16,185,129,0.9);}
.course-body{padding:18px;}
.course-cat{font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.course-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-0.01em;}
.course-instructor{font-size:12px;color:var(--text-2);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.course-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.course-rating{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--amber);}
.course-rating span{color:var(--text-3);font-weight:400;}
.course-tag{font-size:11px;color:var(--text-3);background:rgba(255,255,255,0.04);padding:3px 9px;border-radius:99px;border:1px solid var(--border);}
.course-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border);}
.course-price{font-size:18px;font-weight:900;letter-spacing:-0.03em;}
.course-price.free{color:var(--green);}
.course-price-sub{font-size:11px;color:var(--text-3);margin-top:1px;}
.enroll-btn{padding:8px 18px;border-radius:999px;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;transition:all 200ms var(--ease);display:inline-flex;align-items:center;gap:5px;}
.enroll-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px -4px var(--vg);}

/* COMING SOON CARD */
.mock-card-wrap{position:relative;}
.coming-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;}
.coming-badge{background:rgba(12,12,24,0.88);backdrop-filter:blur(10px);border:1px solid var(--border-2);border-radius:999px;padding:10px 22px;font-size:13px;font-weight:700;color:var(--text);}

/* TESTIMONIALS */
.testimonials-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;}
.testimonial-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;transition:border-color 300ms;}
.testimonial-card:hover{border-color:var(--border-2);}
.t-stars{display:flex;gap:3px;color:var(--amber);margin-bottom:16px;}
.t-text{font-size:14px;color:var(--text-2);line-height:1.78;margin-bottom:20px;font-style:italic;}
.t-author{display:flex;align-items:center;gap:12px;}
.t-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surf-3);}
.t-avatar img{width:100%;height:100%;object-fit:cover;}
.t-name{font-size:14px;font-weight:700;}
.t-role{font-size:12px;color:var(--text-3);}

/* INSTRUCTOR CTA */
.instr-cta{position:relative;z-index:1;padding:0 24px;margin-bottom:96px;}
.instr-cta-inner{max-width:1280px;margin:0 auto;background:linear-gradient(135deg,rgba(124,58,237,0.11) 0%,rgba(6,182,212,0.05) 100%);border:1px solid rgba(124,58,237,0.22);border-radius:var(--r-xl);padding:64px;display:grid;grid-template-columns:1fr 420px;gap:64px;align-items:center;overflow:hidden;position:relative;}
.instr-cta-inner::before{content:'';position:absolute;top:-80px;right:-80px;width:360px;height:360px;background:radial-gradient(circle,rgba(124,58,237,0.12) 0%,transparent 70%);pointer-events:none;}
.cta-label{font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--vs);margin-bottom:16px;}
.cta-title{font-size:clamp(22px,2.8vw,34px);font-weight:900;letter-spacing:-0.04em;line-height:1.15;margin-bottom:16px;}
.cta-sub{font-size:15px;color:var(--text-2);line-height:1.75;margin-bottom:32px;}
.cta-steps{display:flex;flex-direction:column;gap:18px;margin-bottom:36px;}
.cta-step{display:flex;align-items:flex-start;gap:14px;}
.cta-step-num{width:28px;height:28px;border-radius:50%;background:rgba(124,58,237,0.14);border:1px solid rgba(124,58,237,0.28);color:var(--vs);font-size:12px;font-weight:800;display:grid;place-items:center;flex-shrink:0;margin-top:1px;}
.cta-step-text strong{font-size:14px;font-weight:700;display:block;margin-bottom:2px;}
.cta-step-text span{font-size:13px;color:var(--text-3);}
.cta-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* CTA VISUAL (fake dashboard) */
.cta-visual{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-lg);overflow:hidden;}
.cta-visual-bar{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.dot-r{width:10px;height:10px;border-radius:50%;background:#FF5F56;}
.dot-y{width:10px;height:10px;border-radius:50%;background:#FFBD2E;}
.dot-g{width:10px;height:10px;border-radius:50%;background:#27C93F;}
.cta-visual-body{padding:20px 18px;}
.stat-row{display:flex;gap:10px;margin-bottom:18px;}
.stat-box{flex:1;background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center;}
.stat-box .n{font-size:20px;font-weight:900;letter-spacing:-0.03em;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-box .l{font-size:11px;color:var(--text-3);margin-top:2px;}
.bar-row{margin-bottom:10px;}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:5px;}
.bar-track{height:6px;background:var(--surf-3);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--v),var(--c));border-radius:99px;}
.cta-alert{margin-top:16px;padding:11px 14px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.18);border-radius:var(--r);font-size:12px;color:var(--green);}

/* FILTERS */
.filters-bar{max-width:1280px;margin:0 auto 32px;padding:0 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:1;position:relative;}
.filter-pill{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;background:var(--surf);border:1px solid var(--border-2);color:var(--text-2);cursor:pointer;transition:all 150ms;}
.filter-pill:hover{border-color:var(--border-3);color:var(--text);}
.filter-pill.active{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.4);color:var(--vs);}
.filters-sep{width:1px;height:20px;background:var(--border-2);}
.select-filter{background:var(--surf);border:1px solid var(--border-2);color:var(--text-2);font-family:var(--f);font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;outline:none;}
.select-filter:focus{border-color:var(--v);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:80px 24px;color:var(--text-3);z-index:1;position:relative;}
.empty-icon{font-size:52px;margin-bottom:16px;}
.empty-title{font-size:18px;font-weight:700;color:var(--text-2);margin-bottom:8px;}
.empty-sub{font-size:14px;line-height:1.6;max-width:400px;margin:0 auto 24px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.section-title{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
.section-count{font-size:13px;color:var(--text-3);}

/* FOOTER */
.footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:40px 24px;margin-top:80px;}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.footer-logo{font-size:15px;font-weight:800;letter-spacing:-0.02em;}
.footer-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.footer-links{display:flex;gap:20px;}
.footer-link{font-size:13px;color:var(--text-3);transition:color 150ms;}
.footer-link:hover{color:var(--text-2);}
.footer-copy{font-size:12px;color:var(--text-3);}

/* RESPONSIVE */
@media(max-width:1024px){
  .categories-grid{grid-template-columns:repeat(4,1fr);}
  .why-grid{grid-template-columns:repeat(2,1fr);}
  .testimonials-grid{grid-template-columns:repeat(2,1fr);}
  .instr-cta-inner{grid-template-columns:1fr;gap:40px;padding:40px;}
}
@media(max-width:768px){
  .hero-section{min-height:auto;padding-top:calc(var(--nav)+40px);}
  .hero-title{font-size:36px;}
  .categories-grid{grid-template-columns:repeat(2,1fr);}
  .why-grid{grid-template-columns:1fr;}
  .testimonials-grid{grid-template-columns:1fr;}
  .trust-item{padding:14px 18px;}
  .instr-cta-inner{padding:28px;gap:28px;}
  .nav-links{display:none;}
  .footer-inner{flex-direction:column;text-align:center;}
  .footer-links{flex-wrap:wrap;justify-content:center;}
}
@media(max-width:480px){
  .hero-cta-group{flex-direction:column;}
  .hero-cta-group .btn{width:100%;justify-content:center;}
  .hero-pills{gap:14px;}
}
  </style>
</head>
<body>

<div class="bg-mesh">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

function getCategoryFromSlug(slug, title) {
  const s = ((slug||'') + ' ' + (title||'')).toLowerCase();
  if (s.includes('marketing')) return 'Marketing IA';
  if (s.includes('agent')) return 'Agents IA';
  if (s.includes('automatisation')) return 'Automatisation';
  if (s.includes('développement') || s.includes('developpement')) return 'Développement';
  if (s.includes('prompt')) return 'Prompt Engineering';
  if (s.includes('design')) return 'Design IA';
  if (s.includes('data') || s.includes('analytics')) return 'Data & Analytics';
  return 'Autre';
}

/* === COURSE CARD (real) === */
function CourseCard({ course, enrolled, onEnroll }) {
  const prix = course.prix === 0 ? 'Gratuit' : `${course.prix.toLocaleString('fr-CA')} $`;
  const thumbSrc = course.image_url || THUMB_IMGS[course.categorie] || DEFAULT_THUMB;
  const instrAvatar = `https://api.dicebear.com/9.x/avataaars/svg?seed=${encodeURIComponent(course.nom_instructeur||'Expert')}`;

  return (
    <div className="course-card" onClick={() => window.location.href=`cours.html?id=${course.id}`}>
      <div className="course-thumb">
        <img src={thumbSrc} alt={course.titre}/>
        <span className={`course-badge${course.prix===0?' free':''}`}>{course.prix===0?'Gratuit':'Premium'}</span>
      </div>
      <div className="course-body">
        <div className="course-cat">{course.categorie||'Formation IA'}</div>
        <div className="course-title">{course.titre}</div>
        <div className="course-instructor">
          <img src={instrAvatar} alt="" style={{width:20,height:20,borderRadius:'50%',background:'var(--surf-3)',flexShrink:0}}/>
          <span>Par {course.nom_instructeur||'Expert certifié'}</span>
        </div>
        <div className="course-meta">
          <div className="course-rating"><StarIcon/>{course.note_moyenne>0?course.note_moyenne.toFixed(1):'—'}<span>({course.nb_avis||0})</span></div>
          <span className="course-tag">{course.niveau||'Débutant'}</span>
          {course.duree_totale>0&&<span className="course-tag">{Math.floor(course.duree_totale/60)}h</span>}
        </div>
        <div className="course-footer">
          <div>
            <div className={`course-price${course.prix===0?' free':''}`}>{prix}</div>
            {course.nb_inscrits>0&&<div className="course-price-sub">{course.nb_inscrits} inscrits</div>}
          </div>
          <button className="enroll-btn" onClick={e=>{e.stopPropagation();onEnroll(course);}}>
            <PlayIcon/> {enrolled?'Continuer':course.prix===0?'Accéder':'S\'inscrire'}
          </button>
        </div>
      </div>
    </div>
  );
}

      const els = document.querySelectorAll(selector);
      if (!els.length) return;
      gsap.to(selector, {
        scrollTrigger: { trigger: selector, start: 'top 82%' },
        opacity: 1, y: 0,
        stagger: options.stagger ?? 0.08,
        duration: options.duration ?? 0.65,
        ease: options.ease ?? 'power3.out',
      });
    };

    makeScrollAnim('.cat-card',   { stagger:0.06, duration:0.6 });

    if (activeSort==='recent')    list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

    return list;

      {/* ── HERO ── */}

        <div className="hero-inner">

              {' '}
              <span className="hero-word hero-accent" style={{transform:'translateY(32px)'}}>l'IA.</span>
            </span>
            <span className="hero-line">
              <span className="hero-word" style={{transform:'translateY(32px)'}}>Multipliez</span>

      </div>

      {/* ── INSTRUCTOR CTA ── */}
      <div className="instr-cta">
        <div className="instr-cta-inner">
          <div>
            <div className="cta-label">Rejoindre l'équipe</div>
            <h2 className="cta-title">Vous avez des compétences IA ? Elles valent de l'argent.</h2>
            <p className="cta-sub">Rejoignez les premiers instructeurs de CreatorFlow Academy. Créez votre formation en 2h avec notre outil guidé et commencez à générer des revenus passifs.</p>
            <div className="cta-steps">
              {[
                { t:'Créez votre cours', d:'Notre outil guidé vous accompagne étape par étape en moins de 2h.' },
                { t:'On certifie votre contenu', d:'Notre équipe vérifie la qualité et vous aide à optimiser votre formation.' },
                { t:'Générez des revenus', d:'Chaque inscription = revenu passif. Vous gardez 70% du prix de vente.' },
              ].map((step,i) => (
                <div key={i} className="cta-step">
                  <div className="cta-step-num">{i+1}</div>
                  <div className="cta-step-text">
                    <strong>{step.t}</strong>
                    <span>{step.d}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="cta-actions">
              <a href="creer-cours.html" className="btn btn-primary btn-lg">Créer mon premier cours →</a>
              <a href="inscription.html?role=expert" className="btn btn-ghost btn-lg">Devenir instructeur</a>
            </div>
          </div>
          <div className="cta-visual">
            <div className="cta-visual-bar">
              <div className="dot-r"/><div className="dot-y"/><div className="dot-g"/>
              <span style={{fontSize:12,color:'var(--text-3)',marginLeft:8}}>Dashboard instructeur</span>
            </div>
            <div className="cta-visual-body">
              <div className="stat-row">
                <div className="stat-box"><div className="n">70%</div><div className="l">Vos revenus</div></div>
                <div className="stat-box"><div className="n">∞</div><div className="l">Accès à vie</div></div>
                <div className="stat-box"><div className="n">2h</div><div className="l">Pour créer</div></div>
              </div>
              {[{lbl:'Marketing IA',pct:91},{lbl:'Agents IA',pct:74},{lbl:'Prompt Engineering',pct:58}].map((bar,i)=>(
                <div key={i} className="bar-row">
                  <div className="bar-lbl"><span>{bar.lbl}</span><span>{bar.pct}%</span></div>
                  <div className="bar-track"><div className="bar-fill" style={{width:`${bar.pct}%`}}/></div>
                </div>
              ))}
              <div className="cta-alert">📈 Forte demande pour les formateurs IA francophones</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── CATALOG (real DB) ── */}
      <div id="cours-section" style={{position:'relative',zIndex:1}}>
        <div className="filters-bar">
          {CATEGORIES.map(cat=>(
            <button key={cat} className={`filter-pill${activeCat===cat?' active':''}`} onClick={()=>setActiveCat(cat)}>{cat}</button>
          ))}
          <div className="filters-sep"/>
          <select className="select-filter" value={activeNiveau} onChange={e=>setActiveNiveau(e.target.value)}>
            {NIVEAUX.map(n=><option key={n}>{n}</option>)}
          </select>
          <select className="select-filter" value={activeSort} onChange={e=>setActiveSort(e.target.value)}>
            <option value="recent">Plus récents</option>
            <option value="populaire">Plus populaires</option>
            <option value="note">Mieux notés</option>
            <option value="prix-asc">Prix croissant</option>
          </select>
        </div>

        <div className="section" style={{marginBottom:0}}>
          <div className="section-header">
            <div className="section-title">{activeCat==='Tous'?'Tous les cours':activeCat}</div>
            <div className="section-count">{filtered.length} cours disponibles</div>
          </div>

          {loading ? (
            <div className="empty-state">
              <div className="empty-icon">⏳</div>
              <div className="empty-title">Chargement des cours…</div>
            </div>
          ) : filtered.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">🚀</div>
              <div className="empty-title">{courses.length===0?'Soyez parmi les premiers !':'Aucun cours dans cette catégorie'}</div>
              <div className="empty-sub">
                {courses.length===0
                  ? "Les premiers cours arrivent bientôt. En attendant, devenez instructeur et publiez le vôtre."
                  : "Essayez une autre catégorie ou réinitialisez les filtres."}
              </div>
              {courses.length===0&&<a href="creer-cours.html" className="btn btn-primary">Publier le premier cours →</a>}
            </div>
          ) : (
            <div className="courses-grid">
              {filtered.map(course=>(
                <CourseCard key={course.id} course={course} enrolled={enrolledIds.has(course.id)} onEnroll={handleEnroll}/>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* ── FOOTER ── */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-logo">CreatorFlow <em>Market</em></div>
          <div className="footer-links">
            <a href="index.html" className="footer-link">Plateforme</a>
            <a href="experts.html" className="footer-link">Experts</a>
            <a href="academie.html" className="footer-link">Académie</a>
            <a href="creer-cours.html" className="footer-link">Créer un cours</a>
          </div>
          <div className="footer-copy">© 2026 CreatorFlow Market · Tous droits réservés</div>
        </div>
      </footer>

    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
