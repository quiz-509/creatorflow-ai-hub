  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--pink:#EC4899;--orange:#F97316;--blue:#3B82F6;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--nav:64px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}

.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(120px);}
.orb-1{width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%);top:-250px;left:-200px;}
.orb-2{width:500px;height:500px;background:radial-gradient(circle,rgba(6,182,212,0.14) 0%,transparent 70%);top:25%;right:-150px;}
.orb-3{width:400px;height:400px;background:radial-gradient(circle,rgba(124,58,237,0.09) 0%,transparent 70%);bottom:15%;left:15%;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.82);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1280px;margin:0 auto;padding:0 24px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-links{display:flex;align-items:center;gap:24px;}
.nav-link{font-size:14px;color:var(--text-2);font-weight:500;transition:color 150ms;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--vs);}
.nav-right{display:flex;align-items:center;gap:10px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);cursor:pointer;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(124,58,237,0.6);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-lg{padding:14px 28px;font-size:15px;font-weight:700;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);cursor:pointer;}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulseDot 2s ease-in-out infinite;flex-shrink:0;}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.75);}}

/* HERO */
.hero-v2{position:relative;min-height:100vh;display:flex;align-items:center;padding-top:var(--nav);z-index:1;overflow:hidden;}
.hero-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(124,58,237,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.04) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,black 0%,transparent 100%);pointer-events:none;}
.hero-v2-inner{max-width:1280px;margin:0 auto;padding:60px 24px;display:grid;grid-template-columns:1fr 420px;gap:64px;align-items:center;width:100%;}
.hero-label{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,0.10);border:1px solid rgba(124,58,237,0.28);color:var(--vs);font-size:11px;font-weight:700;padding:6px 16px;border-radius:999px;margin-bottom:28px;letter-spacing:0.08em;text-transform:uppercase;}
.hero-v2-title{font-size:clamp(36px,5.5vw,66px);font-weight:900;letter-spacing:-0.05em;line-height:1.0;margin-bottom:20px;}
.hero-accent{background:linear-gradient(135deg,var(--vs) 0%,var(--c) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-v2-sub{font-size:17px;color:var(--text-2);line-height:1.75;margin-bottom:36px;max-width:480px;}
.hero-v2-cta{display:flex;gap:12px;margin-bottom:48px;flex-wrap:wrap;}
.hero-stats{display:flex;border:1px solid var(--border-2);border-radius:var(--r-lg);overflow:hidden;background:rgba(255,255,255,0.02);}
.h-stat{padding:16px 24px;border-right:1px solid var(--border);text-align:center;flex:1;}
.h-stat:last-child{border-right:none;}
.h-stat-n{font-size:22px;font-weight:900;letter-spacing:-0.04em;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.h-stat-l{font-size:11px;color:var(--text-3);margin-top:2px;}
.hero-img-wrap{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:3/4;background:var(--surf-3);}
.hero-img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.hero-img-mask{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,var(--bg) 100%),linear-gradient(to right,transparent 60%,rgba(4,4,10,0.4) 100%);}
.hero-img-card{position:absolute;bottom:20px;left:16px;right:16px;background:rgba(12,12,24,0.88);backdrop-filter:blur(16px);border:1px solid var(--border-2);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;}
.hero-card-ava{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--vs);}
.hero-card-ava img{width:100%;height:100%;object-fit:cover;}
.hero-card-text strong{font-size:13px;font-weight:700;display:block;}
.hero-card-text span{font-size:11px;color:var(--text-3);}
.hero-card-play{margin-left:auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--v2));display:grid;place-items:center;flex-shrink:0;}

/* SECTIONS */
.ps{position:relative;z-index:1;max-width:1280px;margin:0 auto 96px;padding:0 24px;}
.ps-label{font-size:11px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--vs);margin-bottom:12px;}
.ps-title{font-size:clamp(26px,3.2vw,40px);font-weight:900;letter-spacing:-0.04em;line-height:1.15;margin-bottom:14px;}
.ps-sub{font-size:15px;color:var(--text-2);line-height:1.75;max-width:540px;}
.ps-head{margin-bottom:40px;}

/* VIDEO MODAL */
.vmodal-bg{position:fixed;inset:0;background:rgba(4,4,10,0.94);backdrop-filter:blur(20px);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn 180ms ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.vmodal-inner{width:100%;max-width:420px;position:relative;}
.vmodal-close{position:absolute;top:-48px;right:0;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid var(--border-2);display:grid;place-items:center;cursor:pointer;color:var(--text-2);font-size:18px;transition:background 150ms;line-height:1;}
.vmodal-close:hover{background:rgba(255,255,255,0.15);color:var(--text);}
.vmodal-video{width:100%;border-radius:var(--r-xl);overflow:hidden;background:#000;}
.vmodal-video video{width:100%;display:block;max-height:78vh;object-fit:contain;}
.vmodal-info{margin-top:16px;display:flex;align-items:center;gap:12px;}
.vmodal-ava{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--vs);}
.vmodal-ava img{width:100%;height:100%;object-fit:cover;object-position:top;}
.vmodal-nom{font-size:16px;font-weight:800;}
.vmodal-dom{font-size:12px;color:var(--text-3);}

/* FORMATEURS */
.fmt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:40px;}
.fmt-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;transition:transform 300ms var(--ease),border-color 300ms,box-shadow 300ms;position:relative;cursor:pointer;}
.fmt-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px -12px rgba(0,0,0,0.7);}
.fmt-play-btn{position:absolute;bottom:16px;right:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--v2));display:grid;place-items:center;opacity:0;transition:opacity 250ms,transform 250ms;transform:scale(0.75);box-shadow:0 4px 20px rgba(124,58,237,0.6);}
.fmt-card:hover .fmt-play-btn{opacity:1;transform:scale(1);}
.fmt-card.clickable{cursor:pointer;}
.fmt-card.clickable:hover{transform:translateY(-6px);box-shadow:0 24px 48px -12px rgba(0,0,0,0.7);}
.fmt-img-wrap{width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--surf-3);position:relative;}
.fmt-img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform 500ms var(--ease);}
.fmt-card.clickable:hover .fmt-img{transform:scale(1.04);}
.fmt-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(12,12,24,0.92) 100%);}
.fmt-badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;backdrop-filter:blur(8px);}
.fmt-dispo{background:rgba(16,185,129,0.85);color:#fff;}
.fmt-soon{background:rgba(245,158,11,0.85);color:#fff;}
.fmt-info{padding:16px;}
.fmt-domain{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.fmt-nom{font-size:17px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;}
.fmt-bio{font-size:12px;color:var(--text-3);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* PARCOURS */
.parcours-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;}
.p-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px 28px;cursor:pointer;transition:transform 300ms var(--ease),border-color 300ms,box-shadow 300ms;position:relative;overflow:hidden;}
.p-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pc,var(--v)),transparent);}
.p-card:hover{transform:translateY(-5px);border-color:var(--pc,var(--v));box-shadow:0 24px 48px -12px rgba(0,0,0,0.65);}
.p-icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:20px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);}
.p-titre{font-size:20px;font-weight:900;letter-spacing:-0.03em;margin-bottom:4px;}
.p-sous{font-size:13px;color:var(--text-3);margin-bottom:16px;font-style:italic;}
.p-desc{font-size:14px;color:var(--text-2);line-height:1.65;margin-bottom:20px;}
.p-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
.p-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);}
.p-check{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:9px;}
.p-meta{display:flex;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid var(--border);}
.p-meta-txt{font-size:12px;color:var(--text-3);}
.p-meta-txt strong{font-size:13px;font-weight:700;color:var(--text);display:block;}
.p-cert{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;}

/* FEATURED */
.featured-wrap{position:relative;z-index:1;margin-bottom:96px;padding:0 24px;}
.featured-inner{max-width:1280px;margin:0 auto;border-radius:var(--r-xl);overflow:hidden;position:relative;min-height:400px;display:flex;align-items:flex-end;}
.f-bg{position:absolute;inset:0;}
.f-bg img{width:100%;height:100%;object-fit:cover;}
.f-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(4,4,10,0.96) 38%,rgba(4,4,10,0.25) 100%),linear-gradient(to top,rgba(4,4,10,0.6) 0%,transparent 60%);}
.f-content{position:relative;z-index:1;padding:52px;max-width:620px;}
.f-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.f-badge{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--vs);background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);padding:4px 12px;border-radius:999px;}
.f-stars{display:flex;gap:2px;color:var(--amber);}
.f-title{font-size:clamp(24px,3.5vw,44px);font-weight:900;letter-spacing:-0.04em;line-height:1.1;margin-bottom:12px;}
.f-desc{font-size:15px;color:var(--text-2);line-height:1.65;margin-bottom:22px;max-width:460px;}
.f-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.f-tag{font-size:12px;color:var(--text-3);background:rgba(255,255,255,0.05);border:1px solid var(--border-2);padding:4px 12px;border-radius:999px;}
.f-actions{display:flex;gap:10px;flex-wrap:wrap;}
.f-instructor{position:absolute;bottom:40px;right:48px;display:flex;align-items:center;gap:12px;background:rgba(12,12,24,0.78);backdrop-filter:blur(16px);border:1px solid var(--border-2);border-radius:var(--r);padding:10px 16px;}
.f-instr-photo{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--vs);}
.f-instr-photo img{width:100%;height:100%;object-fit:cover;object-position:top;}
.f-instr-name{font-size:13px;font-weight:700;}
.f-instr-role{font-size:11px;color:var(--text-3);}

/* TRANSFORMATIONS */
.tr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;}
.tr-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;transition:border-color 300ms,transform 300ms var(--ease);}
.tr-card:hover{border-color:var(--border-2);transform:translateY(-3px);}
.tr-before{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.tr-lbl-b{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-3);margin-bottom:4px;}
.tr-lbl-a{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--green);margin-bottom:4px;}
.tr-txt{font-size:13px;color:var(--text-2);line-height:1.5;}
.tr-txt-a{font-size:13px;color:var(--text);line-height:1.5;font-weight:600;}
.tr-arrow{text-align:center;font-size:16px;margin:6px 0;color:var(--vs);}
.tr-after{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.18);border-radius:var(--r);padding:12px;margin-bottom:14px;}
.tr-metric{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--green),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.04em;margin-bottom:14px;}
.tr-author{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--border);}
.tr-ava{width:36px;height:36px;border-radius:50%;background:var(--surf-3);overflow:hidden;flex-shrink:0;}
.tr-ava img{width:100%;height:100%;object-fit:cover;}
.tr-name{font-size:13px;font-weight:700;}
.tr-role{font-size:11px;color:var(--text-3);}
.tr-course{font-size:10px;color:var(--vs);margin-top:1px;}

/* CERTIFICATIONS */
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;}
.cert-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;text-align:center;transition:transform 300ms var(--ease),border-color 300ms;display:flex;flex-direction:column;}
.cert-card:hover{transform:translateY(-5px);}
.cert-gold{border-color:rgba(245,158,11,0.3);}
.cert-silver{border-color:rgba(148,163,184,0.25);}
.cert-bronze{border-color:rgba(180,130,80,0.25);}
.cert-medal{font-size:52px;margin-bottom:16px;display:block;}
.cert-name{font-size:20px;font-weight:900;letter-spacing:-0.03em;margin-bottom:8px;}
.cert-desc{font-size:13px;color:var(--text-3);margin-bottom:20px;}
.cert-items{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:20px;flex:1;}
.cert-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);}
.cert-check{color:var(--green);flex-shrink:0;font-size:12px;}
.cert-req{font-size:12px;color:var(--text-3);background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;}

/* COMMUNITY */
.comm-inner{display:grid;grid-template-columns:1fr 460px;gap:64px;align-items:center;}
.comm-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px;}
.comm-stat{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.comm-stat-n{font-size:24px;font-weight:900;letter-spacing:-0.04em;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.comm-stat-l{font-size:12px;color:var(--text-3);margin-top:2px;}
.comm-feat{display:flex;flex-direction:column;gap:14px;margin-bottom:36px;}
.comm-feat-item{display:flex;gap:14px;align-items:flex-start;}
.comm-feat-icon{width:40px;height:40px;border-radius:10px;background:rgba(124,58,237,0.10);border:1px solid rgba(124,58,237,0.2);display:grid;place-items:center;font-size:18px;flex-shrink:0;}
.comm-feat-title{font-size:14px;font-weight:700;margin-bottom:2px;}
.comm-feat-sub{font-size:13px;color:var(--text-3);}
.mockup{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);overflow:hidden;}
.mkp-bar{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;}
.mkp-dot{width:10px;height:10px;border-radius:50%;}
.mkp-chan{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);}
.mkp-chan-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
.mkp-chan-name{font-size:13px;font-weight:600;}
.mkp-msgs{padding:16px;display:flex;flex-direction:column;gap:12px;}
.mkp-msg{display:flex;gap:10px;}
.mkp-msg-ava{width:32px;height:32px;border-radius:50%;flex-shrink:0;overflow:hidden;}
.mkp-msg-ava img{width:100%;height:100%;object-fit:cover;}
.mkp-msg-name{font-size:12px;font-weight:700;margin-bottom:2px;}
.mkp-msg-time{font-size:10px;color:var(--text-3);font-weight:400;margin-left:6px;}
.mkp-msg-txt{font-size:12px;color:var(--text-2);line-height:1.45;}
.mkp-event{margin:12px;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:var(--r);padding:14px;}
.mkp-event-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--vs);margin-bottom:4px;}
.mkp-event-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.mkp-event-time{font-size:11px;color:var(--text-3);}

/* CATALOG */
.catalog-wrap{position:relative;z-index:1;margin-bottom:96px;}
.filters-bar{max-width:1280px;margin:0 auto 28px;padding:0 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-pill{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500;background:var(--surf);border:1px solid var(--border-2);color:var(--text-2);cursor:pointer;transition:all 150ms;}
.filter-pill:hover{border-color:var(--border-3);color:var(--text);}
.filter-pill.active{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.4);color:var(--vs);}
.filters-sep{width:1px;height:20px;background:var(--border-2);}
.sel-filter{background:var(--surf);border:1px solid var(--border-2);color:var(--text-2);font-family:var(--f);font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;outline:none;}
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.sec-title{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
.sec-count{font-size:13px;color:var(--text-3);}

/* COURSE CARD */
.course-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform 280ms var(--ease),border-color 280ms,box-shadow 280ms;}
.course-card:hover{border-color:var(--border-2);transform:translateY(-5px);box-shadow:0 24px 52px -12px rgba(0,0,0,0.65);}
.course-thumb{width:100%;aspect-ratio:16/9;background:var(--surf-3);position:relative;overflow:hidden;}
.course-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 500ms var(--ease);}
.course-card:hover .course-thumb img{transform:scale(1.05);}
.course-badge{position:absolute;top:10px;left:10px;background:rgba(124,58,237,0.9);backdrop-filter:blur(8px);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;letter-spacing:0.04em;text-transform:uppercase;}
.course-badge.free{background:rgba(16,185,129,0.9);}
.course-body{padding:18px;}
.course-cat{font-size:11px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.course-title{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-0.01em;}
.course-instructor{font-size:12px;color:var(--text-2);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.course-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.course-rating{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--amber);}
.course-rating span{color:var(--text-3);font-weight:400;}
.course-tag{font-size:11px;color:var(--text-3);background:rgba(255,255,255,0.04);padding:3px 9px;border-radius:99px;border:1px solid var(--border);}
.course-footer{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--border);}
.course-price{font-size:18px;font-weight:900;letter-spacing:-0.03em;}
.course-price.free{color:var(--green);}
.course-price-sub{font-size:11px;color:var(--text-3);margin-top:1px;}
.enroll-btn{padding:8px 18px;border-radius:999px;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;transition:all 200ms var(--ease);display:inline-flex;align-items:center;gap:5px;}
.enroll-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px -4px var(--vg);}

/* EMPTY */
.empty-state{text-align:center;padding:80px 24px;color:var(--text-3);}
.empty-icon{font-size:52px;margin-bottom:16px;}
.empty-title{font-size:18px;font-weight:700;color:var(--text-2);margin-bottom:8px;}
.empty-sub{font-size:14px;line-height:1.6;max-width:400px;margin:0 auto;}

/* FINAL CTA */
.final-cta{position:relative;z-index:1;padding:0 24px;margin-bottom:96px;}
.final-cta-inner{max-width:1280px;margin:0 auto;background:linear-gradient(135deg,rgba(124,58,237,0.12) 0%,rgba(6,182,212,0.06) 100%);border:1px solid rgba(124,58,237,0.22);border-radius:var(--r-xl);padding:80px 64px;text-align:center;position:relative;overflow:hidden;}
.final-cta-inner::before{content:'';position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(circle,rgba(124,58,237,0.15) 0%,transparent 70%);pointer-events:none;}
.final-title{font-size:clamp(28px,4vw,52px);font-weight:900;letter-spacing:-0.05em;line-height:1.05;margin-bottom:20px;}
.final-sub{font-size:17px;color:var(--text-2);margin-bottom:40px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.7;}
.final-actions{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
.final-guarantee{font-size:13px;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:6px;}

/* FOOTER */
.footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:40px 24px;}
.footer-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.footer-logo{font-size:15px;font-weight:800;letter-spacing:-0.02em;}
.footer-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.footer-links{display:flex;gap:20px;}
.footer-link{font-size:13px;color:var(--text-3);transition:color 150ms;}
.footer-link:hover{color:var(--text-2);}
.footer-copy{font-size:12px;color:var(--text-3);}

/* RESPONSIVE */
@media(max-width:1024px){
  .hero-v2-inner{grid-template-columns:1fr;gap:40px;}
  .hero-img-wrap{max-width:340px;margin:0 auto;}
  .fmt-grid{grid-template-columns:repeat(3,1fr);}
  .comm-inner{grid-template-columns:1fr;gap:40px;}
  .f-instructor{display:none;}
}
@media(max-width:768px){
  .hero-v2-inner{padding:40px 24px;}
  .hero-stats{flex-direction:column;}
  .h-stat{border-right:none;border-bottom:1px solid var(--border);}
  .h-stat:last-child{border-bottom:none;}
  .fmt-grid{grid-template-columns:repeat(2,1fr);}
  .parcours-grid{grid-template-columns:1fr;}
  .tr-grid{grid-template-columns:1fr;}
  .cert-grid{grid-template-columns:1fr;}
  .nav-links{display:none;}
  .footer-inner{flex-direction:column;text-align:center;}
  .footer-links{flex-wrap:wrap;justify-content:center;}
}
@media(max-width:480px){
  .hero-v2-cta{flex-direction:column;}
  .hero-v2-cta .btn{width:100%;justify-content:center;}
  .fmt-grid{grid-template-columns:repeat(2,1fr);}
  .final-cta-inner{padding:40px 24px;}
  .f-content{padding:28px;}
}
