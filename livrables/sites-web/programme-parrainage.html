<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Programme de Parrainage — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--orange:#F59E0B;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,4,10,0.85);backdrop-filter:blur(18px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}

.page{padding-top:64px;min-height:100vh;}
.container{max-width:1000px;margin:0 auto;padding:0 24px;}

/* HERO */
.hero{padding:60px 0 50px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 800px 500px at 50% 30%,rgba(124,58,237,0.12),transparent 70%);pointer-events:none;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 16px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);border-radius:999px;font-size:12px;font-weight:700;color:var(--vs);margin-bottom:20px;}
.hero-title{font-size:42px;font-weight:800;letter-spacing:-0.04em;margin-bottom:14px;line-height:1.1;}
.hero-title em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:17px;color:var(--text-2);max-width:500px;margin:0 auto 36px;line-height:1.65;}
.hero-rewards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:40px;}
.reward-chip{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surf);border:1px solid var(--border-2);border-radius:999px;font-size:14px;font-weight:700;}
.reward-chip em{font-style:normal;color:var(--vs);}

/* CODE CARD */
.code-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;max-width:520px;margin:0 auto 60px;position:relative;overflow:hidden;}
.code-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.code-label{font-size:13px;color:var(--text-3);margin-bottom:12px;font-weight:600;}
.code-box{display:flex;align-items:center;gap:12px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:var(--r);padding:14px 18px;margin-bottom:12px;}
.code-value{font-size:22px;font-weight:800;letter-spacing:0.1em;font-family:'Courier New',monospace;flex:1;color:var(--vs);}
.copy-btn{padding:8px 16px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);border-radius:8px;font-size:13px;font-weight:700;color:var(--vs);transition:all 150ms;white-space:nowrap;}
.copy-btn:hover{background:rgba(124,58,237,0.25);}
.copy-btn.copied{background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.3);color:var(--green);}
.share-row{display:flex;gap:8px;}
.share-btn{flex:1;justify-content:center;padding:10px 14px;font-size:13px;}
.code-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px;}
.cstat{text-align:center;padding:12px;background:var(--surf-2);border-radius:var(--r);}
.cstat-val{font-size:20px;font-weight:800;color:var(--vs);}
.cstat-lbl{font-size:11px;color:var(--text-3);margin-top:2px;}

/* HOW IT WORKS */
.section{padding:48px 0;}
.section-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;text-align:center;margin-bottom:8px;}
.section-sub{font-size:14px;color:var(--text-2);text-align:center;margin-bottom:36px;}
.steps-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:48px;}
.step-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;text-align:center;position:relative;}
.step-num{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;margin:0 auto 16px;}
.step-emoji{font-size:28px;margin-bottom:10px;}
.step-name{font-size:15px;font-weight:800;margin-bottom:6px;}
.step-desc{font-size:13px;color:var(--text-2);line-height:1.65;}
.step-arrow{position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--border-2);font-size:20px;z-index:1;}

/* REWARDS TABLE */
.rewards-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:48px;}
.reward-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;}
.reward-card.highlight{border-color:rgba(124,58,237,0.35);background:linear-gradient(135deg,rgba(124,58,237,0.08),var(--surf));}
.reward-icon{font-size:32px;margin-bottom:12px;}
.reward-title{font-size:16px;font-weight:800;margin-bottom:4px;}
.reward-amount{font-size:28px;font-weight:800;letter-spacing:-0.03em;color:var(--vs);margin-bottom:8px;}
.reward-desc{font-size:13px;color:var(--text-2);line-height:1.65;}
.reward-cond{font-size:12px;color:var(--text-3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}

/* HISTORY */
.history-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:60px;}
.history-title{font-size:15px;font-weight:800;margin-bottom:16px;}
.history-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
.history-row:last-child{border:none;padding-bottom:0;}
.hist-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.hist-info{flex:1;}
.hist-name{font-size:13px;font-weight:600;}
.hist-date{font-size:12px;color:var(--text-3);}
.hist-amount{font-size:14px;font-weight:800;color:var(--green);}
.hist-status{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.s-paid{background:rgba(16,185,129,0.12);color:var(--green);}
.s-pending{background:rgba(245,158,11,0.12);color:var(--orange);}

/* FAQ */
.faq{padding-bottom:60px;}
.faq-item{border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;font-size:14px;font-weight:600;transition:background 150ms;}
.faq-q:hover{background:rgba(255,255,255,0.03);}
.faq-a{padding:0 18px 16px;font-size:13px;color:var(--text-2);line-height:1.7;}
.faq-icon{font-size:18px;color:var(--text-3);transition:transform 200ms;}
.faq-icon.open{transform:rotate(45deg);}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 500ms var(--ease) both;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;

const CODE = 'THOMAS-X7K2';
const SHARE_URL = `https://creatorflomarket.netlify.app?ref=${CODE}`;

const FAQS = [
  { q:'Combien puis-je gagner avec le parrainage ?', a:'Il n\'y a pas de limite. Chaque filleul qui complète une mission vous rapporte 50$ pour vous et 50$ de réduction pour lui. Vous pouvez parrainer autant de personnes que vous voulez.' },
  { q:'Quand est-ce que je reçois ma récompense ?', a:'Votre crédit de 50$ est ajouté à votre compte dès que votre filleul a complété et payé sa première mission. Les crédits apparaissent sous 24h.' },
  { q:'Comment utiliser mes crédits de parrainage ?', a:'Vos crédits sont automatiquement déduits lors de votre prochain paiement de mission sur CreatorFlow Market. Ils ne expirent pas.' },
  { q:'Mon lien de parrainage est-il limité dans le temps ?', a:'Non, votre code et lien de parrainage sont permanents. Partagez-les quand vous voulez, ils fonctionneront toujours.' },
  { q:'Mon filleul doit-il être un nouveau client ?', a:'Oui, la récompense s\'applique uniquement aux nouveaux comptes qui s\'inscrivent via votre lien ou code et qui complètent une première mission.' },
];

const HISTORY = [
  { name:'Sarah M.', init:'SM', color:'#7C3AED', date:'15 mai 2026', amount:'+50$', status:'paid', mission:'Automatisation CRM' },
  { name:'Jean-Pierre K.', init:'JP', color:'#0891B2', date:'3 mai 2026', amount:'+50$', status:'paid', mission:'Chatbot e-commerce' },
  { name:'Laura F.', init:'LF', color:'#059669', date:'20 avr. 2026', amount:'+50$', status:'paid', mission:'Pipeline IA analytics' },
  { name:'Marc D.', init:'MD', color:'#D97706', date:'Inscrit le 10 avr.', amount:'+50$', status:'pending', mission:'En attente de mission' },
];

function App() {
  const [copied, setCopied] = useState(false);
  const [copiedLink, setCopiedLink] = useState(false);
  const [openFaq, setOpenFaq] = useState(null);

  useEffect(() => {
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const copyCode = () => {
    navigator.clipboard.writeText(CODE).catch(()=>{});
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const copyLink = () => {
    navigator.clipboard.writeText(SHARE_URL).catch(()=>{});
    setCopiedLink(true);
    setTimeout(() => setCopiedLink(false), 2000);
  };

  return (
    <React.Fragment>
      <nav className="nav"><div className="nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
        <div style={{display:'flex',gap:10}}>
          <a href="dashboard-client.html" className="btn btn-ghost" style={{padding:'8px 16px',fontSize:13}}>Dashboard</a>
        </div>
      </div></nav>

      <div className="page">
        {/* HERO */}
        <div className="hero">
          <div className="container">
            <div className="hero-badge">🎁 Programme de parrainage</div>
            <div className="hero-title fade-up">Invitez vos amis,<br/>gagnez <em>ensemble</em></div>
            <div className="hero-sub fade-up">Pour chaque ami que vous parrainez, vous recevez tous les deux 50$ de crédit sur votre prochaine mission.</div>
            <div className="hero-rewards fade-up">
              <div className="reward-chip">🧑 Vous : <em>+50$</em> de crédit</div>
              <div style={{display:'flex',alignItems:'center',color:'var(--text-3)',fontSize:20}}>+</div>
              <div className="reward-chip">👥 Votre filleul : <em>-50$</em> sur sa mission</div>
            </div>

            {/* CODE CARD */}
            <div className="code-card fade-up">
              <div className="code-label">Votre code de parrainage</div>
              <div className="code-box">
                <div className="code-value">{CODE}</div>
                <button className={`copy-btn ${copied ? 'copied' : ''}`} onClick={copyCode}>
                  {copied ? '✓ Copié !' : 'Copier'}
                </button>
              </div>
              <div className="share-row">
                <button className="btn btn-ghost share-btn" onClick={copyLink}>
                  🔗 {copiedLink ? 'Lien copié !' : 'Copier le lien'}
                </button>
                <a href={`https://wa.me/?text=Rejoins%20CreatorFlow%20Market%20avec%20mon%20code%20${CODE}%20et%20on%20gagne%20tous%20les%20deux%2050$%20!`}
                  className="btn btn-ghost share-btn" target="_blank" rel="noopener">
                  💬 WhatsApp
                </a>
                <a href={`mailto:?subject=Je%20t%27invite%20sur%20CreatorFlow%20Market&body=Rejoins-moi%20avec%20mon%20code%20de%20parrainage%20${CODE}%20et%20tu%20bénéficies%20de%2050$%20de%20réduction%20sur%20ta%20première%20mission%20IA%20!`}
                  className="btn btn-ghost share-btn">
                  📧 Email
                </a>
              </div>
              <div className="code-stats">
                <div className="cstat"><div className="cstat-val">4</div><div className="cstat-lbl">Filleuls inscrits</div></div>
                <div className="cstat"><div className="cstat-val" style={{color:'var(--green)'}}>3</div><div className="cstat-lbl">Missions complétées</div></div>
                <div className="cstat"><div className="cstat-val" style={{color:'var(--orange)'}}>150$</div><div className="cstat-lbl">Crédits gagnés</div></div>
              </div>
            </div>
          </div>
        </div>

        <div className="container">
          {/* HOW IT WORKS */}
          <div className="section fade-up">
            <div className="section-title">Comment ça marche ?</div>
            <div className="section-sub">Trois étapes simples pour gagner des crédits.</div>
            <div className="steps-row">
              {[
                { num:1, emoji:'🔗', title:'Partagez votre code', desc:'Envoyez votre code ou lien unique à vos contacts, collègues et sur vos réseaux sociaux.' },
                { num:2, emoji:'✍️', title:'Votre filleul s\'inscrit', desc:'Il crée son compte avec votre code et profite de 50$ de réduction sur sa première mission.' },
                { num:3, emoji:'💸', title:'Vous recevez 50$', desc:'Dès que sa première mission est complétée, 50$ de crédit sont ajoutés à votre compte.' },
              ].map((s,i,arr)=>(
                <div key={i} style={{position:'relative'}}>
                  <div className="step-card">
                    <div className="step-num">{s.num}</div>
                    <div className="step-emoji">{s.emoji}</div>
                    <div className="step-name">{s.title}</div>
                    <div className="step-desc">{s.desc}</div>
                  </div>
                  {i < arr.length-1 && <div className="step-arrow">→</div>}
                </div>
              ))}
            </div>

            {/* REWARDS */}
            <div className="rewards-grid">
              <div className="reward-card highlight">
                <div className="reward-icon">🧑</div>
                <div className="reward-title">Votre récompense</div>
                <div className="reward-amount">50$</div>
                <div className="reward-desc">Crédit ajouté à votre compte. Utilisable sur n'importe quelle mission sur CreatorFlow Market.</div>
                <div className="reward-cond">Condition : votre filleul complète sa première mission.</div>
              </div>
              <div className="reward-card highlight">
                <div className="reward-icon">👥</div>
                <div className="reward-title">La récompense de votre filleul</div>
                <div className="reward-amount">-50$</div>
                <div className="reward-desc">Réduction immédiate de 50$ sur sa première mission. Aucun code à saisir au paiement.</div>
                <div className="reward-cond">Valable sur les missions de 200$ minimum.</div>
              </div>
            </div>
          </div>

          {/* HISTORY */}
          <div className="history-card fade-up">
            <div className="history-title">Historique de vos parrainages</div>
            {HISTORY.map((h,i)=>(
              <div key={i} className="history-row">
                <div className="hist-avatar" style={{background:h.color}}>{h.init}</div>
                <div className="hist-info">
                  <div className="hist-name">{h.name}</div>
                  <div className="hist-date">{h.date} · {h.mission}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div className={`hist-status ${h.status==='paid'?'s-paid':'s-pending'}`}>{h.status==='paid'?'Payé':'En attente'}</div>
                  <div className="hist-amount">{h.amount}</div>
                </div>
              </div>
            ))}
            <div style={{marginTop:16,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderTop:'1px solid var(--border)'}}>
              <span style={{fontSize:14,fontWeight:700}}>Total crédits gagnés</span>
              <span style={{fontSize:18,fontWeight:800,color:'var(--green)'}}>150$</span>
            </div>
          </div>

          {/* FAQ */}
          <div className="faq fade-up">
            <div className="section-title" style={{marginBottom:8}}>Questions fréquentes</div>
            <div style={{fontSize:14,color:'var(--text-2)',marginBottom:24,textAlign:'center'}}>Tout ce que vous devez savoir sur le programme.</div>
            {FAQS.map((f,i)=>(
              <div key={i} className="faq-item">
                <div className="faq-q" onClick={()=>setOpenFaq(openFaq===i?null:i)}>
                  {f.q}
                  <span className={`faq-icon ${openFaq===i?'open':''}`}>+</span>
                </div>
                {openFaq===i && <div className="faq-a">{f.a}</div>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
