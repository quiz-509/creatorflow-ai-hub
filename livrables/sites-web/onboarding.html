<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bienvenue — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--orange:#F59E0B;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-outline-sel{background:transparent;border:2px solid var(--border-2);border-radius:var(--r-lg);padding:16px;text-align:left;cursor:pointer;transition:all 200ms;width:100%;}
.btn-outline-sel:hover{border-color:var(--border-2);}
.btn-outline-sel.selected{border-color:var(--v);background:rgba(124,58,237,0.08);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}

/* LAYOUT */
.onboarding{flex:1;display:flex;flex-direction:column;}
.top-bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--border);}
.logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.skip{font-size:13px;color:var(--text-3);transition:color 150ms;}
.skip:hover{color:var(--text-2);}

/* PROGRESS */
.prog-bar{height:3px;background:var(--border);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--v),var(--c));transition:width 500ms var(--ease);}

/* CONTENT */
.ob-content{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.ob-card{width:100%;max-width:560px;}
.step-tag{font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.08em;}
.ob-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;line-height:1.2;}
.ob-title em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.ob-sub{font-size:14px;color:var(--text-2);margin-bottom:32px;line-height:1.65;}

/* OPTION CARDS */
.option-grid{display:grid;gap:12px;margin-bottom:28px;}
.option-grid-2{grid-template-columns:1fr 1fr;}
.option-card{background:var(--surf);border:2px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all 200ms;text-align:center;}
.option-card:hover{border-color:var(--border-2);}
.option-card.selected{border-color:var(--v);background:rgba(124,58,237,0.10);}
.option-emoji{font-size:28px;margin-bottom:10px;}
.option-name{font-size:14px;font-weight:800;margin-bottom:4px;}
.option-desc{font-size:12px;color:var(--text-3);line-height:1.55;}
.option-check{width:20px;height:20px;border-radius:50%;background:var(--v);display:flex;align-items:center;justify-content:center;margin:10px auto 0;}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.check-item{display:flex;gap:12px;padding:14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all 180ms;}
.check-item:hover{border-color:var(--border-2);}
.check-item.selected{border-color:rgba(124,58,237,0.35);background:rgba(124,58,237,0.07);}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 150ms;}
.check-item.selected .check-box{background:var(--v);border-color:var(--v);}
.check-label{font-size:14px;font-weight:600;}
.check-sub{font-size:12px;color:var(--text-3);margin-top:2px;}

/* FIELD */
.field{margin-bottom:16px;}
.label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms;}
.input:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* NAV FOOTER */
.ob-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;}
.steps-dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-2);transition:all 200ms;}
.dot.active{background:var(--v);width:20px;border-radius:999px;}
.dot.done{background:var(--green);}

/* SUCCESS */
@keyframes pop-in{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.success-ring{width:80px;height:80px;border-radius:50%;background:rgba(124,58,237,0.12);border:2px solid var(--v);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:pop-in 600ms var(--ease) both;font-size:32px;}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 450ms var(--ease) both;}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;

const Ic = {
  Check:(p)=><svg {...p} width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Arrow:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  ArrowLeft:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M11 19l-7-7 7-7"/></svg>,
  Dashboard:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
  Search:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  Plus:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
};

const TOTAL_STEPS = 5;

const PROFILES = [
  { id:'solo', emoji:'🧑‍💼', name:'Indépendant / Freelance', desc:'Gérer mes projets perso et automatiser mon activité' },
  { id:'tpe', emoji:'🏢', name:'TPE / PME', desc:'Équipe de moins de 50 personnes' },
  { id:'startup', emoji:'🚀', name:'Startup / Scale-up', desc:'Croissance rapide, besoins tech avancés' },
  { id:'grand', emoji:'🏗️', name:'Grande entreprise', desc:'+500 employés, besoins d\'intégration complexes' },
];

const NEEDS = [
  { id:'chatbot', emoji:'🤖', label:'Créer un chatbot IA', sub:'Service client, support interne, FAQ' },
  { id:'auto', emoji:'⚡', label:'Automatiser des tâches', sub:'Workflows, CRM, email, reporting' },
  { id:'data', emoji:'📊', label:'Analyser mes données', sub:'Dashboards, prédictions, BI' },
  { id:'content', emoji:'✍️', label:'Générer du contenu', sub:'Textes, images, vidéos par IA' },
  { id:'api', emoji:'🔗', label:'Connecter mes outils', sub:'API, intégrations, ERP, CRM' },
  { id:'train', emoji:'🎓', label:'Former mon équipe', sub:'Ateliers, guides, audit IA' },
];

const BUDGETS = [
  { id:'xs', label:'Moins de 500€', desc:'Micro-projet' },
  { id:'sm', label:'500 à 2 000€', desc:'Projet standard' },
  { id:'md', label:'2 000 à 10 000€', desc:'Projet moyen' },
  { id:'lg', label:'Plus de 10 000€', desc:'Projet stratégique' },
];

function App() {
  const [step, setStep] = useState(0);
  const [profile, setProfile] = useState('');
  const [needs, setNeeds] = useState([]);
  const [budget, setBudget] = useState('');
  const [info, setInfo] = useState({ prenom:'', nom:'', company:'' });

  useEffect(() => {
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const toggleNeed = id => setNeeds(n => n.includes(id) ? n.filter(x=>x!==id) : [...n, id]);
  const progress = ((step) / TOTAL_STEPS) * 100;

  const canNext = () => {
    if (step === 0) return !!profile;
    if (step === 1) return needs.length > 0;
    if (step === 2) return !!budget;
    if (step === 3) return info.prenom.trim() && info.nom.trim();
    return true;
  };

  const next = () => { if (canNext()) setStep(s => s+1); };
  const back = () => setStep(s => s-1);

  const stepTitles = ['Votre profil','Vos besoins','Votre budget','Vos informations','C\'est parti !'];

  if (step === TOTAL_STEPS) {
    return (
      <div className="onboarding">
        <div className="top-bar">
          <div className="logo">CreatorFlow <em>Market</em></div>
        </div>
        <div className="prog-bar"><div className="prog-fill" style={{width:'100%'}}/></div>
        <div className="ob-content">
          <div className="ob-card fade-up" style={{textAlign:'center'}}>
            <div className="success-ring">🎉</div>
            <div className="ob-title">Bienvenue, <em>{info.prenom}</em> !</div>
            <div className="ob-sub">Votre profil est configuré. Nous avons sélectionné les experts les plus adaptés à vos besoins.</div>
            <div style={{background:'var(--surf)',border:'1px solid var(--border)',borderRadius:'var(--r-lg)',padding:20,marginBottom:24,textAlign:'left'}}>
              <div style={{fontSize:12,color:'var(--text-3)',marginBottom:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em'}}>Votre profil en résumé</div>
              <div style={{display:'grid',gap:8}}>
                {[
                  ['Profil', PROFILES.find(p=>p.id===profile)?.name || ''],
                  ['Besoins', needs.map(n=>NEEDS.find(x=>x.id===n)?.label).join(', ')],
                  ['Budget', BUDGETS.find(b=>b.id===budget)?.label || ''],
                ].map(([k,v]) => (
                  <div key={k} style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
                    <span style={{color:'var(--text-3)'}}>{k}</span>
                    <span style={{fontWeight:600,textAlign:'right',maxWidth:'60%'}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <a href="recherche.html" className="btn btn-primary" style={{justifyContent:'center',padding:'14px 20px',fontSize:15}}>
                <Ic.Search/>Voir les experts recommandés
              </a>
              <a href="nouveau-brief.html" className="btn btn-ghost" style={{justifyContent:'center'}}>
                <Ic.Plus/>Poster mon premier brief
              </a>
              <a href="dashboard-client.html" className="btn btn-ghost" style={{justifyContent:'center',color:'var(--text-3)'}}>
                <Ic.Dashboard/>Aller au dashboard
              </a>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="onboarding">
      <div className="top-bar">
        <div className="logo">CreatorFlow <em>Market</em></div>
        <a href="dashboard-client.html" className="skip">Passer →</a>
      </div>
      <div className="prog-bar"><div className="prog-fill" style={{width:`${progress}%`}}/></div>

      <div className="ob-content">
        <div className="ob-card fade-up" key={step}>
          <div className="step-tag">Étape {step+1} sur {TOTAL_STEPS}</div>

          {step === 0 && (
            <>
              <div className="ob-title">Vous êtes <em>qui</em> ?</div>
              <div className="ob-sub">Cela nous aide à personnaliser votre expérience et à recommander les bons experts.</div>
              <div className="option-grid option-grid-2">
                {PROFILES.map(p=>(
                  <div key={p.id} className={`option-card ${profile===p.id?'selected':''}`} onClick={()=>setProfile(p.id)}>
                    <div className="option-emoji">{p.emoji}</div>
                    <div className="option-name">{p.name}</div>
                    <div className="option-desc">{p.desc}</div>
                    {profile===p.id && <div className="option-check"><Ic.Check style={{color:'#fff'}}/></div>}
                  </div>
                ))}
              </div>
            </>
          )}

          {step === 1 && (
            <>
              <div className="ob-title">Quels sont vos <em>besoins</em> ?</div>
              <div className="ob-sub">Sélectionnez tout ce qui vous intéresse. Vous pouvez choisir plusieurs options.</div>
              <div className="option-grid option-grid-2">
                {NEEDS.map(n=>(
                  <div key={n.id} className={`option-card ${needs.includes(n.id)?'selected':''}`} onClick={()=>toggleNeed(n.id)}>
                    <div className="option-emoji">{n.emoji}</div>
                    <div className="option-name">{n.label}</div>
                    <div className="option-desc">{n.sub}</div>
                    {needs.includes(n.id) && <div className="option-check"><Ic.Check style={{color:'#fff'}}/></div>}
                  </div>
                ))}
              </div>
            </>
          )}

          {step === 2 && (
            <>
              <div className="ob-title">Quel est votre <em>budget</em> ?</div>
              <div className="ob-sub">Une estimation suffit. Cela aide les experts à vous faire des propositions adaptées.</div>
              <div className="checklist">
                {BUDGETS.map(b=>(
                  <div key={b.id} className={`check-item ${budget===b.id?'selected':''}`} onClick={()=>setBudget(b.id)}>
                    <div className="check-box">{budget===b.id && <Ic.Check style={{color:'#fff'}}/>}</div>
                    <div>
                      <div className="check-label">{b.label}</div>
                      <div className="check-sub">{b.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          {step === 3 && (
            <>
              <div className="ob-title">Dernière étape !</div>
              <div className="ob-sub">Quelques informations pour personnaliser votre espace.</div>
              <div className="input-grid" style={{marginBottom:16}}>
                <div className="field" style={{marginBottom:0}}>
                  <label className="label">Prénom</label>
                  <input className="input" placeholder="Thomas" value={info.prenom} onChange={e=>setInfo(i=>({...i,prenom:e.target.value}))}/>
                </div>
                <div className="field" style={{marginBottom:0}}>
                  <label className="label">Nom</label>
                  <input className="input" placeholder="Richard" value={info.nom} onChange={e=>setInfo(i=>({...i,nom:e.target.value}))}/>
                </div>
              </div>
              <div className="field">
                <label className="label">Entreprise <span style={{color:'var(--text-3)',fontWeight:400}}>(optionnel)</span></label>
                <input className="input" placeholder="Votre entreprise" value={info.company} onChange={e=>setInfo(i=>({...i,company:e.target.value}))}/>
              </div>
              <div style={{padding:14,background:'rgba(16,185,129,0.07)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:'var(--r)',fontSize:13,color:'var(--text-2)',display:'flex',gap:8}}>
                <span style={{fontSize:16}}>🔒</span>
                Vos informations ne sont jamais partagées avec les experts sans votre accord.
              </div>
            </>
          )}

          {step === 4 && (
            <>
              <div className="ob-title">Prêt à <em>démarrer</em> ?</div>
              <div className="ob-sub">Voici ce que vous pouvez faire dès maintenant sur CreatorFlow Market.</div>
              <div className="checklist" style={{marginBottom:28}}>
                {[
                  {emoji:'🎯', label:'Poster votre premier brief', sub:'Décrivez votre projet, les experts postulent'},
                  {emoji:'🔍', label:'Parcourir les experts', sub:'Filtrez par spécialité, note et budget'},
                  {emoji:'💬', label:'Contacter directement', sub:'Échangez avant de vous engager'},
                  {emoji:'🛡️', label:'Paiement sécurisé', sub:'Libéré uniquement quand vous validez'},
                ].map((item,i)=>(
                  <div key={i} className="check-item selected" style={{cursor:'default'}}>
                    <span style={{fontSize:20}}>{item.emoji}</span>
                    <div>
                      <div className="check-label">{item.label}</div>
                      <div className="check-sub">{item.sub}</div>
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}

          <div className="ob-footer">
            <div className="steps-dots">
              {Array.from({length:TOTAL_STEPS},(_,i)=>(
                <div key={i} className={`dot ${i===step?'active':i<step?'done':''}`}/>
              ))}
            </div>
            <div style={{display:'flex',gap:10}}>
              {step > 0 && <button className="btn btn-ghost" style={{padding:'9px 16px',fontSize:13}} onClick={back}><Ic.ArrowLeft/>Retour</button>}
              <button className="btn btn-primary" style={{padding:'9px 20px',fontSize:13,opacity:canNext()?1:0.5}} onClick={next}>
                {step === TOTAL_STEPS-1 ? 'Commencer' : 'Continuer'} <Ic.Arrow/>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
