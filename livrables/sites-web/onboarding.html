  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--orange:#F59E0B;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-primary:disabled{opacity:0.45;transform:none;cursor:not-allowed;}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}

/* LAYOUT */
.onboarding{flex:1;display:flex;flex-direction:column;}
.top-bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--border);}
.logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.skip{font-size:13px;color:var(--text-3);transition:color 150ms;}
.skip:hover{color:var(--text-2);}

/* PROGRESS */
.prog-bar{height:3px;background:var(--border);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--v),var(--c));transition:width 500ms var(--ease);}

/* CONTENT */
.ob-content{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
.ob-card{width:100%;max-width:560px;}
.step-tag{font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.08em;}
.ob-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;line-height:1.2;}
.ob-title em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.ob-sub{font-size:14px;color:var(--text-2);margin-bottom:32px;line-height:1.65;}

/* OPTION CARDS */
.option-grid{display:grid;gap:12px;margin-bottom:28px;}
.option-grid-2{grid-template-columns:1fr 1fr;}
.option-card{background:var(--surf);border:2px solid var(--border);border-radius:var(--r-lg);padding:20px;cursor:pointer;transition:all 200ms;text-align:center;}
.option-card:hover{border-color:var(--border-2);}
.option-card.selected{border-color:var(--v);background:rgba(124,58,237,0.10);}
.option-emoji{font-size:28px;margin-bottom:10px;}
.option-name{font-size:14px;font-weight:800;margin-bottom:4px;}
.option-desc{font-size:12px;color:var(--text-3);line-height:1.55;}
.option-check{width:20px;height:20px;border-radius:50%;background:var(--v);display:flex;align-items:center;justify-content:center;margin:10px auto 0;}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
.check-item{display:flex;gap:12px;padding:14px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all 180ms;}
.check-item:hover{border-color:var(--border-2);}
.check-item.selected{border-color:rgba(124,58,237,0.35);background:rgba(124,58,237,0.07);}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 150px;}
.check-item.selected .check-box{background:var(--v);border-color:var(--v);}
.check-label{font-size:14px;font-weight:600;}
.check-sub{font-size:12px;color:var(--text-3);margin-top:2px;}

/* CHIPS (expert) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border-2);font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 200ms;}
.chip:hover{border-color:var(--vs);color:var(--vs);}
.chip.selected{border-color:var(--v);color:var(--vs);background:rgba(124,58,237,0.1);}

/* FIELD */
.field{margin-bottom:16px;}
.label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms;}
.input:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.input::placeholder{color:var(--text-3);}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
textarea.input{resize:vertical;min-height:80px;line-height:1.5;}
select.input{appearance:none;cursor:pointer;}

/* NAV FOOTER */
.ob-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;}
.steps-dots{display:flex;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border-2);transition:all 200ms;}
.dot.active{background:var(--v);width:20px;border-radius:999px;}
.dot.done{background:var(--green);}

/* SUCCESS */
@keyframes pop-in{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.success-ring{width:80px;height:80px;border-radius:50%;background:rgba(124,58,237,0.12);border:2px solid var(--v);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;animation:pop-in 600ms var(--ease) both;font-size:32px;}

@keyframes fade-up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 450ms var(--ease) both;}

/* LOADER */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:36px;height:36px;border:3px solid var(--border-2);border-top-color:var(--v);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
  </style>
