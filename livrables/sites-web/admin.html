  <link rel="stylesheet" href="design-system.css">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--sidebar:240px;--nav:60px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 20px 0 0;}
.nav-brand{width:var(--sidebar);flex-shrink:0;display:flex;align-items:center;padding:0 20px;gap:10px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.admin-badge{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:rgba(239,68,68,0.15);color:var(--red);border:1px solid rgba(239,68,68,0.25);padding:2px 8px;border-radius:99px;}
.nav-right{display:flex;align-items:center;gap:12px;}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);cursor:pointer;transition:all 180ms;}
.user-chip:hover{border-color:var(--border-3);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;}

/* SIDEBAR */
.sidebar{position:fixed;top:var(--nav);left:0;bottom:0;width:var(--sidebar);background:var(--surf);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;overflow-y:auto;}
.sidebar-section{padding:16px 12px 8px;}
.sidebar-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-3);padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all 160ms;position:relative;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(124,58,237,0.12);color:var(--vs);}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--v);}
.nav-item svg{opacity:0.7;flex-shrink:0;}
.nav-item.active svg{opacity:1;}
.sidebar-bottom{margin-top:auto;padding:16px 12px;border-top:1px solid var(--border);}

/* MAIN */
.main{margin-left:var(--sidebar);padding-top:var(--nav);min-height:100vh;}
.main-inner{padding:32px 32px 80px;}

/* PAGE HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;}
.page-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
.page-sub{font-size:14px;color:var(--text-2);}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden;transition:border-color 180ms;}
.stat-card:hover{border-color:var(--border-2);}
.stat-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;font-size:18px;}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-0.04em;line-height:1;margin-bottom:4px;}
.stat-label{font-size:12px;color:var(--text-3);font-weight:500;}

/* SECTION CARD */
.section-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.section-title{font-size:14px;font-weight:700;}
.section-count{font-size:12px;color:var(--text-3);background:var(--surf-2);padding:2px 9px;border-radius:99px;border:1px solid var(--border);}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;}
.data-table th{font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-3);padding:12px 20px;text-align:left;border-bottom:1px solid var(--border);}
.data-table td{font-size:13px;padding:14px 20px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:rgba(255,255,255,0.015);}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-amber{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-purple{background:rgba(124,58,237,0.12);color:var(--vs);border:1px solid rgba(124,58,237,0.2);}
.badge-blue{background:rgba(6,182,212,0.10);color:var(--c);border:1px solid rgba(6,182,212,0.2);}
.badge-red{background:rgba(239,68,68,0.10);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.badge-gray{background:rgba(255,255,255,0.05);color:var(--text-3);border:1px solid var(--border);}

/* USER ROW */
.user-row-info{display:flex;align-items:center;gap:10px;}
.mini-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.user-row-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:1px;}
.user-row-email{font-size:11px;color:var(--text-3);}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

/* AMOUNT */
.amount{font-size:13px;font-weight:700;color:var(--text);}

/* EMPTY */
.empty-state{padding:48px 20px;text-align:center;color:var(--text-3);}
.empty-icon{font-size:32px;margin-bottom:12px;}
.empty-text{font-size:13px;}

/* SPINNER */
.spin{width:20px;height:20px;border:2px solid var(--border-2);border-top-color:var(--vs);border-radius:50%;animation:spin 0.7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ACCESS DENIED */
.access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;text-align:center;padding:32px;}
.access-denied h1{font-size:28px;font-weight:800;}
.access-denied p{font-size:14px;color:var(--text-2);}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;}
.btn-primary:hover{transform:translateY(-1px);}

/* ACTION BUTTONS */
.btn-approve{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.3);cursor:pointer;transition:all 160ms;}
.btn-approve:hover{background:rgba(16,185,129,0.25);}
.btn-reject{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(239,68,68,0.10);color:var(--red);border:1px solid rgba(239,68,68,0.25);cursor:pointer;transition:all 160ms;margin-left:6px;}
.btn-reject:hover{background:rgba(239,68,68,0.2);}
.btn-save{padding:8px 20px;border-radius:99px;font-size:12px;font-weight:700;background:linear-gradient(135deg,#9333EA,var(--v));color:#fff;border:none;cursor:pointer;transition:all 160ms;}
.btn-save:hover{opacity:0.88;}
.btn-save:disabled{opacity:0.4;cursor:not-allowed;}

/* NAV BADGE */
.nav-pending{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;min-width:16px;text-align:center;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);width:100%;max-width:560px;max-height:85vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-title{font-size:16px;font-weight:800;}
.modal-close{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,0.05);border:1px solid var(--border);cursor:pointer;color:var(--text-2);font-size:16px;}
.modal-close:hover{background:rgba(255,255,255,0.10);color:var(--text);}
.modal-body{padding:20px 24px;}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.modal-row:last-child{border:none;}
.modal-label{font-size:12px;color:var(--text-3);font-weight:500;}
.modal-val{font-size:13px;font-weight:600;color:var(--text);text-align:right;max-width:280px;}
.modal-section{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-3);margin:16px 0 8px;}
.status-select{background:var(--surf-2);border:1px solid var(--border-2);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;}

/* CLICKABLE ROW */
.data-table tr.clickable{cursor:pointer;}
.data-table tr.clickable:hover td{background:rgba(124,58,237,0.06);}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform 0.3s var(--ease);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
}
