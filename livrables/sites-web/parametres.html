<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Paramètres — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#13132A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--orange:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,4,10,0.85);backdrop-filter:blur(18px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-danger{background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.25);color:var(--red);}
.btn-danger:hover{background:rgba(239,68,68,0.18);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}}
.shake{animation:shake 350ms ease;}
@keyframes saved-pop{0%{transform:scale(0.8);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.saved-chip{animation:saved-pop 300ms var(--ease) both;}

/* PAGE */
.page{padding-top:64px;min-height:100vh;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 24px 60px;gap:24px;}

/* SIDEBAR NAV */
.side-nav{width:220px;flex-shrink:0;}
.side-nav-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;padding:0 12px;margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;transition:all 160ms;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text-2);}
.nav-item.active{background:rgba(124,58,237,0.12);color:var(--vs);}
.nav-item-icon{width:30px;height:30px;border-radius:8px;background:var(--surf-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-item.active .nav-item-icon{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.3);}
.nav-divider{height:1px;background:var(--border);margin:12px 0;}

/* CONTENT */
.content{flex:1;min-width:0;}

/* SECTION */
.section{margin-bottom:24px;}
.section-title{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em;}
.section-sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}

/* CARD */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px;}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}

/* FORM */
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms,box-shadow 180ms;}
.input:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.input:disabled{opacity:0.5;cursor:not-allowed;}
.input.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,0.10);}
.error-msg{font-size:12px;color:var(--red);margin-top:5px;}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.hint{font-size:12px;color:var(--text-3);margin-top:5px;}
.save-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}

/* AVATAR */
.avatar-row{display:flex;align-items:center;gap:20px;padding:20px;background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;}
.avatar-big{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0;}
.avatar-info{flex:1;}
.avatar-name{font-size:15px;font-weight:700;margin-bottom:2px;}
.avatar-email{font-size:13px;color:var(--text-3);}
.avatar-actions{display:flex;gap:8px;}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border:none;padding-bottom:0;}
.toggle-info{flex:1;}
.toggle-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.toggle-desc{font-size:12px;color:var(--text-3);}
.toggle{width:44px;height:24px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:999px;position:relative;cursor:pointer;transition:background 200ms,border-color 200ms;}
.toggle.on{background:var(--v);border-color:var(--v);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform 200ms;}
.toggle.on .toggle-knob{transform:translateX(20px);}

/* PLAN CARD */
.plan-card{background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(6,182,212,0.08));border:1px solid rgba(124,58,237,0.25);border-radius:var(--r-lg);padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.plan-badge{padding:4px 12px;background:linear-gradient(135deg,var(--v),var(--c));border-radius:999px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.plan-info{flex:1;}
.plan-name{font-size:15px;font-weight:800;margin-bottom:2px;}
.plan-desc{font-size:13px;color:var(--text-2);}

/* PAYMENT METHODS */
.pm-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.pm-row:last-child{border:none;padding-bottom:0;}
.pm-icon{width:44px;height:28px;border:1px solid var(--border-2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.pm-info{flex:1;}
.pm-name{font-size:13px;font-weight:600;}
.pm-sub{font-size:12px;color:var(--text-3);}
.pm-badge{padding:3px 8px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.2);border-radius:999px;font-size:11px;font-weight:600;color:var(--green);}

/* DANGER ZONE */
.danger-card{background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.15);border-radius:var(--r-lg);padding:22px;}
.danger-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(239,68,68,0.10);}
.danger-row:last-child{border:none;padding-bottom:0;}
.danger-label{font-size:14px;font-weight:600;color:var(--red);margin-bottom:2px;}
.danger-desc{font-size:12px;color:var(--text-3);}

/* SAVED TOAST */
.toast{position:fixed;bottom:28px;right:28px;padding:12px 20px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);border-radius:999px;font-size:13px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:8px;z-index:999;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 350ms var(--ease) both;}
@keyframes toast-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes toast-out{from{opacity:1;}to{opacity:0;}}
  </style>
