<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Paramètres — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#13132A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--orange:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,4,10,0.85);backdrop-filter:blur(18px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-danger{background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.25);color:var(--red);}
.btn-danger:hover{background:rgba(239,68,68,0.18);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}}
.shake{animation:shake 350ms ease;}
@keyframes saved-pop{0%{transform:scale(0.8);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.saved-chip{animation:saved-pop 300ms var(--ease) both;}

/* PAGE */
.page{padding-top:64px;min-height:100vh;}
.layout{display:flex;max-width:1100px;margin:0 auto;padding:28px 24px 60px;gap:24px;}

/* SIDEBAR NAV */
.side-nav{width:220px;flex-shrink:0;}
.side-nav-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;padding:0 12px;margin-bottom:8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;transition:all 160ms;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text-2);}
.nav-item.active{background:rgba(124,58,237,0.12);color:var(--vs);}
.nav-item-icon{width:30px;height:30px;border-radius:8px;background:var(--surf-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-item.active .nav-item-icon{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.3);}
.nav-divider{height:1px;background:var(--border);margin:12px 0;}

/* CONTENT */
.content{flex:1;min-width:0;}

/* SECTION */
.section{margin-bottom:24px;}
.section-title{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em;}
.section-sub{font-size:13px;color:var(--text-2);margin-bottom:24px;}

/* CARD */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px;}
.card-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}

/* FORM */
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms,box-shadow 180ms;}
.input:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.input:disabled{opacity:0.5;cursor:not-allowed;}
.input.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(239,68,68,0.10);}
.error-msg{font-size:12px;color:var(--red);margin-top:5px;}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.hint{font-size:12px;color:var(--text-3);margin-top:5px;}
.save-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}

/* AVATAR */
.avatar-row{display:flex;align-items:center;gap:20px;padding:20px;background:var(--surf-2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;}
.avatar-big{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0;}
.avatar-info{flex:1;}
.avatar-name{font-size:15px;font-weight:700;margin-bottom:2px;}
.avatar-email{font-size:13px;color:var(--text-3);}
.avatar-actions{display:flex;gap:8px;}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border:none;padding-bottom:0;}
.toggle-info{flex:1;}
.toggle-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.toggle-desc{font-size:12px;color:var(--text-3);}
.toggle{width:44px;height:24px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:999px;position:relative;cursor:pointer;transition:background 200ms,border-color 200ms;}
.toggle.on{background:var(--v);border-color:var(--v);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform 200ms;}
.toggle.on .toggle-knob{transform:translateX(20px);}

/* PLAN CARD */
.plan-card{background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(6,182,212,0.08));border:1px solid rgba(124,58,237,0.25);border-radius:var(--r-lg);padding:22px;display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.plan-badge{padding:4px 12px;background:linear-gradient(135deg,var(--v),var(--c));border-radius:999px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.plan-info{flex:1;}
.plan-name{font-size:15px;font-weight:800;margin-bottom:2px;}
.plan-desc{font-size:13px;color:var(--text-2);}

/* PAYMENT METHODS */
.pm-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.pm-row:last-child{border:none;padding-bottom:0;}
.pm-icon{width:44px;height:28px;border:1px solid var(--border-2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.pm-info{flex:1;}
.pm-name{font-size:13px;font-weight:600;}
.pm-sub{font-size:12px;color:var(--text-3);}
.pm-badge{padding:3px 8px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.2);border-radius:999px;font-size:11px;font-weight:600;color:var(--green);}

/* DANGER ZONE */
.danger-card{background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.15);border-radius:var(--r-lg);padding:22px;}
.danger-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(239,68,68,0.10);}
.danger-row:last-child{border:none;padding-bottom:0;}
.danger-label{font-size:14px;font-weight:600;color:var(--red);margin-bottom:2px;}
.danger-desc{font-size:12px;color:var(--text-3);}

/* SAVED TOAST */
.toast{position:fixed;bottom:28px;right:28px;padding:12px 20px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);border-radius:999px;font-size:13px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:8px;z-index:999;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 350ms var(--ease) both;}
@keyframes toast-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes toast-out{from{opacity:1;}to{opacity:0;}}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Ic = {
  User:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
  Shield:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  CreditCard:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
  Bell:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
  Globe:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
  Trash:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
  Check:(p)=><svg {...p} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  Edit:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  Eye:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  EyeOff:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
  Plus:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  LogOut:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
};

const NAV_ITEMS = [
  { id:'profil', label:'Profil', icon:<Ic.User/> },
  { id:'securite', label:'Sécurité', icon:<Ic.Shield/> },
  { id:'facturation', label:'Facturation', icon:<Ic.CreditCard/> },
  { id:'notifications', label:'Notifications', icon:<Ic.Bell/> },
  { id:'preferences', label:'Préférences', icon:<Ic.Globe/> },
];

function Toggle({ on, onChange }) {
  return (
    <div className={`toggle ${on ? 'on' : ''}`} onClick={onChange}>
      <div className="toggle-knob"/>
    </div>
  );
}

function App() {
  const [section, setSection] = useState('profil');
  const [toast, setToast] = useState(false);
  const [showPass, setShowPass] = useState(false);
  const toastTimer = useRef(null);

  // Profil state
  const [profil, setProfil] = useState({ prenom:'Thomas', nom:'Richard', email:'thomas.richard@exemple.fr', phone:'06 12 34 56 78', company:'Richard Consulting', bio:'' });

  // Securite state
  const [currentPass, setCurrentPass] = useState('');
  const [newPass, setNewPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [passError, setPassError] = useState('');

  // Notifs state
  const [notifSettings, setNotifSettings] = useState({ propositions:true, messages:true, missions:true, payments:true, reminders:true, marketing:false });

  // Prefs state
  const [prefs, setPrefs] = useState({ lang:'fr', currency:'EUR', timezone:'Europe/Paris' });

  useEffect(() => {
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const showToast = () => {
    setToast(true);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(false), 3000);
  };

  const saveProfile = () => showToast();

  const savePassword = () => {
    if (!currentPass) { setPassError('Entrez votre mot de passe actuel'); return; }
    if (newPass.length < 8) { setPassError('Le nouveau mot de passe doit faire au moins 8 caractères'); return; }
    if (newPass !== confirmPass) { setPassError('Les mots de passe ne correspondent pas'); return; }
    setPassError(''); setCurrentPass(''); setNewPass(''); setConfirmPass('');
    showToast();
  };

  return (
    <React.Fragment>
      <nav className="nav">
        <div className="nav-inner">
          <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
          <a href="dashboard-client.html" className="btn btn-ghost" style={{padding:'8px 16px',fontSize:13}}>Dashboard</a>
        </div>
      </nav>

      <div className="page">
        <div className="layout">
          {/* SIDE NAV */}
          <div className="side-nav">
            <div style={{marginBottom:20}}>
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 12px',marginBottom:12}}>
                <div style={{width:36,height:36,borderRadius:'50%',background:'linear-gradient(135deg,var(--v),var(--c))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,color:'#fff',flexShrink:0}}>TR</div>
                <div>
                  <div style={{fontSize:13,fontWeight:700}}>{profil.prenom} {profil.nom}</div>
                  <div style={{fontSize:11,color:'var(--text-3)'}}>Plan Pro</div>
                </div>
              </div>
            </div>
            <div className="side-nav-title">Paramètres</div>
            {NAV_ITEMS.map(item => (
              <div key={item.id} className={`nav-item ${section===item.id?'active':''}`} onClick={()=>setSection(item.id)}>
                <div className="nav-item-icon">{item.icon}</div>
                {item.label}
              </div>
            ))}
            <div className="nav-divider"/>
            <a href="connexion.html" className="nav-item" style={{color:'var(--red)'}}>
              <div className="nav-item-icon" style={{borderColor:'rgba(239,68,68,0.2)',background:'rgba(239,68,68,0.08)'}}><Ic.LogOut style={{color:'var(--red)'}}/></div>
              Se déconnecter
            </a>
          </div>

          {/* CONTENT */}
          <div className="content fade-up">

            {/* ===== PROFIL ===== */}
            {section === 'profil' && (
              <div>
                <div className="section-title">Profil</div>
                <div className="section-sub">Gérez vos informations personnelles et professionnelles.</div>

                <div className="card">
                  <div className="avatar-row">
                    <div className="avatar-big">TR</div>
                    <div className="avatar-info">
                      <div className="avatar-name">{profil.prenom} {profil.nom}</div>
                      <div className="avatar-email">{profil.email}</div>
                    </div>
                    <div className="avatar-actions">
                      <button className="btn btn-ghost" style={{padding:'7px 14px',fontSize:12}}><Ic.Edit/>Changer la photo</button>
                    </div>
                  </div>
                  <div className="input-grid">
                    <div className="field">
                      <label className="label">Prénom</label>
                      <input className="input" value={profil.prenom} onChange={e=>setProfil(p=>({...p,prenom:e.target.value}))}/>
                    </div>
                    <div className="field">
                      <label className="label">Nom</label>
                      <input className="input" value={profil.nom} onChange={e=>setProfil(p=>({...p,nom:e.target.value}))}/>
                    </div>
                  </div>
                  <div className="field">
                    <label className="label">Adresse email</label>
                    <input className="input" type="email" value={profil.email} onChange={e=>setProfil(p=>({...p,email:e.target.value}))}/>
                    <div className="hint">Utilisée pour les notifications et la connexion.</div>
                  </div>
                  <div className="input-grid">
                    <div className="field">
                      <label className="label">Téléphone</label>
                      <input className="input" value={profil.phone} onChange={e=>setProfil(p=>({...p,phone:e.target.value}))}/>
                    </div>
                    <div className="field">
                      <label className="label">Entreprise</label>
                      <input className="input" value={profil.company} onChange={e=>setProfil(p=>({...p,company:e.target.value}))}/>
                    </div>
                  </div>
                  <div className="field">
                    <label className="label">Bio <span style={{color:'var(--text-3)',fontWeight:400}}>(optionnel)</span></label>
                    <textarea className="input" rows={3} placeholder="Décrivez-vous en quelques mots…" value={profil.bio} onChange={e=>setProfil(p=>({...p,bio:e.target.value}))}/>
                  </div>
                  <div className="save-row">
                    <button className="btn btn-ghost" style={{padding:'9px 18px',fontSize:13}}>Annuler</button>
                    <button className="btn btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={saveProfile}><Ic.Check/>Enregistrer</button>
                  </div>
                </div>
              </div>
            )}

            {/* ===== SÉCURITÉ ===== */}
            {section === 'securite' && (
              <div>
                <div className="section-title">Sécurité</div>
                <div className="section-sub">Protégez votre compte avec un mot de passe fort et la double authentification.</div>

                <div className="card">
                  <div className="card-title">Changer le mot de passe</div>
                  <div className="field">
                    <label className="label">Mot de passe actuel</label>
                    <div style={{position:'relative'}}>
                      <input className={`input ${passError && !currentPass ? 'error' : ''}`} type={showPass ? 'text' : 'password'} placeholder="••••••••" value={currentPass} onChange={e=>{setCurrentPass(e.target.value);setPassError('');}} style={{paddingRight:44}}/>
                      <button style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-3)'}} onClick={()=>setShowPass(v=>!v)}>
                        {showPass ? <Ic.EyeOff/> : <Ic.Eye/>}
                      </button>
                    </div>
                  </div>
                  <div className="input-grid">
                    <div className="field">
                      <label className="label">Nouveau mot de passe</label>
                      <input className="input" type="password" placeholder="••••••••" value={newPass} onChange={e=>{setNewPass(e.target.value);setPassError('');}}/>
                      <div className="hint">Minimum 8 caractères</div>
                    </div>
                    <div className="field">
                      <label className="label">Confirmer le mot de passe</label>
                      <input className={`input ${passError && newPass && newPass !== confirmPass ? 'error' : ''}`} type="password" placeholder="••••••••" value={confirmPass} onChange={e=>{setConfirmPass(e.target.value);setPassError('');}}/>
                    </div>
                  </div>
                  {/* Password strength */}
                  {newPass.length > 0 && (
                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:12,color:'var(--text-3)',marginBottom:6}}>Force du mot de passe</div>
                      <div style={{height:4,background:'var(--surf-2)',borderRadius:999,overflow:'hidden'}}>
                        <div style={{height:'100%',borderRadius:999,transition:'width 300ms,background 300ms',
                          width: newPass.length < 6 ? '25%' : newPass.length < 10 ? '55%' : '90%',
                          background: newPass.length < 6 ? 'var(--red)' : newPass.length < 10 ? 'var(--orange)' : 'var(--green)'}}/>
                      </div>
                      <div style={{fontSize:11,color: newPass.length < 6 ? 'var(--red)' : newPass.length < 10 ? 'var(--orange)' : 'var(--green)',marginTop:4}}>
                        {newPass.length < 6 ? 'Faible' : newPass.length < 10 ? 'Moyen' : 'Fort'}
                      </div>
                    </div>
                  )}
                  {passError && <div className="error-msg" style={{marginBottom:12}}>{passError}</div>}
                  <div className="save-row" style={{borderTop:'none',paddingTop:0,marginTop:0}}>
                    <button className="btn btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={savePassword}><Ic.Check/>Mettre à jour</button>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">Double authentification (2FA)</div>
                  <div className="toggle-row">
                    <div className="toggle-info">
                      <div className="toggle-name">Application d'authentification</div>
                      <div className="toggle-desc">Google Authenticator, Authy, etc.</div>
                    </div>
                    <Toggle on={false} onChange={()=>{}}/>
                  </div>
                  <div className="toggle-row">
                    <div className="toggle-info">
                      <div className="toggle-name">SMS de vérification</div>
                      <div className="toggle-desc">Code envoyé à {profil.phone}</div>
                    </div>
                    <Toggle on={true} onChange={()=>{}}/>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title-row">
                    <div className="card-title" style={{margin:0}}>Sessions actives</div>
                    <button style={{fontSize:12,color:'var(--red)',padding:'4px 10px',border:'1px solid rgba(239,68,68,0.25)',borderRadius:999}}>Tout déconnecter</button>
                  </div>
                  {[
                    { device:'Chrome sur Windows 11', location:'Paris, France', current:true, time:'Maintenant' },
                    { device:'Safari sur iPhone 15', location:'Paris, France', current:false, time:'Il y a 2h' },
                    { device:'Firefox sur macOS', location:'Lyon, France', current:false, time:'Il y a 3 jours' },
                  ].map((s,i) => (
                    <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:i<2?'1px solid var(--border)':'none'}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8}}>
                          {s.device}
                          {s.current && <span style={{padding:'2px 8px',background:'rgba(16,185,129,0.12)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:999,fontSize:11,fontWeight:700,color:'var(--green)'}}>Actuelle</span>}
                        </div>
                        <div style={{fontSize:12,color:'var(--text-3)',marginTop:2}}>{s.location} · {s.time}</div>
                      </div>
                      {!s.current && <button style={{fontSize:12,color:'var(--text-3)',padding:'4px 10px',border:'1px solid var(--border-2)',borderRadius:999,transition:'color 150ms'}} onMouseEnter={e=>e.currentTarget.style.color='var(--red)'} onMouseLeave={e=>e.currentTarget.style.color='var(--text-3)'}>Révoquer</button>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ===== FACTURATION ===== */}
            {section === 'facturation' && (
              <div>
                <div className="section-title">Facturation</div>
                <div className="section-sub">Gérez votre abonnement, vos moyens de paiement et vos factures.</div>

                <div className="plan-card">
                  <span className="plan-badge">Plan Pro</span>
                  <div className="plan-info">
                    <div className="plan-name">CreatorFlow Market Pro</div>
                    <div className="plan-desc">49€/mois · Renouvellement le 26 juin 2026</div>
                  </div>
                  <button className="btn btn-ghost" style={{padding:'8px 16px',fontSize:13}}>Changer de plan</button>
                </div>

                <div className="card">
                  <div className="card-title-row">
                    <div className="card-title" style={{margin:0}}>Moyens de paiement</div>
                    <button className="btn btn-ghost" style={{padding:'6px 12px',fontSize:12}}><Ic.Plus/>Ajouter</button>
                  </div>
                  {[
                    { brand:'VISA', number:'•••• •••• •••• 4242', exp:'12/27', primary:true },
                    { brand:'MC', number:'•••• •••• •••• 5555', exp:'08/26', primary:false },
                  ].map((pm,i) => (
                    <div key={i} className="pm-row">
                      <div className="pm-icon" style={{background: pm.brand==='VISA' ? 'rgba(66,133,244,0.1)' : 'rgba(235,0,27,0.08)'}}>{pm.brand}</div>
                      <div className="pm-info">
                        <div className="pm-name">{pm.number}</div>
                        <div className="pm-sub">Expire {pm.exp}</div>
                      </div>
                      {pm.primary && <span className="pm-badge">Principal</span>}
                      {!pm.primary && <button style={{fontSize:12,color:'var(--text-3)',padding:'4px 10px',border:'1px solid var(--border-2)',borderRadius:999}}>Définir principal</button>}
                    </div>
                  ))}
                </div>

                <div className="card">
                  <div className="card-title">Informations de facturation</div>
                  <div className="input-grid">
                    <div className="field">
                      <label className="label">Nom / Raison sociale</label>
                      <input className="input" defaultValue="Richard Consulting"/>
                    </div>
                    <div className="field">
                      <label className="label">Numéro de TVA</label>
                      <input className="input" placeholder="FR00000000000"/>
                    </div>
                  </div>
                  <div className="field">
                    <label className="label">Adresse de facturation</label>
                    <input className="input" defaultValue="12 Rue de la Paix, 75001 Paris"/>
                  </div>
                  <div className="save-row">
                    <button className="btn btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={saveProfile}><Ic.Check/>Enregistrer</button>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title-row">
                    <div className="card-title" style={{margin:0}}>Historique des factures</div>
                  </div>
                  {[
                    { ref:'FAC-0049', date:'26 mai 2026', amount:'49€', status:'Payée' },
                    { ref:'FAC-0041', date:'26 avr. 2026', amount:'49€', status:'Payée' },
                    { ref:'FAC-0033', date:'26 mar. 2026', amount:'49€', status:'Payée' },
                  ].map((f,i) => (
                    <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:i<2?'1px solid var(--border)':'none'}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{f.ref}</div>
                        <div style={{fontSize:12,color:'var(--text-3)'}}>{f.date}</div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <span style={{fontSize:13,fontWeight:700}}>{f.amount}</span>
                        <span style={{padding:'3px 10px',background:'rgba(16,185,129,0.10)',border:'1px solid rgba(16,185,129,0.2)',borderRadius:999,fontSize:11,fontWeight:600,color:'var(--green)'}}>{f.status}</span>
                        <button style={{fontSize:12,color:'var(--vs)',padding:'4px 10px',border:'1px solid rgba(124,58,237,0.25)',borderRadius:999}}>Télécharger</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ===== NOTIFICATIONS ===== */}
            {section === 'notifications' && (
              <div>
                <div className="section-title">Notifications</div>
                <div className="section-sub">Choisissez comment et quand vous souhaitez être alerté.</div>
                {['Email','Push'].map(channel => (
                  <div key={channel} className="card">
                    <div className="card-title">Notifications {channel}</div>
                    {Object.entries({
                      propositions:'Nouvelles propositions d\'experts',
                      messages:'Nouveaux messages',
                      missions:'Mises à jour de missions',
                      payments:'Confirmations de paiement',
                      reminders:'Rappels et délais',
                      marketing:'Newsletters et promotions',
                    }).map(([key, label]) => (
                      <div key={key} className="toggle-row">
                        <div className="toggle-info">
                          <div className="toggle-name">{label}</div>
                        </div>
                        <Toggle on={notifSettings[key]} onChange={()=>setNotifSettings(s=>({...s,[key]:!s[key]}))}/>
                      </div>
                    ))}
                  </div>
                ))}
                <button className="btn btn-primary" style={{padding:'9px 20px',fontSize:13}} onClick={saveProfile}><Ic.Check/>Enregistrer les préférences</button>
              </div>
            )}

            {/* ===== PRÉFÉRENCES ===== */}
            {section === 'preferences' && (
              <div>
                <div className="section-title">Préférences</div>
                <div className="section-sub">Personnalisez votre expérience sur la plateforme.</div>
                <div className="card">
                  <div className="card-title">Langue & Région</div>
                  <div className="input-grid" style={{marginBottom:16}}>
                    <div className="field">
                      <label className="label">Langue</label>
                      <select className="input" value={prefs.lang} onChange={e=>setPrefs(p=>({...p,lang:e.target.value}))}>
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                      </select>
                    </div>
                    <div className="field">
                      <label className="label">Devise</label>
                      <select className="input" value={prefs.currency} onChange={e=>setPrefs(p=>({...p,currency:e.target.value}))}>
                        <option value="EUR">EUR (€)</option>
                        <option value="USD">USD ($)</option>
                        <option value="GBP">GBP (£)</option>
                      </select>
                    </div>
                  </div>
                  <div className="field">
                    <label className="label">Fuseau horaire</label>
                    <select className="input" value={prefs.timezone} onChange={e=>setPrefs(p=>({...p,timezone:e.target.value}))}>
                      <option value="Europe/Paris">Europe/Paris (UTC+2)</option>
                      <option value="America/New_York">America/New_York (UTC-4)</option>
                      <option value="America/Montreal">America/Montreal (UTC-4)</option>
                      <option value="Asia/Tokyo">Asia/Tokyo (UTC+9)</option>
                    </select>
                  </div>
                  <div className="save-row">
                    <button className="btn btn-primary" style={{padding:'9px 18px',fontSize:13}} onClick={saveProfile}><Ic.Check/>Enregistrer</button>
                  </div>
                </div>

                <div className="danger-card">
                  <div className="card-title" style={{color:'var(--red)',marginBottom:16}}>Zone de danger</div>
                  <div className="danger-row">
                    <div>
                      <div className="danger-label">Exporter mes données</div>
                      <div className="danger-desc">Téléchargez une copie de toutes vos données personnelles.</div>
                    </div>
                    <button className="btn btn-ghost" style={{padding:'7px 14px',fontSize:12,flexShrink:0}}>Exporter</button>
                  </div>
                  <div className="danger-row">
                    <div>
                      <div className="danger-label">Supprimer mon compte</div>
                      <div className="danger-desc">Action irréversible. Toutes vos données seront effacées.</div>
                    </div>
                    <button className="btn btn-danger" style={{padding:'7px 14px',fontSize:12,flexShrink:0}}><Ic.Trash/>Supprimer</button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      </div>

      {/* TOAST */}
      {toast && (
        <div className="toast saved-chip">
          <Ic.Check/>Modifications enregistrées
        </div>
      )}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
