<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Créer un compte — CreatorFlow Market</title>
  <meta name="description" content="Rejoignez CreatorFlow Market : créez votre compte expert IA ou client en 2 minutes. Accès gratuit à la marketplace d'experts IA certifiés."/>
  <link rel="canonical" href="https://creatorflowmarket.com/inscription.html"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://creatorflowmarket.com/inscription.html"/>
  <meta property="og:title" content="Rejoindre CreatorFlow Market — Experts IA & Entreprises"/>
  <meta property="og:description" content="Créez votre compte expert ou client en 2 minutes. Accès immédiat à la marketplace IA #1 au Canada."/>
  <meta property="og:site_name" content="CreatorFlow Market"/>
  <meta property="og:locale" content="fr_CA"/>
  <meta property="og:image" content="https://creatorflowmarket.com/og-image.jpg"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:image" content="https://creatorflowmarket.com/og-image.jpg"/>
  <meta name="robots" content="index, follow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;background:rgba(4,4,10,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);transition:all 180ms ease;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:8px 16px;font-size:13px;}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}

.page-layout{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;}

/* LEFT — benefits */
.insc-left{padding:100px 60px 60px;background:linear-gradient(160deg,rgba(124,58,237,0.08),transparent 60%);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;}
.insc-left h1{font-size:clamp(32px,3.5vw,48px);font-weight:800;letter-spacing:-0.03em;margin:16px 0 14px;line-height:1.1;}
.insc-left h1 em{background:linear-gradient(135deg,#C084FC,var(--v),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;}
.insc-left p{font-size:16px;color:var(--text-2);max-width:420px;margin-bottom:40px;}
.benefit-list{display:flex;flex-direction:column;gap:18px;}
.benefit{display:flex;gap:14px;align-items:flex-start;}
.benefit-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08));border:1px solid rgba(124,58,237,0.25);color:var(--vs);}
.benefit b{display:block;font-size:14px;font-weight:700;margin-bottom:3px;}
.benefit span{font-size:13px;color:var(--text-3);}
.social-proof{margin-top:48px;padding:20px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;gap:16px;align-items:center;}
.sp-avts{display:flex;}
.sp-avt{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--bg);margin-left:-10px;}
.sp-avt:first-child{margin-left:0;}
.sp-avt img{width:100%;height:100%;object-fit:cover;}
.sp-text{font-size:13px;color:var(--text-2);}
.sp-text b{color:var(--text);}

/* RIGHT — form */
.insc-right{padding:100px 60px 60px;display:flex;flex-direction:column;justify-content:center;}
.form-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:36px;position:relative;overflow:hidden;}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.form-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.form-sub{font-size:13px;color:var(--text-2);margin-bottom:28px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms ease,box-shadow 180ms ease;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.form-textarea{resize:vertical;min-height:100px;}
.form-select{appearance:none;cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-submit{width:100%;justify-content:center;padding:14px 20px;font-size:15px;margin-top:8px;}
.form-login{text-align:center;margin-top:16px;font-size:13px;color:var(--text-3);}
.form-login a{color:var(--vs);transition:color 160ms;}
.form-login a:hover{color:#fff;}
.success-card{text-align:center;padding:48px 32px;}
.success-icon{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);display:grid;place-items:center;color:var(--green);margin:0 auto 20px;font-size:28px;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}

@media(max-width:980px){.page-layout{grid-template-columns:1fr;}.insc-left{padding:100px 28px 48px;border-right:none;border-bottom:1px solid var(--border);}.insc-right{padding:48px 28px 80px;}.nav-links{display:none;}}
@media(max-width:640px){.wrap{padding:0 18px;}.form-row{grid-template-columns:1fr;}.insc-left{padding:88px 20px 40px;}.insc-right{padding:40px 20px 80px;}}
  </style>
</head>
<body>
<div id="cursor-glow"></div>

<!-- Formulaire statique requis par Netlify pour la détection au build -->
<form name="inscription-expert" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="prenom"/>
  <input type="text" name="nom"/>
  <input type="email" name="email"/>
  <input type="text" name="specialite"/>
  <input type="text" name="niveau"/>
  <input type="url" name="linkedin"/>
  <textarea name="bio"></textarea>
</form>

<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = supabase;
const sb = createClient(
  'https://cjtglfutckaogsmwhfsv.supabase.co',
  'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei'
);

const Ic = {
  Arrow:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  Eye:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  EyeOff:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
  Rocket:(p)=><svg {...p} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>,
  Star:(p)=><svg {...p} width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
  Shield:(p)=><svg {...p} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  Chart:(p)=><svg {...p} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M7 16V12M12 16V8M17 16v-6"/></svg>,
};

const PHOTOS = ['https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=80&h=80&fit=crop&crop=faces&q=80','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=80&h=80&fit=crop&crop=faces&q=80','https://images.unsplash.com/photo-1580489944761-15a19d654956?w=80&h=80&fit=crop&crop=faces&q=80'];

function App() {
  const [tab, setTab] = useState(() => {
    const p = new URLSearchParams(window.location.search).get('role');
    return p === 'client' ? 'client' : 'expert';
  });
  const [done, setDone] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [showPwd, setShowPwd] = useState(false);
  const [form, setForm] = useState({ prenom:'', nom:'', email:'', password:'', specialite:'', niveau:'', linkedin:'', bio:'', entreprise:'' });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  useEffect(() => {
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const handleSubmit = async e => {
    e.preventDefault();
    if (form.password.length < 8) { setError('Le mot de passe doit contenir au moins 8 caractères.'); return; }
    setLoading(true);
    setError('');
    try {
      const { data, error: signUpError } = await sb.auth.signUp({
        email: form.email,
        password: form.password,
        options: { data: { prenom: form.prenom, nom: form.nom, type_utilisateur: tab } }
      });
      if (signUpError) throw signUpError;

      const userId = data.user?.id;
      if (userId) {
        await sb.from('profiles').upsert({
          id: userId,
          prenom: form.prenom,
          nom: form.nom,
          email: form.email,
          type_utilisateur: tab,
          entreprise: tab === 'client' ? (form.entreprise || null) : null,
        }, { onConflict: 'id', ignoreDuplicates: true });
      }
      if (userId && tab === 'expert') {
        await sb.from('experts').insert({
          id: userId,
          specialite: form.specialite,
          niveau: form.niveau,
          linkedin: form.linkedin,
          bio: form.bio,
          competences: form.specialite ? [form.specialite] : [],
          categories: form.specialite ? [form.specialite] : [],
          disponible: true,
          tarif_heure: 0,
        });
      }
      window.location.href = 'onboarding.html';
    } catch(err) {
      const msgs = {
        'User already registered': 'Un compte existe déjà avec cet email.',
        'Password should be at least 6 characters': 'Le mot de passe doit contenir au moins 8 caractères.',
      };
      setError(msgs[err.message] || 'Une erreur est survenue : ' + err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <React.Fragment>
      <nav className="nav"><div className="wrap nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
        <div className="nav-links">
          <a href="experts.html" className="nav-link">Experts</a>
          <a href="brief.html" className="nav-link">Déposer un brief</a>
          <a href="inscription.html" className="nav-link" style={{color:'var(--vs)'}}>Devenir expert</a>
        </div>
        <a href="connexion.html" className="btn btn-ghost btn-sm">Connexion</a>
      </div></nav>

      <div className="page-layout">
        <div className="insc-left">
          <span className="eyebrow">Rejoindre la plateforme</span>
          {tab === 'expert' ? (
            <React.Fragment>
              <h1>Monétisez votre<br/>expertise <em>IA.</em></h1>
              <p>Accédez à des clients qualifiés, gérez vos missions et développez votre réputation sur la seule marketplace dédiée aux experts IA certifiés.</p>
              <div className="benefit-list">
                {[
                  {icon:<Ic.Rocket/>,title:'Missions dès l\'inscription',sub:'Accès immédiat au flux de briefs entrants'},
                  {icon:<Ic.Star/>,title:'Tarif fixé par vous',sub:'Vous choisissez votre taux horaire ou forfait'},
                  {icon:<Ic.Chart/>,title:'Visibilité & croissance',sub:'Profil SEO optimisé, badge certifié affiché'},
                  {icon:<Ic.Shield/>,title:'Paiements sécurisés',sub:'Escrow automatique, paiement à la livraison'},
                ].map((b,i) => (
                  <div key={i} className="benefit">
                    <div className="benefit-icon">{b.icon}</div>
                    <div><b>{b.title}</b><span>{b.sub}</span></div>
                  </div>
                ))}
              </div>
              <div className="social-proof">
                <div className="sp-avts">{PHOTOS.map((p,i)=><div key={i} className="sp-avt"><img src={p} alt=""/></div>)}</div>
                <div className="sp-text"><b>120+ experts</b> ont déjà rejoint la plateforme</div>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <h1>Trouvez l'expert IA<br/>qu'il vous <em>faut.</em></h1>
              <p>Publiez votre besoin, recevez des propositions d'experts certifiés et lancez votre projet en toute sécurité.</p>
              <div className="benefit-list">
                {[
                  {icon:<Ic.Rocket/>,title:'Brief publié en 5 minutes',sub:'Décrivez votre besoin, on fait le reste'},
                  {icon:<Ic.Star/>,title:'Experts certifiés',sub:'Chaque profil est vérifié par notre équipe'},
                  {icon:<Ic.Shield/>,title:'Paiements sécurisés',sub:'Votre budget est libéré à la livraison'},
                  {icon:<Ic.Chart/>,title:'Suivi en temps réel',sub:'Tableau de bord missions dédié'},
                ].map((b,i) => (
                  <div key={i} className="benefit">
                    <div className="benefit-icon">{b.icon}</div>
                    <div><b>{b.title}</b><span>{b.sub}</span></div>
                  </div>
                ))}
              </div>
              <div className="social-proof">
                <div className="sp-avts">{PHOTOS.map((p,i)=><div key={i} className="sp-avt"><img src={p} alt=""/></div>)}</div>
                <div className="sp-text"><b>85+ entreprises</b> ont déjà trouvé leur expert</div>
              </div>
            </React.Fragment>
          )}
        </div>

        <div className="insc-right">
          {!done ? (
            <div className="form-card">
              <div style={{display:'flex',background:'var(--surf-2)',border:'1px solid var(--border)',borderRadius:999,padding:3,marginBottom:22}}>
                <div onClick={()=>setTab('client')} style={{flex:1,padding:'8px 16px',borderRadius:999,fontSize:13,fontWeight:600,textAlign:'center',cursor:'pointer',transition:'all 200ms',background:tab==='client'?'var(--v)':'transparent',color:tab==='client'?'#fff':'var(--text-3)',boxShadow:tab==='client'?'0 0 16px rgba(124,58,237,0.4)':'none'}}>Je suis client</div>
                <div onClick={()=>setTab('expert')} style={{flex:1,padding:'8px 16px',borderRadius:999,fontSize:13,fontWeight:600,textAlign:'center',cursor:'pointer',transition:'all 200ms',background:tab==='expert'?'var(--v)':'transparent',color:tab==='expert'?'#fff':'var(--text-3)',boxShadow:tab==='expert'?'0 0 16px rgba(124,58,237,0.4)':'none'}}>Je suis expert</div>
              </div>
              <h2 className="form-title">{tab === 'client' ? 'Créer mon compte client' : 'Créer mon profil expert'}</h2>
              <p className="form-sub">{tab === 'client' ? 'Gratuit · Accès immédiat à tous les experts' : 'Validation par notre équipe sous 48h · Accès gratuit'}</p>
              <form onSubmit={handleSubmit}>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Prénom *</label>
                    <input className="form-input" type="text" placeholder="Votre prénom" value={form.prenom} onChange={e => set('prenom', e.target.value)} required/>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Nom *</label>
                    <input className="form-input" type="text" placeholder="Votre nom" value={form.nom} onChange={e => set('nom', e.target.value)} required/>
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">Email *</label>
                  <input className="form-input" type="email" placeholder="votre@email.com" value={form.email} onChange={e => set('email', e.target.value)} required/>
                </div>
                <div className="form-group">
                  <label className="form-label">Mot de passe *</label>
                  <div style={{position:'relative'}}>
                    <input className="form-input" type={showPwd ? 'text' : 'password'} placeholder="Minimum 8 caractères" value={form.password} onChange={e => set('password', e.target.value)} required style={{paddingRight:44}}/>
                    <button type="button" onClick={()=>setShowPwd(s=>!s)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-3)',display:'flex',alignItems:'center'}}>
                      {showPwd ? <Ic.EyeOff/> : <Ic.Eye/>}
                    </button>
                  </div>
                </div>
                {tab === 'client' && (
                  <div className="form-group">
                    <label className="form-label">Entreprise</label>
                    <input className="form-input" type="text" placeholder="Nom de votre entreprise (optionnel)" value={form.entreprise} onChange={e => set('entreprise', e.target.value)}/>
                  </div>
                )}
                {tab === 'expert' && (
                  <React.Fragment>
                    <div className="form-row">
                      <div className="form-group">
                        <label className="form-label">Spécialité principale *</label>
                        <select className="form-select" value={form.specialite} onChange={e => set('specialite', e.target.value)} required>
                          <option value="">Choisir...</option>
                          <option>Agents IA</option><option>Automatisation</option><option>Chatbots</option>
                          <option>Développement IA</option><option>Prompt Engineering</option>
                          <option>Montage vidéo IA</option><option>Branding IA</option><option>Formation IA</option>
                        </select>
                      </div>
                      <div className="form-group">
                        <label className="form-label">Niveau d'expérience *</label>
                        <select className="form-select" value={form.niveau} onChange={e => set('niveau', e.target.value)} required>
                          <option value="">Choisir...</option>
                          <option>1-2 ans</option><option>3-5 ans</option><option>5+ ans</option>
                        </select>
                      </div>
                    </div>
                    <div className="form-group">
                      <label className="form-label">LinkedIn ou site web</label>
                      <input className="form-input" type="url" placeholder="https://..." value={form.linkedin} onChange={e => set('linkedin', e.target.value)}/>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Présentez-vous en quelques lignes *</label>
                      <textarea className="form-textarea" placeholder="Votre parcours, vos compétences clés, ce que vous apportez à vos clients..." value={form.bio} onChange={e => set('bio', e.target.value)} required/>
                    </div>
                  </React.Fragment>
                )}
                {error && <div style={{color:'#EF4444',fontSize:13,marginBottom:10,padding:'10px 14px',background:'rgba(239,68,68,0.08)',borderRadius:8,border:'1px solid rgba(239,68,68,0.2)'}}>{error}</div>}
                <button type="submit" className="btn btn-primary form-submit" disabled={loading}>
                  {loading ? 'Création du compte…' : <React.Fragment>{tab === 'client' ? 'Créer mon compte client' : 'Créer mon compte expert'} <Ic.Arrow/></React.Fragment>}
                </button>
                <div className="form-login">Déjà un compte ? <a href="connexion.html">Se connecter</a></div>
              </form>
            </div>
          ) : (
            <div className="form-card success-card">
              <div className="success-icon">✓</div>
              <h2 style={{fontSize:22,fontWeight:800,marginBottom:10}}>Compte créé !</h2>
              <p style={{fontSize:14,color:'var(--text-2)',maxWidth:340,margin:'0 auto 24px'}}>Vérifiez vos emails et cliquez sur le lien de confirmation pour activer votre compte. Notre équipe examine ensuite votre profil sous 48h.</p>
              <a href="connexion.html" className="btn btn-primary" style={{margin:'0 auto'}}>Se connecter</a>
            </div>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
