:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;background:rgba(4,4,10,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);transition:all 180ms ease;}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:8px 16px;font-size:13px;}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--vs);}
.eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}

.page-layout{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;}

/* LEFT — benefits */
.insc-left{padding:100px 60px 60px;background:linear-gradient(160deg,rgba(124,58,237,0.08),transparent 60%);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;}
.insc-left h1{font-size:clamp(32px,3.5vw,48px);font-weight:800;letter-spacing:-0.03em;margin:16px 0 14px;line-height:1.1;}
.insc-left h1 em{background:linear-gradient(135deg,#C084FC,var(--v),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;}
.insc-left p{font-size:16px;color:var(--text-2);max-width:420px;margin-bottom:40px;}
.benefit-list{display:flex;flex-direction:column;gap:18px;}
.benefit{display:flex;gap:14px;align-items:flex-start;}
.benefit-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08));border:1px solid rgba(124,58,237,0.25);color:var(--vs);}
.benefit b{display:block;font-size:14px;font-weight:700;margin-bottom:3px;}
.benefit span{font-size:13px;color:var(--text-3);}
.social-proof{margin-top:48px;padding:20px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;gap:16px;align-items:center;}
.sp-avts{display:flex;}
.sp-avt{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--bg);margin-left:-10px;}
.sp-avt:first-child{margin-left:0;}
.sp-avt img{width:100%;height:100%;object-fit:cover;}
.sp-text{font-size:13px;color:var(--text-2);}
.sp-text b{color:var(--text);}

/* RIGHT — form */
.insc-right{padding:100px 60px 60px;display:flex;flex-direction:column;justify-content:center;}
.form-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:36px;position:relative;overflow:hidden;}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.form-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.form-sub{font-size:13px;color:var(--text-2);margin-bottom:28px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms ease,box-shadow 180ms ease;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.form-textarea{resize:vertical;min-height:100px;}
.form-select{appearance:none;cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-submit{width:100%;justify-content:center;padding:14px 20px;font-size:15px;margin-top:8px;}
.form-login{text-align:center;margin-top:16px;font-size:13px;color:var(--text-3);}
.form-login a{color:var(--vs);transition:color 160ms;}
.form-login a:hover{color:#fff;}
.form-terms{display:flex;align-items:flex-start;gap:10px;padding:14px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;}
.form-terms input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:var(--v);cursor:pointer;}
.form-terms-label{font-size:13px;color:var(--text-2);line-height:1.55;}
.form-terms-label a{color:var(--vs);}
.form-terms-label a:hover{text-decoration:underline;}
.success-card{text-align:center;padding:48px 32px;}
.success-icon{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);display:grid;place-items:center;color:var(--green);margin:0 auto 20px;font-size:28px;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}

@media(max-width:980px){.page-layout{grid-template-columns:1fr;}.insc-left{padding:100px 28px 48px;border-right:none;border-bottom:1px solid var(--border);}.insc-right{padding:48px 28px 80px;}.nav-links{display:none;}}
@media(max-width:640px){.wrap{padding:0 18px;}.form-row{grid-template-columns:1fr;}.insc-left{padding:88px 20px 40px;}.insc-right{padding:40px 20px 80px;}}
