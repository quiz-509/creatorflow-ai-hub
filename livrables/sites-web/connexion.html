<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion — CreatorFlow Market</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-primary:disabled{opacity:0.6;transform:none;cursor:not-allowed;}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}
.login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 20px 40px;position:relative;}
.login-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 700px 500px at 50% 40%,rgba(124,58,237,0.10),transparent 70%);pointer-events:none;}
@keyframes fade-up{from{opacity:0;transform:translateY(24px);filter:blur(4px);}to{opacity:1;transform:none;filter:blur(0);}}
.login-card{width:100%;max-width:420px;position:relative;animation:fade-up 600ms var(--ease) 80ms both;}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo-text{font-size:20px;font-weight:800;letter-spacing:-0.02em;}
.login-logo-text em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.login-logo-sub{font-size:13px;color:var(--text-3);margin-top:4px;}
.form-box{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:36px;position:relative;overflow:hidden;}
.form-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.form-title{font-size:20px;font-weight:800;margin-bottom:4px;}
.form-sub{font-size:13px;color:var(--text-2);margin-bottom:28px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.form-label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.form-label-row a{font-size:12px;color:var(--vs);transition:color 160ms;}
.form-label-row a:hover{color:#fff;}
.form-input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:11px 14px;outline:none;transition:border-color 180ms ease,box-shadow 180ms ease;}
.form-input:focus{border-color:rgba(124,58,237,0.6);box-shadow:0 0 0 3px rgba(124,58,237,0.12);}
.form-submit{width:100%;justify-content:center;padding:14px 20px;font-size:15px;margin-top:4px;}
.form-footer{text-align:center;margin-top:22px;font-size:13px;color:var(--text-3);}
.form-footer a{color:var(--vs);transition:color 160ms;}
.form-footer a:hover{color:#fff;}
.tab-row{display:flex;background:var(--surf-2);border:1px solid var(--border);border-radius:999px;padding:3px;margin-bottom:28px;}
.tab-btn{flex:1;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-3);transition:all 200ms var(--ease);text-align:center;cursor:pointer;}
.tab-btn.active{background:var(--v);color:#fff;box-shadow:0 0 16px var(--vg);}
#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { createClient } = supabase;
const sb = createClient(
  'https://cjtglfutckaogsmwhfsv.supabase.co',
  'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei'
);

const Ic = {
  Arrow:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  Eye:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  EyeOff:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
};

function App() {
  const [tab, setTab] = useState('expert');
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [showPwd, setShowPwd] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [showReset, setShowReset] = useState(false);
  const [resetEmail, setResetEmail] = useState('');
  const [resetSent, setResetSent] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      if (data.session) {
        const { data: profile } = await sb.from('profiles').select('type_utilisateur').eq('id', data.session.user.id).single();
        window.location.href = profile?.type_utilisateur === 'client' ? 'dashboard-client.html' : 'dashboard-expert.html';
      }
    });
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const handleLogin = async e => {
    e.preventDefault();
    setLoading(true);
    setError('');
    try {
      const { data, error: loginError } = await sb.auth.signInWithPassword({ email, password: pass });
      if (loginError) throw loginError;
      const { data: profile } = await sb.from('profiles').select('type_utilisateur').eq('id', data.user.id).single();
      window.location.href = profile?.type_utilisateur === 'client' ? 'dashboard-client.html' : 'dashboard-expert.html';
    } catch(err) {
      const msgs = {
        'Invalid login credentials': 'Email ou mot de passe incorrect.',
        'Email not confirmed': 'Veuillez confirmer votre email avant de vous connecter.',
      };
      setError(msgs[err.message] || 'Erreur : ' + err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleReset = async e => {
    e.preventDefault();
    setLoading(true);
    setError('');
    const { error: resetError } = await sb.auth.resetPasswordForEmail(resetEmail, {
      redirectTo: window.location.origin + '/connexion.html',
    });
    setLoading(false);
    if (!resetError) setResetSent(true);
    else setError('Erreur : ' + resetError.message);
  };

  if (showReset) return (
    <React.Fragment>
      <nav className="nav"><div className="nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
      </div></nav>
      <div className="login-page">
        <div className="login-card">
          <div className="login-logo">
            <div className="login-logo-text">CreatorFlow <em>Market</em></div>
            <div className="login-logo-sub">Réinitialisation du mot de passe</div>
          </div>
          <div className="form-box">
            {!resetSent ? (
              <React.Fragment>
                <h2 className="form-title">Mot de passe oublié</h2>
                <p className="form-sub">Entrez votre email et nous vous enverrons un lien de réinitialisation.</p>
                <form onSubmit={handleReset}>
                  <div className="form-group">
                    <label className="form-label">Adresse email</label>
                    <input className="form-input" type="email" placeholder="votre@email.com" value={resetEmail} onChange={e => setResetEmail(e.target.value)} required/>
                  </div>
                  {error && <div style={{color:'#EF4444',fontSize:13,marginBottom:12,padding:'10px 14px',background:'rgba(239,68,68,0.08)',borderRadius:8}}>{error}</div>}
                  <button type="submit" className="btn btn-primary form-submit" disabled={loading}>{loading ? 'Envoi…' : 'Envoyer le lien'}</button>
                </form>
                <div className="form-footer"><a href="#" onClick={e=>{e.preventDefault();setShowReset(false);}}>Retour à la connexion</a></div>
              </React.Fragment>
            ) : (
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:40,marginBottom:16}}>📧</div>
                <h2 className="form-title">Email envoyé !</h2>
                <p style={{fontSize:14,color:'var(--text-2)',marginTop:8,marginBottom:24}}>Vérifiez votre boîte mail et cliquez sur le lien pour réinitialiser votre mot de passe.</p>
                <a href="connexion.html" className="btn btn-ghost" style={{margin:'0 auto'}}>Retour à la connexion</a>
              </div>
            )}
          </div>
        </div>
      </div>
    </React.Fragment>
  );

  return (
    <React.Fragment>
      <nav className="nav"><div className="nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
        <a href={`inscription.html?role=${tab}`} className="btn btn-ghost" style={{padding:'8px 16px',fontSize:13}}>Créer un compte</a>
      </div></nav>

      <div className="login-page">
        <div className="login-card">
          <div className="login-logo">
            <div className="login-logo-text">CreatorFlow <em>Market</em></div>
            <div className="login-logo-sub">Bienvenue</div>
          </div>
          <div className="form-box">
            <div className="tab-row">
              <div className={`tab-btn ${tab==='client'?'active':''}`} onClick={()=>setTab('client')}>Je suis client</div>
              <div className={`tab-btn ${tab==='expert'?'active':''}`} onClick={()=>setTab('expert')}>Je suis expert</div>
            </div>
            <h2 className="form-title">Se connecter</h2>
            <p className="form-sub">{tab==='client' ? 'Accédez à vos briefs et missions en cours.' : 'Gérez vos missions et votre profil expert.'}</p>
            <form onSubmit={handleLogin}>
              <div className="form-group">
                <label className="form-label">Adresse email</label>
                <input className="form-input" type="email" placeholder="votre@email.com" value={email} onChange={e=>setEmail(e.target.value)} required/>
              </div>
              <div className="form-group">
                <div className="form-label-row">
                  <span className="form-label" style={{margin:0}}>Mot de passe</span>
                  <a href="#" onClick={e=>{e.preventDefault();setShowReset(true);setResetEmail(email);}}>Mot de passe oublié ?</a>
                </div>
                <div style={{position:'relative'}}>
                  <input className="form-input" type={showPwd?'text':'password'} placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} required style={{paddingRight:44}}/>
                  <button type="button" onClick={()=>setShowPwd(s=>!s)} style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',color:'var(--text-3)',display:'flex',alignItems:'center'}}>
                    {showPwd ? <Ic.EyeOff/> : <Ic.Eye/>}
                  </button>
                </div>
              </div>
              {error && <div style={{color:'#EF4444',fontSize:13,marginBottom:12,padding:'10px 14px',background:'rgba(239,68,68,0.08)',borderRadius:8,border:'1px solid rgba(239,68,68,0.2)'}}>{error}</div>}
              <button type="submit" className="btn btn-primary form-submit" disabled={loading}>
                {loading ? 'Connexion…' : <React.Fragment>Se connecter <Ic.Arrow/></React.Fragment>}
              </button>
            </form>
            <div className="form-footer">
              Pas encore de compte ?{' '}
              <a href={`inscription.html?role=${tab}`}>{tab==='expert' ? 'Devenir expert' : "S'inscrire gratuitement"}</a>
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
