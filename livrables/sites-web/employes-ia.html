<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Employés IA — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="design-system.css">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--nav:60px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 24px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:240px;height:56px;background:url('/creatorflow-logo.png') center/140% no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{display:none;}
.nav-right{display:flex;align-items:center;gap:12px;}
.back-link{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px;}
.back-link:hover{color:var(--text);}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}

.app{padding-top:var(--nav);max-width:1100px;margin:0 auto;padding-left:24px;padding-right:24px;padding-bottom:80px;}
.page-header{padding:32px 0 8px;}
.page-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--text-2);max-width:640px;}

.agents-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:24px 0 40px;}
.agent-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px;}
.agent-card-top{display:flex;align-items:center;gap:12px;}
.agent-icon{width:48px;height:48px;border-radius:12px;background:var(--surf-2);display:grid;place-items:center;font-size:22px;flex-shrink:0;}
.agent-name{font-size:15px;font-weight:700;}
.agent-desc{font-size:12px;color:var(--text-2);line-height:1.5;flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:all 160ms;}
.btn-primary{background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:var(--surf-2);border:1px solid var(--border-2);color:var(--text);}
.btn-ghost:hover{border-color:var(--border-3);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.section-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.section-title{font-size:14px;font-weight:700;}
.mission-row{padding:16px 20px;border-bottom:1px solid var(--border);}
.mission-row:last-child{border-bottom:none;}
.mission-row-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.mission-row-title{font-size:13px;font-weight:600;}
.mission-row-meta{font-size:11px;color:var(--text-3);margin-top:3px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;flex-shrink:0;}
.badge-purple{background:rgba(124,58,237,0.12);color:var(--vs);border:1px solid rgba(124,58,237,0.2);}
.badge-amber{background:rgba(245,158,11,0.12);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2);}
.badge-red{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.deliverable-box{margin-top:12px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;padding:14px;font-size:12px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;}
.deliverable-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;}
.ds-empty{padding:48px 24px;text-align:center;}
.ds-empty-icon{font-size:28px;margin-bottom:8px;}
.ds-empty-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.ds-empty-sub{font-size:12px;color:var(--text-3);}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-head{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:15px;font-weight:700;}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
.field-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;}
.field-input,.field-textarea{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:9px;padding:10px 12px;font-family:var(--f);font-size:13px;color:var(--text);outline:none;}
.field-input:focus,.field-textarea:focus{border-color:rgba(124,58,237,0.4);}
.field-textarea{resize:vertical;min-height:110px;}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.loading-box{display:flex;align-items:center;gap:10px;padding:16px;background:var(--surf-2);border-radius:10px;font-size:13px;color:var(--text-2);}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-2);border-top-color:var(--vs);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.result-box{padding:14px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:10px;font-size:12px;color:var(--text-2);}

/* Markdown rendu */
.md-body{font-size:14px;line-height:1.65;color:var(--text);word-break:break-word;}
.md-body h1{font-size:18px;font-weight:800;margin:16px 0 6px;letter-spacing:-0.02em;}
.md-body h2{font-size:15px;font-weight:700;margin:14px 0 5px;border-bottom:1px solid var(--border);padding-bottom:3px;}
.md-body h3{font-size:13.5px;font-weight:700;margin:10px 0 4px;}
.md-body p{margin:0 0 8px;}
.md-body p:last-child{margin-bottom:0;}
.md-body strong{font-weight:700;}
.md-body em{font-style:italic;}
.md-body hr{border:none;border-top:1px solid var(--border-2);margin:12px 0;}
.md-body ul,.md-body ol{padding-left:20px;margin:0 0 8px;}
.md-body li{margin-bottom:3px;}
.md-body blockquote{border-left:3px solid var(--v);padding:6px 12px;background:rgba(124,58,237,0.06);border-radius:0 6px 6px 0;margin:8px 0;color:var(--text-2);}
.md-body code{background:rgba(255,255,255,0.07);border-radius:4px;padding:1px 5px;font-size:0.88em;font-family:monospace;}
.md-body pre{background:rgba(0,0,0,0.3);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0;}
.md-body pre code{background:none;padding:0;font-size:12px;}

/* Métadonnées article */
.meta-row{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 4px;border-top:1px solid var(--border);}
.meta-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;background:rgba(255,255,255,0.04);border:1px solid var(--border-2);border-radius:999px;font-size:11px;color:var(--text-2);}
.meta-chip b{color:var(--text-3);font-weight:700;font-size:10px;text-transform:uppercase;margin-right:2px;}
.meta-desc{font-size:12px;color:var(--text-2);line-height:1.6;padding:8px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;margin-top:6px;}

/* Grille images */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}

/* Cartes vidéo */
.video-card{display:flex;gap:12px;background:var(--surf-3);border:1px solid var(--border-2);border-radius:10px;padding:10px;text-decoration:none;transition:border-color 180ms;}
.video-card:hover{border-color:rgba(124,58,237,0.4);}
.video-thumb{width:120px;height:68px;object-fit:cover;border-radius:6px;flex-shrink:0;}
.video-thumb-placeholder{width:120px;height:68px;background:rgba(124,58,237,0.1);border-radius:6px;flex-shrink:0;display:grid;place-items:center;font-size:24px;}

@media(max-width:768px){
  .app{padding-left:16px;padding-right:16px;}
  .agents-grid{grid-template-columns:1fr;}
  .nav-inner{padding:0 14px;}
  .page-title{font-size:22px;}
  .brand-logo{width:180px;height:48px;}
}
@media(max-width:520px){
  /* Header : compact, une seule ligne */
  :root{--nav:52px;}
  .nav-inner{padding:0 12px;}
  .brand-logo{width:148px;height:40px;}
  .back-link{font-size:0;width:28px;flex-shrink:0;}
  .back-link::before{content:'←';font-size:18px;color:var(--text-2);display:block;}
  .user-chip{padding:3px 8px 3px 3px;gap:6px;}
  .av{width:26px;height:26px;font-size:10px;}

  /* Layout : app full-width, plus de padding latéral */
  .app{padding-left:0!important;padding-right:0!important;}
  .page-header{padding:24px 16px 8px!important;}
  .agents-grid{padding:0 16px;}

  /* Section card : flat, bords latéraux supprimés */
  .section-card{border-left:none;border-right:none;border-radius:0;}
  .section-head{padding:12px 16px;}
  .mission-row{padding:14px 16px;}

  /* Livrable : mode document (85% largeur contenu) */
  .deliverable-doc{
    margin:12px -16px 0!important;
    background:transparent!important;
    border:none!important;
    border-top:1px solid var(--border)!important;
    border-radius:0!important;
    padding:14px 0 8px!important;
  }
  .livrable-tag{padding:0 16px!important;margin-bottom:8px!important;}
  .article-title{padding:0 16px!important;font-size:19px!important;margin-bottom:12px!important;margin-top:12px!important;}
  .body-wrap{padding:0 16px!important;}

  /* Markdown : transparent, sans carte, lecture directe */
  .md-body{
    background:transparent!important;
    border:none!important;
    border-radius:0!important;
    padding:0!important;
    font-size:15px!important;
    line-height:1.72!important;
  }

  /* Bouton Copier : icône seule 30×30 */
  .copy-btn{
    top:4px!important;right:8px!important;
    width:30px!important;height:30px!important;
    padding:0!important;font-size:0!important;
    background:rgba(124,58,237,0.12)!important;
    border:1px solid rgba(124,58,237,0.25)!important;
    border-radius:8px!important;cursor:pointer!important;
  }
  .copy-btn::after{content:'⎘';font-size:16px;color:var(--vs);display:block;text-align:center;line-height:30px;}

  /* Métadonnées avec padding */
  .meta-row{padding:10px 16px 4px!important;}
  .meta-desc{margin:6px 16px 0!important;}

  /* Médias avec padding */
  .media-section{padding:0 16px!important;}
  .img-grid{grid-template-columns:repeat(2,1fr);}
  .video-card{flex-direction:column;}
  .video-thumb,.video-thumb-placeholder{width:100%!important;height:auto!important;aspect-ratio:16/9;}

  .page-title{font-size:20px;}

  /* Modal : bottom-sheet */
  .modal{margin:0;border-radius:var(--r-lg) var(--r-lg) 0 0;position:fixed;bottom:0;max-height:92vh;}
  .modal-backdrop{align-items:flex-end;padding:0;}
}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script>
const { useState, useEffect } = React;
const { createClient } = supabase;
const sb = createClient('https://cjtglfutckaogsmwhfsv.supabase.co', 'sb_publishable_KGyuEEu7EqdF0xiLaL9dig_UZKnu9Ei');
const AI_ORCHESTRATOR_URL = 'https://cjtglfutckaogsmwhfsv.supabase.co/functions/v1/ai-orchestrator';

function initials(name) {
  if (!name) return '??';
  return name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
}

function statusBadge(status, delivered) {
  if (delivered) return React.createElement('span', { className: 'badge badge-green' }, 'Livré');
  if (status === 'pending_payment') return React.createElement('span', { className: 'badge badge-amber' }, '⏳ Paiement en attente');
  if (status === 'completed') return React.createElement('span', { className: 'badge badge-amber' }, 'En révision');
  if (status === 'waiting_approval') return React.createElement('span', { className: 'badge badge-amber' }, 'En révision');
  if (status === 'failed') return React.createElement('span', { className: 'badge badge-red' }, 'Échoué');
  if (status === 'cancelled') return React.createElement('span', { className: 'badge badge-red' }, 'Annulé');
  return React.createElement('span', { className: 'badge badge-purple' }, 'En cours');
}

function Deliverable({ mission, outputs }) {
  if (!mission.delivered_to_client) return null;
  const relevant = (outputs || []).filter(o => o.mission_id === mission.id);

  const MEDIA_KEYS = ['images','videos'];
  const TEXT_KEYS = ['title','body','content','text','plan','strategy','result','sections'];
  const META_KEYS = ['category','word_count','meta_description','suggested_tags','target_audience','publishing_notes'];

  const renderMarkdown = (md) => {
    if (typeof marked !== 'undefined') {
      try {
        marked.setOptions({ breaks: true, gfm: true });
        return marked.parse(String(md));
      } catch(e) {}
    }
    return String(md).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  };

  const renderMeta = (d) => {
    const chips = [];
    if (d.category) chips.push(React.createElement('span', { key:'cat', className:'meta-chip' }, React.createElement('b', null, 'Catégorie'), d.category));
    if (d.word_count) chips.push(React.createElement('span', { key:'wc', className:'meta-chip' }, React.createElement('b', null, 'Mots'), String(d.word_count)));
    if (d.target_audience) chips.push(React.createElement('span', { key:'ta', className:'meta-chip' }, React.createElement('b', null, 'Audience'), d.target_audience));
    const tags = Array.isArray(d.suggested_tags) ? d.suggested_tags : (typeof d.suggested_tags === 'string' ? d.suggested_tags.split(',').map(t => t.trim()) : []);
    tags.slice(0,5).forEach((tag,i) => chips.push(React.createElement('span', { key:'tag'+i, className:'meta-chip' }, '# ', tag)));
    const extras = [];
    if (chips.length) extras.push(React.createElement('div', { key:'chips', className:'meta-row' }, chips));
    if (d.meta_description) extras.push(React.createElement('div', { key:'meta', className:'meta-desc' }, React.createElement('b', { style:{color:'var(--text-3)',fontSize:10,textTransform:'uppercase',letterSpacing:'0.07em',marginRight:6} }, 'SEO'), d.meta_description));
    if (d.publishing_notes) extras.push(React.createElement('div', { key:'notes', className:'meta-desc', style:{fontStyle:'italic'} }, React.createElement('b', { style:{color:'var(--text-3)',fontSize:10,textTransform:'uppercase',letterSpacing:'0.07em',marginRight:6,fontStyle:'normal'} }, 'Notes'), d.publishing_notes));
    return extras;
  };

  const renderImages = (images) => {
    if (!images || !images.length) return null;
    return React.createElement('div', { className: 'media-section', style: { marginTop: 20 } },
      React.createElement('div', { style: { fontSize: 11, fontWeight: 700, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 } }, `Images (${images.length})`),
      React.createElement('div', { className: 'img-grid' },
        images.map((img, i) =>
          React.createElement('div', { key: i, style: { borderRadius: 8, overflow: 'hidden', border: '1px solid var(--border-2)', background: 'var(--surf-3)' } },
            React.createElement('a', { href: img.url, target: '_blank', rel: 'noreferrer' },
              React.createElement('img', { src: img.thumb || img.url, alt: img.alt || '', style: { width: '100%', height: 110, objectFit: 'cover', display: 'block' } })
            ),
            React.createElement('div', { style: { padding: '6px 8px' } },
              img.alt && React.createElement('div', { style: { fontSize: 11, color: 'var(--text-2)', marginBottom: 3, lineHeight: 1.3, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical' } }, img.alt),
              React.createElement('a', {
                href: (img.credit_url || '#') + (img.credit_url && !img.credit_url.includes('utm_') ? '?utm_source=creatorflow&utm_medium=referral' : ''),
                target: '_blank', rel: 'noreferrer',
                style: { fontSize: 10, color: 'var(--text-3)', display: 'block' }
              }, img.credit ? '📷 ' + img.credit : 'Unsplash')
            )
          )
        )
      )
    );
  };

  const renderVideos = (videos) => {
    if (!videos || !videos.length) return null;
    return React.createElement('div', { className: 'media-section', style: { marginTop: 20 } },
      React.createElement('div', { style: { fontSize: 11, fontWeight: 700, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 } }, `Vidéos (${videos.length})`),
      React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
        videos.map((v, i) =>
          React.createElement('a', { key: i, href: v.url, target: '_blank', rel: 'noreferrer', className: 'video-card' },
            v.thumbnail
              ? React.createElement('img', { src: v.thumbnail, alt: v.title || '', className: 'video-thumb' })
              : React.createElement('div', { className: 'video-thumb-placeholder' }, '▶'),
            React.createElement('div', { style: { flex: 1, minWidth: 0 } },
              React.createElement('div', { style: { fontSize: 12, fontWeight: 700, color: 'var(--text)', lineHeight: 1.4, marginBottom: 4, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical' } }, v.title),
              v.description && React.createElement('div', { style: { fontSize: 11, color: 'var(--text-3)', lineHeight: 1.4, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical' } }, v.description),
              React.createElement('div', { style: { fontSize: 10, color: 'var(--vs)', marginTop: 6, fontWeight: 600 } }, v.platform === 'vimeo' ? '🎬 Vimeo' : '▶ YouTube')
            )
          )
        )
      )
    );
  };

  const renderOutputData = (o) => {
    const d = o.output_data || {};
    const body = d.body || d.content || d.text || d.plan || d.strategy || d.result || null;
    const title = d.title || null;
    const images = Array.isArray(d.images) ? d.images : null;
    const videos = Array.isArray(d.videos) ? d.videos : null;
    const otherKeys = Object.keys(d).filter(k => ![...TEXT_KEYS, ...MEDIA_KEYS, ...META_KEYS].includes(k));

    return React.createElement('div', { key: o.id },
      title && React.createElement('div', {
        className: 'article-title',
        style: { fontSize: 17, fontWeight: 800, color: 'var(--text)', marginBottom: 14, lineHeight: 1.4, letterSpacing: '-0.02em', marginTop: 16 }
      }, title),
      body && React.createElement('div', { className: 'body-wrap', style: { position: 'relative' } },
        React.createElement('div', {
          className: 'md-body',
          style: { background: 'var(--surf-3)', border: '1px solid var(--border-2)', borderRadius: 10, padding: '14px 16px' },
          dangerouslySetInnerHTML: { __html: renderMarkdown(body) }
        }),
        React.createElement('button', {
          className: 'copy-btn',
          onClick: () => navigator.clipboard.writeText(body).catch(() => {}),
          style: { position: 'absolute', top: 8, right: 8, background: 'rgba(124,58,237,0.15)', border: '1px solid rgba(124,58,237,0.3)', borderRadius: 6, padding: '4px 10px', fontSize: 11, fontWeight: 700, color: 'var(--vs)', cursor: 'pointer', zIndex: 2 }
        }, 'Copier')
      ),
      !body && otherKeys.length > 0 && otherKeys.map(k =>
        React.createElement('div', { key: k, style: { marginBottom: 10 } },
          React.createElement('div', { style: { fontSize: 11, fontWeight: 700, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 4 } }, k),
          React.createElement('div', { style: { background: 'var(--surf-3)', border: '1px solid var(--border-2)', borderRadius: 8, padding: '12px', fontSize: 13, color: 'var(--text)', whiteSpace: 'pre-wrap', wordBreak: 'break-word' } },
            typeof d[k] === 'string' ? d[k] : JSON.stringify(d[k], null, 2)
          )
        )
      ),
      !body && otherKeys.length === 0 && !images && !videos && React.createElement('div', {
        style: { background: 'var(--surf-3)', border: '1px solid var(--border-2)', borderRadius: 10, padding: '16px', fontSize: 13, color: 'var(--text-2)', whiteSpace: 'pre-wrap' }
      }, JSON.stringify(d, null, 2)),
      renderMeta(d),
      renderImages(images),
      renderVideos(videos)
    );
  };

  return React.createElement('div', { className: 'deliverable-doc', style: { marginTop: 14, background: 'var(--surf-2)', border: '1px solid rgba(124,58,237,0.2)', borderRadius: 12, padding: '16px 18px' } },
    React.createElement('div', { className: 'livrable-tag', style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 } },
      React.createElement('span', { style: { fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--vs)' } }, 'Livrable'),
      React.createElement('span', { style: { fontSize: 11, color: 'var(--text-3)' } }, '· ' + (mission.ai_agents?.name || 'Agent IA'))
    ),
    relevant.length === 0 && mission.result_summary
      ? React.createElement('div', { className: 'body-wrap', style: { position: 'relative' } },
          React.createElement('div', {
            className: 'md-body',
            style: { background: 'var(--surf-3)', border: '1px solid var(--border-2)', borderRadius: 10, padding: '14px 16px' },
            dangerouslySetInnerHTML: { __html: renderMarkdown(mission.result_summary) }
          }),
          React.createElement('button', {
            className: 'copy-btn',
            onClick: () => navigator.clipboard.writeText(mission.result_summary).catch(() => {}),
            style: { position: 'absolute', top: 8, right: 8, background: 'rgba(124,58,237,0.15)', border: '1px solid rgba(124,58,237,0.3)', borderRadius: 6, padding: '4px 10px', fontSize: 11, fontWeight: 700, color: 'var(--vs)', cursor: 'pointer', zIndex: 2 }
          }, 'Copier')
        )
      : relevant.length === 0
        ? React.createElement('div', { style: { fontSize: 13, color: 'var(--text-3)', fontStyle: 'italic' } }, 'Livrable en cours de préparation.')
        : relevant.map(renderOutputData)
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [agents, setAgents] = useState([]);
  const [missions, setMissions] = useState([]);
  const [outputs, setOutputs] = useState([]);
  const [modalAgent, setModalAgent] = useState(null);
  const [title, setTitle] = useState('');
  const [objective, setObjective] = useState('');
  const [running, setRunning] = useState(false);
  const [doneMsg, setDoneMsg] = useState('');

  const loadMissions = async (userId) => {
    const { data: ms } = await sb.from('agent_missions').select('*, ai_agents(name, icon, slug)').eq('created_by', userId).order('created_at', { ascending: false });
    setMissions(ms || []);
    const deliveredIds = (ms || []).filter(m => m.delivered_to_client).map(m => m.id);
    if (deliveredIds.length) {
      const { data: outs } = await sb.from('agent_outputs').select('*').in('mission_id', deliveredIds);
      setOutputs(outs || []);
    }
  };

  useEffect(() => {
    sb.auth.getSession().then(async ({ data }) => {
      if (!data.session) { window.location.href = 'connexion.html?redirect=employes-ia.html'; return; }
      setUser(data.session.user);
      const { data: ag } = await sb.from('ai_agents').select('*').eq('status', 'active').order('name');
      setAgents(ag || []);
      await loadMissions(data.session.user.id);
    });
  }, []);

  const openModal = (agent) => { setModalAgent(agent); setTitle(''); setObjective(''); setDoneMsg(''); };
  const closeModal = () => { if (!running) setModalAgent(null); };

  const submitMission = async () => {
    if (!objective.trim()) return;
    setRunning(true);
    try {
      const prixCents = modalAgent.prix_cents || 2999;
      const { data: mission, error: mErr } = await sb.from('agent_missions').insert({
        agent_id: modalAgent.id,
        title: title || objective.slice(0, 80),
        objective,
        status: 'pending_payment',
        created_by: user.id,
        prix_cents: prixCents,
        payment_status: 'unpaid',
      }).select().single();
      if (mErr || !mission) throw new Error(mErr?.message || 'Erreur lors de la création de la mission.');
      window.location.href = `paiement.html?agent_mission_id=${mission.id}`;
    } catch (e) {
      setDoneMsg('Erreur : ' + e.message);
      setRunning(false);
    }
  };

  return React.createElement(React.Fragment, null,
    React.createElement('div', { className: 'nav' },
      React.createElement('div', { className: 'nav-inner' },
        React.createElement('a', { href: '/', className: 'brand' },
          React.createElement('div', { className: 'brand-logo' }),
          React.createElement('span', null, 'CreatorFlow Market')
        ),
        React.createElement('div', { className: 'nav-right' },
          React.createElement('a', { href: 'dashboard-client.html', className: 'back-link' }, '← Tableau de bord'),
          user && React.createElement('div', { className: 'user-chip' },
            React.createElement('div', { className: 'av' }, initials(user.email))
          )
        )
      )
    ),
    React.createElement('div', { className: 'app' },
      React.createElement('div', { className: 'page-header' },
        React.createElement('div', { className: 'page-title' }, 'Employés IA'),
        React.createElement('div', { className: 'page-sub' }, "Confiez une tâche à un employé IA comme vous le feriez avec un expert : décrivez votre besoin, l'agent l'exécute, notre équipe vérifie le résultat avant de vous le livrer.")
      ),
      React.createElement('div', { className: 'agents-grid' },
        agents.map(a => React.createElement('div', { key: a.id, className: 'agent-card' },
          React.createElement('div', { className: 'agent-card-top' },
            React.createElement('div', { className: 'agent-icon' }, a.icon || '🤖'),
            React.createElement('div', { className: 'agent-name' }, a.name)
          ),
          React.createElement('div', { className: 'agent-desc' }, a.description),
          React.createElement('button', { className: 'btn btn-primary', onClick: () => openModal(a) }, 'Confier une tâche')
        ))
      ),
      React.createElement('div', { className: 'section-card' },
        React.createElement('div', { className: 'section-head' },
          React.createElement('span', { className: 'section-title' }, 'Mes missions')
        ),
        missions.length === 0
          ? React.createElement('div', { className: 'ds-empty' },
              React.createElement('div', { className: 'ds-empty-icon' }, '🤖'),
              React.createElement('div', { className: 'ds-empty-title' }, 'Aucune mission confiée'),
              React.createElement('p', { className: 'ds-empty-sub' }, 'Choisissez un employé IA ci-dessus pour commencer.')
            )
          : missions.map(m => React.createElement('div', { key: m.id, className: 'mission-row' },
              React.createElement('div', { className: 'mission-row-top' },
                React.createElement('div', null,
                  React.createElement('div', { className: 'mission-row-title' }, (m.ai_agents ? m.ai_agents.icon + ' ' : '') + m.title),
                  React.createElement('div', { className: 'mission-row-meta' }, fmtDate(m.created_at))
                ),
                statusBadge(m.status, m.delivered_to_client)
              ),
              m.status === 'pending_payment' && React.createElement('a', {
                href: `paiement.html?agent_mission_id=${m.id}`,
                style: { display: 'inline-flex', alignItems: 'center', gap: 6, marginTop: 10, padding: '8px 16px', background: 'rgba(124,58,237,0.15)', border: '1px solid rgba(124,58,237,0.3)', borderRadius: 8, fontSize: 12, fontWeight: 700, color: 'var(--vs)', textDecoration: 'none' }
              }, '💳 Compléter le paiement →'),
              React.createElement(Deliverable, { mission: m, outputs: outputs })
            ))
      )
    ),
    modalAgent && React.createElement('div', { className: 'modal-backdrop', onClick: closeModal },
      React.createElement('div', { className: 'modal', onClick: e => e.stopPropagation() },
        React.createElement('div', { className: 'modal-head' },
          React.createElement('div', { className: 'modal-title' }, 'Confier une tâche — ' + modalAgent.name),
          React.createElement('button', { onClick: closeModal, disabled: running }, '✕')
        ),
        React.createElement('div', { className: 'modal-body' },
          !doneMsg && React.createElement(React.Fragment, null,
            React.createElement('div', null,
              React.createElement('label', { className: 'field-label' }, 'Titre (optionnel)'),
              React.createElement('input', { className: 'field-input', value: title, onChange: e => setTitle(e.target.value), placeholder: 'Ex: Plan de contenu pour mon lancement' })
            ),
            React.createElement('div', null,
              React.createElement('label', { className: 'field-label' }, 'Décrivez votre besoin'),
              React.createElement('textarea', { className: 'field-textarea', value: objective, onChange: e => setObjective(e.target.value), placeholder: 'Expliquez précisément ce que vous attendez de cet agent...' })
            ),
            running && React.createElement('div', { className: 'loading-box' },
              React.createElement('div', { className: 'spinner' }),
              "Préparation de la mission… Redirection vers le paiement."
            )
          ),
          doneMsg && React.createElement('div', { className: 'result-box' }, doneMsg)
        ),
        React.createElement('div', { className: 'modal-foot' },
          !doneMsg
            ? React.createElement(React.Fragment, null,
                React.createElement('button', { className: 'btn btn-ghost', onClick: closeModal, disabled: running }, 'Annuler'),
                React.createElement('button', { className: 'btn btn-primary', onClick: submitMission, disabled: running || !objective.trim() }, running ? 'En cours…' : 'Confier la mission')
              )
            : React.createElement('button', { className: 'btn btn-primary', onClick: closeModal }, 'Fermer')
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
