  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--cg:rgba(6,182,212,0.25);--green:#10B981;--orange:#F59E0B;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,4,10,0.85);backdrop-filter:blur(18px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:56px;height:56px;background:url('/logo.jpg') center/contain no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{margin-left:-18px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-cyan{background:linear-gradient(135deg,var(--c),#0891B2);color:#fff;box-shadow:0 6px 20px -6px var(--cg);}
.btn-cyan:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px var(--cg);}
.btn-lg{padding:16px 32px;font-size:16px;}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}

.page{padding-top:64px;}
.container{max-width:1100px;margin:0 auto;padding:0 28px;}

/* HERO */
.hero{padding:80px 0 70px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 900px 600px at 50% 20%,rgba(6,182,212,0.08),transparent 70%);pointer-events:none;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 16px;background:rgba(6,182,212,0.10);border:1px solid rgba(6,182,212,0.25);border-radius:999px;font-size:12px;font-weight:700;color:var(--c);margin-bottom:22px;}
.hero-title{font-size:52px;font-weight:800;letter-spacing:-0.04em;margin-bottom:18px;line-height:1.05;}
.hero-title em{font-style:normal;background:linear-gradient(135deg,var(--c),var(--vs));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:18px;color:var(--text-2);max-width:560px;margin:0 auto 36px;line-height:1.65;}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:50px;}
.hero-proof{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;}
.proof-item{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2);}
.proof-icon{color:var(--green);}

/* STATS BANNER */
.stats-banner{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin:0 0 80px;}
.stat-cell{background:var(--surf);padding:24px;text-align:center;}
.stat-val{font-size:30px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
.stat-val.cyan{color:var(--c);}
.stat-val.purple{color:var(--vs);}
.stat-val.green{color:var(--green);}
.stat-val.orange{color:var(--orange);}
.stat-lbl{font-size:13px;color:var(--text-3);}

/* SECTIONS */
.section{padding:70px 0;}
.section-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:rgba(6,182,212,0.10);border:1px solid rgba(6,182,212,0.2);border-radius:999px;font-size:11px;font-weight:700;color:var(--c);margin-bottom:14px;}
.section-title{font-size:34px;font-weight:800;letter-spacing:-0.03em;margin-bottom:12px;line-height:1.1;}
.section-sub{font-size:16px;color:var(--text-2);max-width:520px;line-height:1.65;}

/* HOW IT WORKS */
.hiw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;}
.hiw-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;}
.hiw-num{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--v));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;margin-bottom:16px;}
.hiw-title{font-size:16px;font-weight:800;margin-bottom:8px;}
.hiw-desc{font-size:13px;color:var(--text-2);line-height:1.65;}

/* BENEFITS */
.benefits-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:40px;}
.benefit-item{display:flex;gap:14px;padding:20px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);transition:border-color 200ms;}
.benefit-item:hover{border-color:rgba(6,182,212,0.25);}
.benefit-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.benefit-title{font-size:14px;font-weight:800;margin-bottom:4px;}
.benefit-desc{font-size:13px;color:var(--text-2);line-height:1.6;}

/* EXPERTS SHOWCASE */
.experts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;}
.expert-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;text-align:center;transition:border-color 200ms,transform 200ms;}
.expert-card:hover{border-color:rgba(6,182,212,0.25);transform:translateY(-3px);}
.ex-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;margin:0 auto 12px;border:2px solid var(--border-2);}
.ex-name{font-size:15px;font-weight:800;margin-bottom:3px;}
.ex-spec{font-size:12px;color:var(--text-2);margin-bottom:10px;}
.ex-stats{display:flex;justify-content:center;gap:16px;}
.ex-stat{text-align:center;}
.ex-stat-val{font-size:16px;font-weight:800;color:var(--c);}
.ex-stat-lbl{font-size:10px;color:var(--text-3);}
.ex-earning{display:inline-block;margin-top:12px;padding:5px 14px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.2);border-radius:999px;font-size:13px;font-weight:700;color:var(--green);}

/* CTA SECTION */
.cta-section{background:linear-gradient(135deg,rgba(6,182,212,0.10),rgba(124,58,237,0.12));border:1px solid rgba(6,182,212,0.2);border-radius:var(--r-xl);padding:60px;text-align:center;margin:0 0 80px;}
.cta-title{font-size:32px;font-weight:800;letter-spacing:-0.03em;margin-bottom:12px;}
.cta-sub{font-size:16px;color:var(--text-2);max-width:480px;margin:0 auto 32px;line-height:1.65;}
.cta-steps{display:flex;gap:24px;justify-content:center;margin-top:32px;flex-wrap:wrap;}
.cta-step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);}
.cta-step-num{width:24px;height:24px;border-radius:50%;background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--c);flex-shrink:0;}

/* TESTIMONIALS */
.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px;}
.testi-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;}
.testi-quote{font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:16px;font-style:italic;}
.testi-author{display:flex;align-items:center;gap:10px;}
.testi-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.testi-name{font-size:13px;font-weight:700;}
.testi-role{font-size:11px;color:var(--text-3);}
.testi-earning{margin-left:auto;font-size:14px;font-weight:800;color:var(--green);}

/* FAQ */
.faq-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px;margin-bottom:80px;}
.faq-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;}
.faq-q{font-size:14px;font-weight:700;margin-bottom:8px;}
.faq-a{font-size:13px;color:var(--text-2);line-height:1.65;}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:40px 0 28px;margin-top:0;}
.footer-inner{max-width:1100px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:24px;}
.footer-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
.footer-logo{font-size:15px;font-weight:700;letter-spacing:-0.02em;}
.footer-links{display:flex;gap:20px;flex-wrap:wrap;}
.footer-links a{font-size:13px;color:var(--text-3);transition:color 180ms;}
.footer-links a:hover{color:var(--text-2);}
.footer-bottom{font-size:12px;color:var(--text-3);}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 600ms var(--ease) both;}

@media(max-width:640px){
  .container{padding:0 18px;}
  .hero{padding:56px 0 40px;}
  .hero-title{font-size:32px;}
  .hero-sub{font-size:15px;}
  .hero-proof{gap:10px;}
  .hero-cta .btn-lg{width:100%;justify-content:center;}
  .stats-banner{grid-template-columns:repeat(2,1fr);}
  .hiw-grid{grid-template-columns:1fr;}
  .benefits-grid{grid-template-columns:1fr;}
  .experts-grid{grid-template-columns:1fr;}
  .testimonials{grid-template-columns:1fr;}
  .faq-grid{grid-template-columns:1fr;}
  .cta-section{padding:36px 20px;}
  .cta-steps{gap:12px;}
  .footer-top{flex-direction:column;align-items:flex-start;}
}
  </style>
