<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Paiement — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet"></noscript>
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:14px;--r-lg:20px;--r-xl:28px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 28px;}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:64px;display:flex;align-items:center;background:rgba(4,4,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;}
.brand{display:flex;align-items:center;gap:0;font-size:16px;font-weight:700;letter-spacing:-0.025em;flex-shrink:0;}
.brand-logo{width:240px;height:56px;background:url('/creatorflow-logo.png') center/140% no-repeat;mix-blend-mode:screen;filter:brightness(1.1) drop-shadow(0 0 8px rgba(124,58,237,0.6));}
.brand span{display:none;}
.nav-secure{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);}
.nav-secure::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surf);border:1px solid var(--border-2);}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-green{background:linear-gradient(135deg,#059669,var(--green));color:#fff;box-shadow:0 6px 20px -6px rgba(16,185,129,0.45);}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 12px 28px -6px rgba(16,185,129,0.6);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-sm{padding:6px 13px;font-size:12px;}
.btn-lg{padding:15px 28px;font-size:15px;border-radius:14px;width:100%;justify-content:center;}

/* PAGE */
.page-wrap{padding-top:88px;padding-bottom:80px;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3);margin-bottom:28px;}
.breadcrumb a{color:var(--text-3);transition:color 160ms;}
.breadcrumb a:hover{color:var(--text-2);}
.bc-sep{opacity:0.4;}
.page-title{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--text-2);margin-bottom:32px;}

/* LAYOUT */
.pay-layout{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:start;}

/* FORM CARD */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;position:relative;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--v),var(--c));}
.card-head{padding:20px 28px;border-bottom:1px solid var(--border);}
.card-title{font-size:15px;font-weight:700;}
.card-sub{font-size:12px;color:var(--text-3);margin-top:3px;}
.card-body{padding:28px;}

/* PAYMENT METHODS */
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px;}
.pay-method{padding:14px;border:1px solid var(--border-2);border-radius:12px;text-align:center;cursor:pointer;transition:all 180ms;}
.pay-method:hover{border-color:var(--border-3);}
.pay-method.active{border-color:var(--v);background:rgba(124,58,237,0.08);}
.pay-method-icon{font-size:22px;margin-bottom:6px;}
.pay-method-label{font-size:11px;font-weight:600;color:var(--text-2);}
.pay-method.active .pay-method-label{color:var(--vs);}

/* FORM */
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;}
.form-input{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;color:var(--text);font-family:var(--f);font-size:14px;padding:12px 16px;outline:none;transition:border-color 180ms,box-shadow 180ms;}
.form-input:focus{border-color:rgba(124,58,237,0.55);box-shadow:0 0 0 3px rgba(124,58,237,0.10);}
.form-input.error{border-color:rgba(239,68,68,0.5);}
.form-input::placeholder{color:var(--text-3);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
.input-with-icon{position:relative;}
.input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:16px;}
.card-type{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px;}

/* CARD VISUAL */
.card-visual{background:linear-gradient(135deg,#1a1a3a,#0f0f28);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:22px;margin-bottom:24px;position:relative;overflow:hidden;height:160px;}
.card-visual::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08));pointer-events:none;}
.card-visual-chip{width:36px;height:28px;border-radius:6px;background:linear-gradient(135deg,#d4af37,#f5cc5c);margin-bottom:18px;}
.card-visual-number{font-size:17px;font-weight:600;letter-spacing:0.2em;color:rgba(255,255,255,0.9);margin-bottom:16px;font-variant-numeric:tabular-nums;}
.card-visual-bottom{display:flex;align-items:flex-end;justify-content:space-between;}
.card-visual-label{font-size:9px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:2px;}
.card-visual-val{font-size:13px;font-weight:600;color:rgba(255,255,255,0.85);}
.card-logo{position:absolute;top:22px;right:22px;font-size:26px;opacity:0.8;}

/* VIREMENT */
.virement-info{background:var(--surf-2);border:1px solid var(--border-2);border-radius:12px;padding:20px;}
.virement-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.virement-row:last-child{border-bottom:none;}
.vir-label{font-size:12px;color:var(--text-3);}
.vir-val{font-size:13px;font-weight:600;font-family:monospace;letter-spacing:0.05em;}
.copy-btn{padding:3px 10px;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.2);border-radius:6px;font-size:10px;font-weight:600;color:var(--vs);cursor:pointer;transition:all 160ms;}
.copy-btn:hover{background:rgba(124,58,237,0.2);}

/* PAYPAL */
.paypal-wrap{text-align:center;padding:20px 0;}
.paypal-btn{display:inline-flex;align-items:center;gap:10px;background:#003087;color:#fff;padding:14px 32px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all 180ms;}
.paypal-btn:hover{background:#002070;transform:translateY(-1px);}

/* CHECKBOX */
.checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;}
.checkbox-row input{width:16px;height:16px;flex-shrink:0;margin-top:2px;accent-color:var(--v);}
.checkbox-row label{font-size:12px;color:var(--text-3);line-height:1.5;}
.checkbox-row a{color:var(--vs);}

/* SECURITY BADGES */
.security-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.sec-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-3);font-weight:500;}

/* SUMMARY CARD */
.summary-mission{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid var(--border);}
.sm-icon{width:48px;height:48px;border-radius:13px;background:rgba(124,58,237,0.12);display:grid;place-items:center;font-size:22px;flex-shrink:0;border:1px solid rgba(124,58,237,0.2);}
.sm-title{font-size:14px;font-weight:700;margin-bottom:3px;}
.sm-meta{font-size:11px;color:var(--text-3);}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.badge-amber{background:rgba(245,158,11,0.1);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.expert-row{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);}
.ex-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--v),var(--c));display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;}
.ex-name{font-size:13px;font-weight:700;margin-bottom:1px;}
.ex-spec{font-size:11px;color:var(--text-3);}
.stars{display:flex;gap:2px;align-items:center;}

/* PRICING */
.pricing-block{padding:20px;}
.price-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.price-row:last-child{border-bottom:none;}
.price-label{font-size:13px;color:var(--text-2);}
.price-val{font-size:13px;font-weight:600;}
.price-total-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;}
.price-total-label{font-size:15px;font-weight:700;}
.price-total-val{font-size:22px;font-weight:800;color:var(--vs);}
.discount-tag{font-size:10px;background:rgba(16,185,129,0.12);color:var(--green);padding:2px 7px;border-radius:6px;font-weight:600;}

/* PROTECTION */
.protection-items{padding:16px 20px;border-top:1px solid var(--border);}
.prot-item{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.prot-item:last-child{margin-bottom:0;}
.prot-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;}
.prot-text{font-size:12px;color:var(--text-3);}

/* SUCCESS */
.success-wrap{text-align:center;padding:60px 40px;}
.success-ring{width:80px;height:80px;border-radius:50%;background:rgba(16,185,129,0.10);border:2px solid rgba(16,185,129,0.3);display:grid;place-items:center;margin:0 auto 24px;font-size:36px;animation:pop 400ms var(--ease) both;}
@keyframes pop{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-title{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;}
.success-sub{font-size:14px;color:var(--text-2);max-width:380px;margin:0 auto 28px;line-height:1.6;}
.success-details{background:var(--surf-2);border:1px solid var(--border-2);border-radius:14px;padding:20px;text-align:left;margin-bottom:28px;}
.suc-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.suc-row:last-child{border-bottom:none;}
.suc-label{color:var(--text-3);}
.suc-val{font-weight:600;}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.05) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}

@media(max-width:960px){.pay-layout{grid-template-columns:1fr;}}
@media(max-width:640px){.wrap{padding:0 18px;}.form-row,.form-row-3{grid-template-columns:1fr;}.pay-methods{grid-template-columns:1fr 1fr 1fr;}.card-body{padding:20px;}}
  </style>
