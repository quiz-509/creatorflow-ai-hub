<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Blog & Ressources IA — CreatorFlow Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--orange:#F59E0B;--r:14px;--r-lg:20px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(4,4,10,0.85);backdrop-filter:blur(18px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto;padding:0 28px;}
.nav-logo{font-size:16px;font-weight:700;letter-spacing:-0.02em;}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:all 220ms var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px -6px rgba(124,58,237,0.7);}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
@keyframes btn-ripple{to{transform:scale(4);opacity:0;}}
.btn-ripple-el{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);transform:scale(0);animation:btn-ripple 650ms ease-out forwards;pointer-events:none;}

.page{padding-top:64px;}
.container{max-width:1100px;margin:0 auto;padding:0 24px;}

/* HERO */
.hero{padding:48px 0 40px;text-align:center;background:linear-gradient(180deg,rgba(124,58,237,0.08),transparent);}
.hero-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);border-radius:999px;font-size:12px;font-weight:700;color:var(--vs);margin-bottom:18px;}
.hero-title{font-size:36px;font-weight:800;letter-spacing:-0.03em;margin-bottom:14px;}
.hero-title em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:16px;color:var(--text-2);max-width:520px;margin:0 auto 28px;}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:6px 8px 6px 18px;max-width:480px;margin:0 auto;transition:border-color 200ms;}
.search-bar:focus-within{border-color:rgba(124,58,237,0.5);}
.search-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:var(--f);}
.search-input::placeholder{color:var(--text-3);}

/* CATEGORIES */
.cats-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:32px 0 40px;}
.cat-pill{padding:7px 18px;background:var(--surf);border:1px solid var(--border-2);border-radius:999px;font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer;transition:all 180ms;}
.cat-pill:hover{color:var(--text-2);}
.cat-pill.active{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.4);color:var(--vs);}

/* FEATURED */
.featured-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:48px;}
.featured-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color 220ms,transform 200ms;cursor:pointer;}
.featured-card:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-3px);}
.card-thumb{height:200px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;}
.card-thumb-sm{height:140px;font-size:40px;}
.card-thumb-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(4,4,10,0.8));}
.card-body{padding:22px;}
.card-body-sm{padding:16px;}
.card-cat{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:10px;}
.cat-purple{background:rgba(124,58,237,0.12);color:var(--vs);}
.cat-cyan{background:rgba(6,182,212,0.10);color:var(--c);}
.cat-green{background:rgba(16,185,129,0.10);color:var(--green);}
.cat-orange{background:rgba(245,158,11,0.10);color:var(--orange);}
.card-title{font-size:17px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;line-height:1.35;}
.card-title-sm{font-size:14px;font-weight:800;margin-bottom:6px;}
.card-excerpt{font-size:13px;color:var(--text-2);line-height:1.65;margin-bottom:14px;}
.card-excerpt-sm{font-size:12px;color:var(--text-2);line-height:1.6;margin-bottom:12px;}
.card-meta{display:flex;align-items:center;gap:12px;}
.author-chip{display:flex;align-items:center;gap:6px;}
.author-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.author-name{font-size:12px;font-weight:600;}
.meta-dot{width:3px;height:3px;border-radius:50%;background:var(--text-3);}
.meta-info{font-size:12px;color:var(--text-3);}
.read-more{font-size:12px;color:var(--vs);font-weight:600;margin-left:auto;}

/* GRID */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.section-title{font-size:18px;font-weight:800;letter-spacing:-0.02em;}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:48px;}
.blog-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:border-color 220ms,transform 200ms;cursor:pointer;}
.blog-card:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-3px);}

/* NEWSLETTER */
.newsletter{background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(6,182,212,0.08));border:1px solid rgba(124,58,237,0.2);border-radius:var(--r-lg);padding:40px;text-align:center;margin-bottom:60px;}
.nl-title{font-size:22px;font-weight:800;margin-bottom:8px;}
.nl-sub{font-size:14px;color:var(--text-2);margin-bottom:24px;}
.nl-form{display:flex;gap:10px;max-width:420px;margin:0 auto;}
.nl-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid var(--border-2);border-radius:999px;color:var(--text);font-size:14px;font-family:var(--f);padding:11px 18px;outline:none;transition:border-color 180ms;}
.nl-input:focus{border-color:rgba(124,58,237,0.5);}
.nl-stats{display:flex;gap:28px;justify-content:center;margin-top:20px;}
.nl-stat{font-size:12px;color:var(--text-3);}
.nl-stat strong{color:var(--text-2);}

/* SIDEBAR */
.layout{display:grid;grid-template-columns:1fr 280px;gap:32px;padding-bottom:60px;}
.sidebar-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;}
.sidebar-title{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--text-2);}
.trending-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.trending-item:last-child{border:none;padding-bottom:0;}
.trending-num{font-size:18px;font-weight:800;color:var(--border-2);width:24px;flex-shrink:0;line-height:1;}
.trending-title{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.4;}
.trending-meta{font-size:11px;color:var(--text-3);}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}
.tag{padding:5px 12px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:999px;font-size:12px;color:var(--text-3);cursor:pointer;transition:all 150ms;}
.tag:hover{color:var(--vs);border-color:rgba(124,58,237,0.3);}

#cursor-glow{position:fixed;pointer-events:none;z-index:9998;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);transform:translate(-50%,-50%);left:-999px;top:-999px;transition:left 90ms linear,top 90ms linear;}
@keyframes fade-up{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.fade-up{animation:fade-up 500ms var(--ease) both;}
  </style>
</head>
<body>
<div id="cursor-glow"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const Ic = {
  Search:(p)=><svg {...p} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
  Arrow:(p)=><svg {...p} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  Clock:(p)=><svg {...p} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  Bookmark:(p)=><svg {...p} width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>,
  Flame:(p)=><svg {...p} width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>,
};

const CATS = ['Tous','Automatisation','Chatbots & IA','Prompt Engineering','No-Code','Machine Learning','Cas d\'usage'];

const ARTICLES = [
  { id:1, emoji:'🤖', title:'Comment créer un chatbot GPT-4 pour votre service client en 1 jour', excerpt:'Découvrez étape par étape comment construire un chatbot personnalisé avec l\'API OpenAI, sans avoir besoin d\'être développeur.', cat:'Chatbots & IA', catClass:'cat-purple', author:'Amélie Chen', authorColor:'#7C3AED', authorInit:'AC', date:'24 mai 2026', read:'8 min', featured:true },
  { id:2, emoji:'⚡', title:'Make.com vs Zapier vs n8n : lequel choisir en 2026 ?', excerpt:'Comparatif complet des trois plateformes d\'automatisation les plus populaires. Prix, fonctionnalités, cas d\'usage.', cat:'Automatisation', catClass:'cat-cyan', author:'Lucas Bernard', authorColor:'#2563EB', authorInit:'LB', date:'20 mai 2026', read:'12 min', featured:true },
  { id:3, emoji:'🎯', title:'10 prompts avancés pour ChatGPT qui vont transformer votre productivité', excerpt:'Ces prompts utilisés par les experts IA vous feront gagner des heures chaque semaine.', cat:'Prompt Engineering', catClass:'cat-orange', author:'Marie Dupont', authorColor:'#D97706', authorInit:'MD', date:'18 mai 2026', read:'6 min', featured:false },
  { id:4, emoji:'📊', title:'Comment automatiser vos rapports mensuels avec n8n et Notion', excerpt:'Un workflow complet pour générer automatiquement vos KPIs et les envoyer à votre équipe chaque lundi matin.', cat:'Automatisation', catClass:'cat-cyan', author:'Nicolas Petit', authorColor:'#0891B2', authorInit:'NP', date:'15 mai 2026', read:'10 min', featured:false },
  { id:5, emoji:'🏪', title:'Cas client : +60% de ventes grâce à un agent IA sur Shopify', excerpt:'Comment une boutique e-commerce française a multiplié ses conversions avec un chatbot intelligent intégré au checkout.', cat:'Cas d\'usage', catClass:'cat-green', author:'Amélie Chen', authorColor:'#7C3AED', authorInit:'AC', date:'12 mai 2026', read:'7 min', featured:false },
  { id:6, emoji:'🔗', title:'Connecter HubSpot à ChatGPT : le guide complet', excerpt:'Automatisez vos séquences de nurturing et enrichissez vos fiches clients avec des résumés générés par IA.', cat:'No-Code', catClass:'cat-purple', author:'Antoine Moreau', authorColor:'#7C3AED', authorInit:'AM', date:'10 mai 2026', read:'9 min', featured:false },
  { id:7, emoji:'🧠', title:'LangChain pour les non-développeurs : premiers pas', excerpt:'LangChain n\'est plus réservé aux ingénieurs. Voici comment l\'utiliser pour créer des agents IA personnalisés.', cat:'Machine Learning', catClass:'cat-orange', author:'Sofia Martins', authorColor:'#0891B2', authorInit:'SM', date:'8 mai 2026', read:'11 min', featured:false },
  { id:8, emoji:'🎨', title:'Midjourney + Make.com : générer des visuels en masse automatiquement', excerpt:'Workflow complet pour alimenter vos réseaux sociaux avec des images IA générées automatiquement selon un calendrier.', cat:'Automatisation', catClass:'cat-cyan', author:'Julie Leclerc', authorColor:'#DB2777', authorInit:'JL', date:'5 mai 2026', read:'8 min', featured:false },
  { id:9, emoji:'📧', title:'Écrire des emails de prospection avec GPT-4 : les bonnes pratiques', excerpt:'Structure, personnalisation, A/B testing — comment utiliser l\'IA pour créer des campagnes email qui convertissent vraiment.', cat:'Prompt Engineering', catClass:'cat-orange', author:'Marie Dupont', authorColor:'#D97706', authorInit:'MD', date:'2 mai 2026', read:'5 min', featured:false },
];

function ArticleCard({ art, big }) {
  return (
    <div className={big ? 'featured-card' : 'blog-card'}>
      <div className={big ? 'card-thumb' : 'card-thumb card-thumb-sm'} style={{background:`linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.10))`}}>
        {art.emoji}
        <div className="card-thumb-overlay"/>
      </div>
      <div className={big ? 'card-body' : 'card-body card-body-sm'}>
        <div className={`card-cat ${art.catClass}`}>{art.cat}</div>
        <div className={big ? 'card-title' : 'card-title card-title-sm'}>{art.title}</div>
        <div className={big ? 'card-excerpt' : 'card-excerpt card-excerpt-sm'}>{art.excerpt}</div>
        <div className="card-meta">
          <div className="author-chip">
            <div className="author-av" style={{background:art.authorColor}}>{art.authorInit}</div>
            <span className="author-name">{art.author}</span>
          </div>
          <div className="meta-dot"/>
          <span className="meta-info">{art.date}</span>
          <div className="meta-dot"/>
          <Ic.Clock style={{color:'var(--text-3)'}}/>
          <span className="meta-info">{art.read}</span>
          <span className="read-more">Lire <Ic.Arrow style={{display:'inline',verticalAlign:'middle'}}/></span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [cat, setCat] = useState('Tous');
  const [query, setQuery] = useState('');
  const [email, setEmail] = useState('');
  const [subscribed, setSubscribed] = useState(false);

  useEffect(() => {
    const el = document.getElementById('cursor-glow');
    const move = e => { el.style.left = e.clientX+'px'; el.style.top = e.clientY+'px'; };
    window.addEventListener('mousemove', move, { passive: true });
    const handler = e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const span = document.createElement('span');
      span.className = 'btn-ripple-el';
      span.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
      btn.appendChild(span); setTimeout(() => span.remove(), 680);
    };
    document.addEventListener('click', handler);
    return () => { window.removeEventListener('mousemove', move); document.removeEventListener('click', handler); };
  }, []);

  const filtered = useMemo(() => {
    let list = ARTICLES;
    if (cat !== 'Tous') list = list.filter(a => a.cat === cat);
    if (query) { const q = query.toLowerCase(); list = list.filter(a => a.title.toLowerCase().includes(q) || a.excerpt.toLowerCase().includes(q)); }
    return list;
  }, [cat, query]);

  const featured = ARTICLES.filter(a => a.featured);
  const rest = filtered.filter(a => !a.featured);

  return (
    <React.Fragment>
      <nav className="nav"><div className="nav-inner">
        <a href="index.html" className="nav-logo">CreatorFlow <em>Market</em></a>
        <div style={{display:'flex',gap:10}}>
          <a href="dashboard-client.html" className="btn btn-ghost" style={{padding:'8px 16px',fontSize:13}}>Dashboard</a>
          <a href="nouveau-brief.html" className="btn btn-primary" style={{padding:'8px 16px',fontSize:13}}>Poster un brief</a>
        </div>
      </div></nav>

      <div className="page">
        <div className="hero">
          <div className="container">
            <div className="hero-tag"><Ic.Flame/>Ressources IA</div>
            <div className="hero-title">Apprenez, automatisez,<br/>passez au niveau <em>suivant</em></div>
            <div className="hero-sub">Guides pratiques, comparatifs et cas clients rédigés par nos experts certifiés.</div>
            <div className="search-bar">
              <Ic.Search style={{color:'var(--text-3)',flexShrink:0}}/>
              <input className="search-input" placeholder="Rechercher un article…" value={query} onChange={e=>setQuery(e.target.value)}/>
            </div>
          </div>
        </div>

        <div className="container fade-up">
          <div className="cats-row">
            {CATS.map(c=><div key={c} className={`cat-pill ${cat===c?'active':''}`} onClick={()=>setCat(c)}>{c}</div>)}
          </div>

          {/* Featured */}
          {cat === 'Tous' && !query && (
            <div style={{marginBottom:40}}>
              <div className="section-header"><div className="section-title">À la une</div></div>
              <div className="featured-grid">
                <ArticleCard art={featured[0]} big/>
                <div style={{display:'flex',flexDirection:'column',gap:20}}>
                  {featured.slice(1).map(a=><ArticleCard key={a.id} art={a}/>)}
                </div>
              </div>
            </div>
          )}

          {/* Main + Sidebar */}
          <div className="layout">
            <div>
              <div className="section-header">
                <div className="section-title">{cat === 'Tous' && !query ? 'Derniers articles' : `${filtered.length} article${filtered.length!==1?'s':''}`}</div>
              </div>
              <div className="blog-grid">
                {rest.map(a=><ArticleCard key={a.id} art={a}/>)}
              </div>

              {/* Newsletter */}
              <div className="newsletter">
                <div className="nl-title">La newsletter IA du vendredi</div>
                <div className="nl-sub">Les meilleures ressources, outils et cas clients de la semaine — directement dans votre boîte mail.</div>
                {subscribed ? (
                  <div style={{color:'var(--green)',fontWeight:700,fontSize:15}}>✓ Vous êtes inscrit !</div>
                ) : (
                  <div className="nl-form">
                    <input className="nl-input" type="email" placeholder="votre@email.com" value={email} onChange={e=>setEmail(e.target.value)}/>
                    <button className="btn btn-primary" onClick={()=>{ if(email) setSubscribed(true); }}>S'abonner</button>
                  </div>
                )}
                <div className="nl-stats">
                  <div className="nl-stat"><strong>4 200+</strong> abonnés</div>
                  <div className="nl-stat"><strong>Chaque vendredi</strong></div>
                  <div className="nl-stat"><strong>0 spam</strong> garanti</div>
                </div>
              </div>
            </div>

            {/* Sidebar */}
            <div>
              <div className="sidebar-card">
                <div className="sidebar-title">Tendances cette semaine</div>
                {ARTICLES.slice(0,5).map((a,i)=>(
                  <div key={a.id} className="trending-item">
                    <div className="trending-num">0{i+1}</div>
                    <div>
                      <div className="trending-title">{a.title}</div>
                      <div className="trending-meta"><Ic.Clock style={{display:'inline',verticalAlign:'middle',marginRight:3}}/>{a.read}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div className="sidebar-card">
                <div className="sidebar-title">Thèmes populaires</div>
                <div className="tag-cloud">
                  {['ChatGPT','Make.com','LangChain','n8n','Prompt','Zapier','Python','NLP','Automation','GPT-4','API','No-Code','Workflow'].map(t=>(
                    <div key={t} className="tag" onClick={()=>setQuery(t)}>{t}</div>
                  ))}
                </div>
              </div>
              <div className="sidebar-card">
                <div className="sidebar-title">Nos experts rédigent pour vous</div>
                {[{n:'Amélie Chen',s:'Chatbots & IA',c:'#7C3AED',i:'AC',art:12},{n:'Lucas Bernard',s:'Automatisation',c:'#2563EB',i:'LB',art:8},{n:'Sofia Martins',s:'Machine Learning',c:'#0891B2',i:'SM',art:6}].map((e,i)=>(
