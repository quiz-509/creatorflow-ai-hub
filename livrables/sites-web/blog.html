        .range((p-1)*PER, p*PER-1);
      if (c !== 'all')    q2 = q2.eq('category', c);
      if (search.trim())  q2 = q2.ilike('title', `%${search.trim()}%`);
      const { data, count, error } = await q2;
      if (error) throw error;
      if (p === 1) setArticles(data || []);
      else         setArticles(prev => [...prev, ...(data||[])]);
      setTotal(count || 0);
      setHasMore((count||0) > p * PER);
    } catch {
      const f = DEMO.filter(a => {
        if (c !== 'all' && a.category !== c) return false;
        if (search.trim() && !a.title.toLowerCase().includes(search.toLowerCase())) return false;
        return true;
      });
      setArticles(f);
      setTotal(f.length);
      setHasMore(false);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { setPage(1); load(cat, q, 1); }, [cat, q, load]);

  const featured = articles.find(a => a.is_featured) || articles[0];
  const grid     = articles.filter(a => a.id !== featured?.id);

  return (
    <div className="page">
      <nav className="nav">
        <div className="nav-inner">
          <a href="index.html" className="logo">CreatorFlow Market</a>
          <div className="nav-links">
            <a href="experts.html"  className="nav-link">Experts</a>
            <a href="briefs.html"   className="nav-link">Publier un brief</a>
            <a href="academie.html" className="nav-link">Academy</a>
            <a href="pricing.html"  className="nav-link">Tarifs</a>
            <a href="blog.html"     className="nav-link active">Blog IA</a>
          </div>
          <div className="nav-actions">
            <a href="connexion.html"    className="btn btn-ghost">Connexion</a>
            <a href="inscription.html"  className="btn btn-primary">Rejoindre</a>
          </div>
        </div>
      </nav>

      <div className="blog-hero">
        <div className="container">
          <div className="blog-badge"><span className="blog-badge-dot"/> CreatorFlow AI News Engine</div>
          <h1>Le meilleur de l'<span>Intelligence Artificielle</span><br/>pour les créateurs et entrepreneurs</h1>
          <p>Actualités IA, outils, stratégies et tutoriels publiés chaque semaine pour rester à la pointe.</p>
          <div className="blog-stats">
            <span className="blog-stat"><strong>{total || DEMO.length}+</strong> articles</span>
            <span className="blog-stat"><strong>7</strong> catégories</span>
            <span className="blog-stat"><strong>100%</strong> en français</span>
            <span className="blog-stat"><strong>Mis à jour</strong> chaque semaine</span>
          </div>
        </div>
      </div>

      {!loading && featured && (
        <div className="featured-section">
          <div className="container"><Featured article={featured}/></div>
        </div>
      )}

      <div className="filters-section">
        <div className="container">
          <div className="filters-inner">
            {CATS.map(c => (
              <button key={c.id} className={`filter-btn${cat===c.id?' active':''}`}
                style={cat===c.id?{background:c.color,borderColor:c.color}:{}}
                onClick={()=>setCat(c.id)}>
                {c.label}
              </button>
            ))}
            <div className="search-wrap">
              <span className="search-icon">🔍</span>
              <input type="text" placeholder="Rechercher..." value={q} onChange={e=>setQ(e.target.value)}/>
            </div>
          </div>
        </div>
      </div>

      <div className="articles-section">
        <div className="container">
          {loading && page===1 ? (
            <div className="articles-grid">
              {[1,2,3,4,5,6].map(i=>(
                <div key={i} className="article-card">
                  <div className="skeleton" style={{height:180}}/>
                  <div style={{padding:20,display:'flex',flexDirection:'column',gap:10}}>
                    <div className="skeleton" style={{height:18,width:'40%',borderRadius:999}}/>
                    <div className="skeleton" style={{height:22,width:'90%'}}/>
                    <div className="skeleton" style={{height:22,width:'70%'}}/>
                    <div className="skeleton" style={{height:56,marginTop:4}}/>
                  </div>
                </div>
              ))}
            </div>
          ) : grid.length===0&&!loading ? (
            <div className="empty-state">
              <div style={{fontSize:48,marginBottom:16}}>🔍</div>
              <h3>Aucun article trouvé</h3>
              <p style={{color:'var(--text-3)'}}>Essayez une autre catégorie ou un autre mot-clé.</p>
            </div>
          ) : (
            <div className="articles-grid">
              {grid.map(a=><ArticleCard key={a.id} article={a}/>)}
            </div>
          )}
          {hasMore && (
            <div className="load-more-wrap">
              <button className="load-more-btn" onClick={()=>{const n=page+1;setPage(n);load(cat,q,n);}} disabled={loading}>
                {loading?'Chargement…':"Voir plus d'articles"}
              </button>
            </div>
          )}
        </div>
      </div>

      <div className="newsletter-section">
        <div className="container">
          <div className="newsletter-card">
            <h2>🚀 Ne ratez aucune actualité IA</h2>
            <p>Recevez chaque semaine les meilleurs articles, outils et opportunités IA directement dans votre boîte mail.</p>
            {subDone ? (
              <div style={{color:'#10B981',fontWeight:700,fontSize:16}}>✅ Merci ! Vous êtes inscrit à la newsletter CreatorFlow AI.</div>
            ) : (
              <form className="nl-form" onSubmit={e=>{e.preventDefault();if(email)setSubDone(true);}}>
                <input type="email" className="nl-input" placeholder="votre@email.com" value={email} onChange={e=>setEmail(e.target.value)} required/>
                <button type="submit" className="nl-btn">S'abonner gratuitement</button>
              </form>
            )}
          </div>
        </div>
      </div>

      <footer className="footer">
        <div className="container">
          <div className="footer-inner">
            <span className="footer-logo">CreatorFlow Market</span>
            <div className="footer-links">
              <a href="index.html"    className="footer-link">Accueil</a>
              <a href="experts.html"  className="footer-link">Experts</a>
              <a href="academie.html" className="footer-link">Academy</a>
              <a href="pricing.html"  className="footer-link">Tarifs</a>
              <a href="cgu.html"      className="footer-link">CGU</a>
              <a href="politique-confidentialite.html" className="footer-link">Vie privée</a>
            </div>
            <span style={{fontSize:12,color:'var(--text-3)'}}>© 2026 CreatorFlow Market</span>
          </div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
