<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Créer un cours — CreatorFlow Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet"></noscript>
  <style>
:root{--bg:#04040A;--surf:#0C0C18;--surf-2:#101020;--surf-3:#14142A;--border:rgba(255,255,255,0.055);--border-2:rgba(255,255,255,0.10);--border-3:rgba(255,255,255,0.18);--text:#F4F4FF;--text-2:#9898B8;--text-3:#55557A;--v:#7C3AED;--v2:#6D28D9;--vs:#A78BFA;--vg:rgba(124,58,237,0.35);--c:#06B6D4;--green:#10B981;--amber:#F59E0B;--red:#EF4444;--r:12px;--r-lg:18px;--r-xl:24px;--f:'Inter',system-ui,sans-serif;--ease:cubic-bezier(0.16,1,0.3,1);--nav:60px;--foot:72px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}
body{font-family:var(--f);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}
textarea{resize:vertical;}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:300;height:var(--nav);display:flex;align-items:center;background:rgba(4,4,10,0.90);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1220px;margin:0 auto;padding:0 24px;}
.nav-back{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-2);transition:color 150ms;}
.nav-back:hover{color:var(--text);}
.nav-title{font-size:14px;font-weight:700;color:var(--text);}
.nav-logo em{font-style:normal;background:linear-gradient(135deg,var(--vs),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* ── PROGRESS STRIP ── */
.prog-strip{position:fixed;top:var(--nav);left:0;right:0;z-index:280;height:3px;background:rgba(255,255,255,0.05);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--v),var(--c));border-radius:0 2px 2px 0;transition:width 700ms var(--ease);}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:all 220ms var(--ease);cursor:pointer;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#9333EA,var(--v) 50%,var(--v2));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.10) inset,0 6px 20px -6px var(--vg);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px -6px rgba(124,58,237,0.6);}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-ghost{background:rgba(255,255,255,0.04);border:1px solid var(--border-2);color:var(--text-2);}
.btn-ghost:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.btn-ghost:disabled{opacity:0.4;cursor:not-allowed;}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-danger{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.18);color:var(--red);padding:5px 10px;font-size:11px;border-radius:8px;}
.btn-danger:hover{background:rgba(239,68,68,0.14);}
.btn-lg{padding:13px 28px;font-size:14px;font-weight:700;}

/* ── LAYOUT ── */
.creator-wrap{display:grid;grid-template-columns:1fr 380px;gap:28px;max-width:1220px;margin:0 auto;padding:calc(var(--nav) + 3px + 28px) 24px var(--foot);align-items:start;}
.creator-form{display:flex;flex-direction:column;gap:16px;}
.creator-sidebar{position:sticky;top:calc(var(--nav) + 3px + 20px);display:flex;flex-direction:column;gap:16px;}

/* ── FORM SECTIONS ── */
.fs{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:26px 28px;opacity:0;will-change:transform,opacity;}
.fs-head{margin-bottom:20px;}
.fs-lbl{font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--vs);margin-bottom:6px;}
.fs-title{font-size:16px;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px;}
.fs-sub{font-size:13px;color:var(--text-3);line-height:1.5;}

/* ── FIELDS ── */
.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.flabel{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;}
.flabel .req{color:var(--v);margin-left:3px;}
.flabel .counter{font-size:11px;font-weight:400;color:var(--text-3);}
.finput{width:100%;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--text);font-family:var(--f);outline:none;transition:border-color 200ms,box-shadow 200ms;}
.finput:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(124,58,237,0.10);}
.finput::placeholder{color:var(--text-3);}
textarea.finput{min-height:110px;resize:vertical;}
select.finput{cursor:pointer;}
.fhint{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.4;}
.ftitle-input{width:100%;background:transparent;border:none;border-bottom:2px solid var(--border-2);border-radius:0;padding:12px 2px;font-size:22px;font-weight:800;color:var(--text);font-family:var(--f);outline:none;letter-spacing:-0.03em;transition:border-color 200ms;}
.ftitle-input:focus{border-bottom-color:var(--v);}
.ftitle-input::placeholder{color:var(--text-3);font-weight:700;}

/* ── TIPS BLOCK ── */
.tips-block{background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.14);border-radius:10px;padding:12px 14px;margin-top:8px;}
.tips-head{font-size:11px;font-weight:700;color:var(--vs);margin-bottom:8px;}
.tip-chip{display:inline-flex;align-items:center;background:rgba(255,255,255,0.05);border:1px solid var(--border-2);border-radius:8px;padding:5px 12px;font-size:12px;color:var(--text-2);margin:3px;cursor:pointer;transition:all 150ms;text-align:left;}
.tip-chip:hover{background:rgba(124,58,237,0.10);border-color:rgba(124,58,237,0.3);color:var(--text);}

/* ── CATEGORY PILLS ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
.cat-pill{background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all 200ms var(--ease);text-align:center;}
.cat-pill:hover{border-color:var(--border-3);background:rgba(255,255,255,0.04);}
.cat-pill.active{background:rgba(124,58,237,0.12);border-color:rgba(124,58,237,0.40);box-shadow:0 0 0 1px rgba(124,58,237,0.20) inset;}
.cat-pill-icon{font-size:20px;}
.cat-pill-name{font-size:11px;font-weight:600;color:var(--text-2);}
.cat-pill.active .cat-pill-name{color:var(--vs);}

/* ── LEVEL + LANGUE ROW ── */
.seg-row{display:flex;gap:6px;}
.seg-btn{flex:1;background:var(--surf-2);border:1px solid var(--border-2);border-radius:8px;padding:9px 4px;font-size:12px;font-weight:600;color:var(--text-3);cursor:pointer;transition:all 150ms;text-align:center;}
.seg-btn:hover{color:var(--text-2);}
.seg-btn.active{background:rgba(124,58,237,0.12);border-color:rgba(124,58,237,0.35);color:var(--vs);}

/* ── PRICE OPTIONS ── */
.price-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.price-opt{background:var(--surf-2);border:2px solid var(--border-2);border-radius:var(--r-lg);padding:18px 16px;cursor:pointer;transition:all 220ms var(--ease);text-align:left;}
.price-opt:hover{border-color:var(--border-3);}
.price-opt.active{border-color:var(--v);background:rgba(124,58,237,0.08);}
.price-opt-icon{font-size:24px;margin-bottom:8px;}
.price-opt-title{font-size:15px;font-weight:800;margin-bottom:3px;}
.price-opt-desc{font-size:12px;color:var(--text-3);line-height:1.4;}
.price-opt.active .price-opt-title{color:var(--vs);}
.price-input-row{display:flex;align-items:center;gap:8px;background:var(--surf-2);border:1px solid var(--border-2);border-radius:10px;padding:4px 14px;transition:border-color 200ms,box-shadow 200ms;}
.price-input-row:focus-within{border-color:var(--v);box-shadow:0 0 0 3px rgba(124,58,237,0.10);}
.price-sym{font-size:16px;font-weight:700;color:var(--text-3);}
.price-num{flex:1;background:none;border:none;outline:none;font-size:24px;font-weight:900;color:var(--text);font-family:var(--f);padding:10px 0;letter-spacing:-0.03em;}
.price-num::placeholder{color:var(--text-3);}
.price-suffix{font-size:13px;color:var(--text-3);font-weight:600;}

/* ── IMAGE PREVIEW ── */
.img-preview{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--surf-3);border:1px dashed var(--border-2);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:10px;transition:border-color 200ms;}
.img-preview img{width:100%;height:100%;object-fit:cover;}
.img-preview.has-img{border-style:solid;border-color:var(--border-2);}

/* ── MODULE BUILDER ── */
.modules-stack{display:flex;flex-direction:column;gap:12px;}
.mod-card{background:var(--surf-2);border:1px solid var(--border-2);border-radius:var(--r-lg);overflow:hidden;transition:border-color 200ms;}
.mod-card.open{border-color:rgba(124,58,237,0.25);}
.mod-header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
.mod-drag{color:var(--text-3);font-size:14px;cursor:grab;flex-shrink:0;padding:2px;}
.mod-badge{font-size:10px;font-weight:800;letter-spacing:0.08em;color:var(--text-3);background:var(--surf-3);padding:3px 8px;border-radius:6px;flex-shrink:0;}
.mod-name{flex:1;background:none;border:none;outline:none;font-size:14px;font-weight:700;color:var(--text);font-family:var(--f);letter-spacing:-0.01em;}
.mod-name::placeholder{color:var(--text-3);}
.mod-toggle{color:var(--text-3);font-size:12px;flex-shrink:0;transition:transform 200ms;}
.mod-toggle.open{transform:rotate(180deg);}
.mod-body{border-top:1px solid var(--border);padding:8px;}
.lesson-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;transition:background 150ms;}
.lesson-row:hover{background:var(--surf-3);}
.l-type{background:var(--surf-3);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--text-2);font-family:var(--f);outline:none;cursor:pointer;flex-shrink:0;}
.l-title{flex:1;background:none;border:none;border-bottom:1px solid transparent;outline:none;font-size:13px;color:var(--text);font-family:var(--f);padding:4px 0;min-width:0;transition:border-color 150ms;}
.l-title:focus{border-bottom-color:var(--border-2);}
.l-title::placeholder{color:var(--text-3);}
.l-url{width:160px;background:var(--surf-3);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:11px;color:var(--text-2);font-family:var(--f);outline:none;flex-shrink:0;}
.l-url::placeholder{color:var(--text-3);}
.l-dur{width:54px;background:var(--surf-3);border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-size:11px;color:var(--text);font-family:var(--f);outline:none;text-align:center;flex-shrink:0;}
.l-preview-lbl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-3);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-lesson-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--c);background:rgba(6,182,212,0.04);border:1px dashed rgba(6,182,212,0.25);margin-top:4px;transition:all 150ms;}
.add-lesson-btn:hover{background:rgba(6,182,212,0.10);border-color:rgba(6,182,212,0.4);}
.add-mod-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:var(--r-lg);font-size:13px;font-weight:700;color:var(--vs);background:rgba(124,58,237,0.05);border:1px dashed rgba(124,58,237,0.25);transition:all 150ms;}
.add-mod-btn:hover{background:rgba(124,58,237,0.10);border-color:rgba(124,58,237,0.4);}

/* ── SIDEBAR: LIVE PREVIEW ── */
.preview-card{background:var(--surf);border:1px solid var(--border-2);border-radius:var(--r-xl);overflow:hidden;}
.preview-label{font-size:10px;font-weight:700;letter-spacing:0.10em;text-transform:uppercase;color:var(--text-3);padding:14px 16px 0;margin-bottom:12px;}
.preview-thumb{width:100%;aspect-ratio:16/9;background:var(--surf-3);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;}
.preview-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.preview-cat-badge{position:absolute;top:8px;left:8px;background:rgba(6,182,212,0.9);backdrop-filter:blur(8px);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:0.04em;text-transform:uppercase;}
.preview-price-badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;}
.preview-price-badge.free{background:rgba(16,185,129,0.9);color:#fff;}
.preview-price-badge.paid{background:rgba(4,4,10,0.85);border:1px solid rgba(255,255,255,0.15);color:var(--text);}
.preview-body{padding:14px 16px;}
.preview-cat-text{font-size:10px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;}
.preview-title{font-size:14px;font-weight:800;line-height:1.35;margin-bottom:8px;letter-spacing:-0.02em;min-height:18px;}
.preview-title.empty{color:var(--text-3);font-weight:500;font-style:italic;font-size:13px;}
.preview-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.preview-tag{font-size:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--text-3);}
.preview-instr{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
.preview-instr-av{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--surf-3);flex-shrink:0;}
.preview-instr-av img{width:100%;height:100%;object-fit:cover;}
.preview-instr-name{font-size:12px;color:var(--text-2);}
.preview-price-row{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border);margin-top:10px;}
.preview-price-big{font-size:20px;font-weight:900;letter-spacing:-0.03em;}
.preview-price-big.free{color:var(--green);}
.preview-enroll-btn{padding:7px 16px;border-radius:999px;font-size:11px;font-weight:700;background:linear-gradient(135deg,var(--v),var(--v2));color:#fff;}

/* ── SIDEBAR: READINESS CARD ── */
.readiness-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r-xl);padding:20px;}
.readiness-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.readiness-title{font-size:14px;font-weight:800;letter-spacing:-0.01em;}
.score-ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;letter-spacing:-0.03em;flex-shrink:0;position:relative;}
.readiness-bar-wrap{height:6px;background:var(--surf-3);border-radius:99px;overflow:hidden;margin-bottom:16px;}
.readiness-bar-fill{height:100%;border-radius:99px;transition:width 600ms var(--ease),background 400ms;}
.r-checks{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;}
.r-check{display:flex;align-items:center;gap:9px;font-size:12px;}
.r-check-icon{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;flex-shrink:0;}
.r-check.ok .r-check-icon{background:rgba(16,185,129,0.15);color:var(--green);}
.r-check.miss .r-check-icon{background:rgba(255,255,255,0.04);color:var(--text-3);}
.r-check.ok{color:var(--text-2);}
.r-check.miss{color:var(--text-3);}

/* ── STICKY FOOTER ── */
.sticky-foot{position:fixed;bottom:0;left:0;right:0;z-index:300;height:var(--foot);background:rgba(4,4,10,0.94);backdrop-filter:blur(24px);border-top:1px solid var(--border);}
.sticky-foot-inner{max-width:1220px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.foot-left{display:flex;align-items:center;gap:12px;}
.foot-score-lbl{font-size:12px;color:var(--text-3);}
.foot-right{display:flex;align-items:center;gap:10px;}

/* ── SUCCESS ── */
.success-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.success-inner{text-align:center;max-width:480px;}
.success-icon{font-size:72px;margin-bottom:20px;display:block;}
.success-title{font-size:28px;font-weight:900;letter-spacing:-0.04em;margin-bottom:10px;}
.success-sub{font-size:15px;color:var(--text-2);margin-bottom:32px;line-height:1.7;}
.success-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .creator-wrap{grid-template-columns:1fr;}
  .creator-sidebar{position:static;}
  .creator-sidebar .preview-card{display:none;}
}
@media(max-width:768px){
  .cat-grid{grid-template-columns:repeat(4,1fr);}
  .price-opts{grid-template-columns:1fr 1fr;}
  .sticky-foot-inner{gap:8px;}
  .foot-score-lbl{display:none;}
}
@media(max-width:480px){
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  .creator-wrap{padding-left:16px;padding-right:16px;}
  .l-url{display:none;}
}
  </style>
</head>

<div id="root"></div>

<script>
